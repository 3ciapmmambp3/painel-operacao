<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>(function(){var s;try{s=localStorage.getItem('poe_theme');}catch(e){}document.documentElement.setAttribute('data-theme', s||'dark');})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de OS — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <style>
    body{display:flex;flex-direction:column;min-height:100vh;}
    .wrap{width:100%;max-width:1280px;margin:0 auto;padding:18px 20px 60px;flex:1;}
    .hero{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--gold-bg),transparent);border:1px solid var(--gold-border);border-radius:12px;padding:14px 18px;margin-bottom:16px;flex-wrap:wrap;}
    .hero .ic{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;background:var(--bg-dark);border:1px solid var(--gold-border);font-size:22px;}
    .hero h1{font-size:18px;color:var(--text-white);letter-spacing:.4px;}
    .hero .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;font-family:inherit;}
    .btn-gold{background:var(--gold);color:#1a1000;}
    .btn-outline{background:none;border-color:var(--border-hover);color:var(--text-muted);}
    .btn-outline:hover{border-color:var(--gold);color:var(--gold);}
    .btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);}
    .input,select.input,textarea.input{width:100%;padding:9px 11px;background:var(--bg-input);border:1px solid var(--border-hover);border-radius:7px;color:var(--text-white);font-size:13px;font-family:inherit;outline:none;}
    .input:focus{border-color:var(--gold);}
    .lbl{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:5px;display:block;}
    .resumo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .rchip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--text-muted);cursor:pointer;font-weight:600;}
    .rchip:hover{border-color:var(--gold-border);}
    .rchip.on{border-color:var(--gold);color:var(--text-white);background:var(--gold-bg);}
    .rchip .c{background:var(--bg-dark);padding:0 7px;border-radius:20px;font-weight:800;color:var(--text-white);font-size:12px;}
    .rchip .d{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .lista{display:flex;flex-direction:column;gap:8px;}
    .osrow{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:11px 14px;cursor:pointer;flex-wrap:wrap;}
    .osrow:hover{border-color:var(--gold-border);}
    .osrow .et{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
    .osrow-main{flex:1;min-width:170px;}
    .osrow-main .num{font-weight:800;color:var(--text-white);font-size:13px;}
    .osrow-main .op{font-size:12.5px;color:var(--text-muted);line-height:1.35;}
    .osrow-meta{display:flex;align-items:center;gap:8px;}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;}
    .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94%);max-height:90vh;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;z-index:61;padding:20px;}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg-card);border-left:1px solid var(--border);z-index:61;overflow-y:auto;padding:20px;}
    .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .mh h2{font-size:16px;color:var(--text-white);}
    .x{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .anexo{display:flex;align-items:center;gap:8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12.5px;margin-top:6px;}
    .anexo a{color:var(--gold-light);font-weight:600;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hist{border-left:2px solid var(--border);padding-left:12px;margin-left:4px;}
    .hist .it{position:relative;padding:6px 0;}
    .hist .it::before{content:'';position:absolute;left:-17px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--gold);}
    .stepper{margin-top:18px;}
    .step{display:flex;gap:12px;position:relative;padding-bottom:16px;}
    .step:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border);}
    .step.done:not(:last-child)::before{background:#10b981;}
    .sdot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg-dark);border:2px solid var(--border);color:var(--text-hint);z-index:1;}
    .sdot.done{background:#10b981;border-color:#10b981;color:#06231a;}
    .sdot.cur{background:var(--bg-card);border-color:var(--c,#f59e0b);color:var(--c,#f59e0b);}
    .sdot.cancel{background:#ef4444;border-color:#ef4444;color:#fff;}
    .sbody{flex:1;padding-top:1px;}
    .stit{font-size:14px;font-weight:700;color:var(--text-white);line-height:1.25;}
    .step.pend .stit{color:var(--text-muted);font-weight:600;}
    .sdesc{font-size:12px;color:var(--text-muted);margin:2px 0;}
    .sstat{font-size:11.5px;font-weight:700;color:var(--text-hint);}
    .sstat.done{color:#10b981;}
    .sstat.cur{color:#f59e0b;}
    .sobs{font-size:12px;font-style:italic;color:var(--text-muted);margin-top:3px;}
    .sbtn{margin-top:8px;padding:6px 12px;font-size:12px;}
    .docrow{display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:7px;text-decoration:none;}
    a.docrow:hover{border-color:var(--gold-border);}
    .docrow.off{opacity:.5;}
    .dic{font-size:20px;}
    .dinfo{flex:1;display:flex;flex-direction:column;line-height:1.3;}
    .dinfo b{font-size:13px;color:var(--text-white);font-weight:600;}
    .dinfo small{font-size:11px;color:var(--text-hint);}
    .dgo{color:var(--gold-light);font-weight:700;}
    .noacc{max-width:480px;margin:60px auto;text-align:center;color:var(--text-muted);}
  </style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="header-shields"><img src="assets/escudo-cpe.png" alt="CPE" onerror="this.style.display='none'"><img src="assets/escudo-pmmg.png" alt="PMMG" onerror="this.style.display='none'"><img src="assets/brasao-bpmmamb.png" alt="BPM MAMB" onerror="this.style.display='none'"></div><div class="header-div"></div>
    <div class="header-title"><div class="header-kicker">CPE · BPM MAmb · 3ª Cia PM MAmb</div>
      <h1>PAINEL DE GESTÃO OPERACIONAL</h1>
      <p>Controle de Ordens de Serviço</p>
    </div>
  </div>
  <div class="header-right">
    <div id="user-info" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;" onclick="window.location.href='perfil.html'" title="Meu Perfil">
      <span id="user-avatar" style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;">?</span>
      <span id="user-nome">—</span>
    </div>
    <button class="btn-outline" onclick="sessionStorage.removeItem('poe_sessao_v2');localStorage.removeItem('poe_sessao_v2');window.location.href='index.html'">Sair</button>
  </div>
</header>
<script src="topnav.js" data-ativo="p3"></script>

<div class="wrap">
  <div id="conteudo" style="display:none;">
    <div class="hero">
      <div class="ic">📋</div>
      <div><h1>Controle de Ordens de Serviço</h1><div class="sub">Acompanhe a tramitação de cada OS — da elaboração à execução.</div></div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
        <select id="f-ano" class="input" style="width:auto;" onchange="render()"></select>
        <button class="btn btn-outline" onclick="carregar()">☰ Atualizar</button>
        <button class="btn btn-gold" onclick="abrirNova()">＋ Nova OS</button>
      </div>
    </div>
    <div id="resumo" class="resumo"></div>
    <div id="lista" class="lista"></div>
  </div>
  <div id="semacesso" class="noacc" style="display:none;">
    <div style="font-size:40px;">🔒</div>
    <h2 style="color:var(--text-white);margin:10px 0 6px;">Acesso restrito</h2>
    <p>O Controle de Ordens de Serviço é exclusivo do <b>Auxiliar P3</b> e do <b>Administrador Geral</b>.</p>
  </div>
</div>

<div id="modais"></div>

<script>
const S = sessaoLer();
if(!S || !S.token){ window.location.href='index.html'; }
const PODE = S && (S.nivel_acesso==='admin_geral' || (S.funcao||'').toLowerCase().startsWith('aux p3'));
const MATR = S ? (S.nome_guerra || S.nome_completo || S.matricula || '') : '';
(function initUser(){ try{ const n=document.getElementById('user-nome'); if(n) n.textContent = S.nome_guerra||S.nome_completo||'—'; const a=document.getElementById('user-avatar'); if(a) a.textContent=(S.nome_guerra||S.nome_completo||'?').trim().charAt(0).toUpperCase(); }catch(e){} })();

const ETAPAS = [
  {k:'elaboracao', l:'Elaboração', t:'OS cadastrada', d:'Ordem de Serviço elaborada e cadastrada.', c:'#9e9e9e', ic:'📝'},
  {k:'aguardando_autorizacao', l:'Aguardando autorização', t:'P3/BPM MAmb — Autorização', d:'Aguardando autorização da operação', c:'#f59e0b', ic:'⏳'},
  {k:'autorizada', l:'Autorizada', t:'Autorizada', d:'Operação autorizada pela P3/BPM MAmb.', c:'#3b82f6', ic:'✅'},
  {k:'sdv', l:'Aguardando SDV', t:'Auxiliar P1 — Lançamento no SDV', d:'Lançamento das diárias no SDV.', c:'#a855f7', ic:'💰'},
  {k:'paf', l:'Cadastro no PAF', t:'Cadastrada a Op no PAF', d:'Operação cadastrada no Plano Anual de Fiscalização.', c:'#14b8a6', ic:'🌲'},
  {k:'encaminhada', l:'Aguardando encaminhamento', t:'Encaminhamento ao Grupamento', d:'OS encaminhada ao Grupamento responsável.', c:'#06b6d4', ic:'📨'},
  {k:'execucao', l:'Em execução', t:'Execução da operação', d:'Grupamento executando a operação.', c:'#10b981', ic:'🚔', auto:true},
];
const EINFO = Object.fromEntries(ETAPAS.map(e=>[e.k,e]));
EINFO.concluida={k:'concluida',l:'Concluída',t:'Concluída',d:'Operação finalizada.',c:'#6b7280',ic:'🏁',auto:true}; EINFO.cancelada={k:'cancelada',l:'Cancelada',c:'#ef4444',ic:'✖'};
// Última etapa que o Aux P3 conclui MANUALMENTE (daqui pra frente é pela data).
const ULTIMA_MANUAL = 'encaminhada';

let OS = [];
let FILTRO = '';

function hojeLocal(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Sequência de etapas aplicável a ESTA OS (pula SDV sem diárias e PAF se não for do PAF).
function sequencia(os){ return ETAPAS.filter(e=> (e.k!=='sdv'||os.com_diarias) && (e.k!=='paf'||os.is_paf) ).map(e=>e.k); }
// Etapa EFETIVA: após o encaminhamento, "em execução"/"concluída" saem da DATA da operação.
function etapaEfetiva(os){
  if(os.etapa==='encaminhada' && os.data_operacao_inicio){
    const hoje=hojeLocal(); const fim=os.data_operacao_fim||os.data_operacao_inicio;
    if(hoje>fim) return 'concluida';
    if(hoje>=os.data_operacao_inicio) return 'execucao';
  }
  return os.etapa;
}
function proxEtapa(os){ const seq=sequencia(os); const i=seq.indexOf(os.etapa); if(i<0||i>=seq.length-1) return null; const nx=seq[i+1]; return (EINFO[nx] && EINFO[nx].auto)? null : nx; }
function antEtapa(os){ const seq=sequencia(os); const i=seq.indexOf(os.etapa); return i>0? seq[i-1] : null; }
function diasNa(os){ const d=os.atualizado_em? Math.floor((Date.now()-new Date(os.atualizado_em))/86400000):0; return d; }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function carregar(){
  if(!PODE) return;
  try{ OS = await _sbRpc('os_listar', { p_token: S.token }) || []; }
  catch(e){ alert('Erro ao carregar: '+e.message); OS=[]; }
  // popular filtro de ano
  const anos=[...new Set(OS.map(o=>o.ano))].sort((a,b)=>b-a); if(!anos.length) anos.push(new Date().getFullYear());
  const fa=document.getElementById('f-ano'); const cur=fa.value;
  fa.innerHTML = anos.map(a=>`<option value="${a}">${a}</option>`).join('');
  fa.value = (cur && anos.includes(+cur))? cur : anos[0];
  render();
}

function render(){
  const ano = +document.getElementById('f-ano').value;
  const lista = OS.filter(o=> o.ano===ano);
  const ef = o => etapaEfetiva(o);
  const res=document.getElementById('resumo');
  const fin = lista.filter(o=> ef(o)==='concluida' || ef(o)==='cancelada').length;
  res.innerHTML = `<div class="rchip ${FILTRO===''?'on':''}" onclick="setFiltro('')">Todas <span class="c">${lista.length}</span></div>`
    + ETAPAS.map(et=>{ const n=lista.filter(o=>ef(o)===et.k).length; return `<div class="rchip ${FILTRO===et.k?'on':''}" onclick="setFiltro('${et.k}')"><span class="d" style="background:${et.c}"></span>${et.l} <span class="c">${n}</span></div>`; }).join('')
    + (fin? `<div class="rchip ${FILTRO==='_fim'?'on':''}" onclick="setFiltro('_fim')">🏁 Finalizadas <span class="c">${fin}</span></div>`:'');

  const ord = Object.fromEntries([...ETAPAS,EINFO.concluida,EINFO.cancelada].map((e,i)=>[e.k,i]));
  let fl = lista;
  if(FILTRO==='_fim') fl = lista.filter(o=> ef(o)==='concluida' || ef(o)==='cancelada');
  else if(FILTRO) fl = lista.filter(o=> ef(o)===FILTRO);
  fl = fl.slice().sort((a,b)=> ((ord[ef(a)]??9)-(ord[ef(b)]??9)) || (b.numero-a.numero));
  const el=document.getElementById('lista');
  el.innerHTML = fl.length ? fl.map(rowHtml).join('') : '<div style="padding:22px;color:var(--text-hint);text-align:center;">Nenhuma OS nesta visão.</div>';
}
function setFiltro(k){ FILTRO=k; render(); }

function rowHtml(o){
  const ek=etapaEfetiva(o); const e=EINFO[ek]||{}; const dias=diasNa(o);
  return `<div class="osrow" onclick="abrirDetalhe('${o.id}')">
    <span class="et" style="background:${e.c}22;color:${e.c};border:1px solid ${e.c}55;">${e.ic||''} ${e.l||ek}</span>
    <div class="osrow-main">
      <div class="num">OS ${String(o.numero).padStart(3,'0')}.3/${o.ano}</div>
      <div class="op">${esc(o.operacao||'(sem nome)')}${o.grupamento?' · <span style="color:var(--text-hint)">'+esc(o.grupamento)+'</span>':''}</div>
    </div>
    <div class="osrow-meta">
      ${o.com_diarias?'<span class="chip" style="background:rgba(168,85,247,.15);color:#c084fc;">💰</span>':''}
      <span title="OS" style="${o.os_url?'':'opacity:.3'}">📄</span>
      ${o.com_diarias?`<span title="Planilha" style="${o.planilha_url?'':'opacity:.3'}">📊</span>`:''}
      <span class="chip" style="background:var(--bg-dark);color:var(--text-hint);">${dias}d</span>
    </div>
  </div>`;
}

/* ───────── Nova / Editar OS ───────── */
async function abrirNova(){
  let num='';
  try{ num = await _sbRpc('os_proximo_numero', { p_token:S.token, p_ano:new Date().getFullYear() }); }catch(e){}
  modalOS({ id:null, ano:new Date().getFullYear(), numero:num, operacao:'', descricao:'', com_diarias:false, grupamento:'', os_url:'', os_arquivo:'', planilha_url:'', planilha_arquivo:'' });
}
function abrirEditar(o){ modalOS(o); }

function modalOS(o){
  const novo = !o.id;
  document.getElementById('modais').innerHTML = `
  <div class="modal-bg" onclick="fecharModal()"></div>
  <div class="modal">
    <div class="mh"><h2>${novo?'Nova Ordem de Serviço':'Editar OS'}</h2><button class="x" onclick="fecharModal()">✕</button></div>
    <div class="row2">
      <div><label class="lbl">Ano</label><input class="input" id="m-ano" type="number" value="${o.ano}"></div>
      <div><label class="lbl">Número</label><input class="input" id="m-num" type="number" value="${o.numero||''}"></div>
    </div>
    <div style="margin-top:10px;"><label class="lbl">Operação</label><input class="input" id="m-op" value="${esc(o.operacao||'')}" placeholder="Ex.: Operação Extraordinária em Pedra Azul"></div>
    <div style="margin-top:10px;"><label class="lbl">Grupamento de destino</label><input class="input" id="m-gp" value="${esc(o.grupamento||'')}" placeholder="Ex.: 5º Pelotão / 1º Gp MAmb"></div>
    <div style="margin-top:10px;"><label class="lbl">Descrição / observações</label><textarea class="input" id="m-desc" rows="2">${esc(o.descricao||'')}</textarea></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--text-white);cursor:pointer;">
      <input type="checkbox" id="m-diarias" ${o.com_diarias?'checked':''} onchange="document.getElementById('box-planilha').style.display=this.checked?'block':'none'"> Operação com <b>pagamento de diárias</b> (ativa a etapa do SDV / P1)
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--text-white);cursor:pointer;">
      <input type="checkbox" id="m-paf" ${o.is_paf?'checked':''}> Operação do <b>PAF</b> (ativa a etapa "Cadastrada a Op no PAF" antes do encaminhamento)
    </label>
    <div class="row2" style="margin-top:12px;">
      <div><label class="lbl">Início da operação <span style="font-weight:400;color:var(--text-hint)">(execução/conclusão automáticas)</span></label><input class="input" id="m-dini" type="date" value="${o.data_operacao_inicio||''}"></div>
      <div><label class="lbl">Fim da operação</label><input class="input" id="m-dfim" type="date" value="${o.data_operacao_fim||''}"></div>
    </div>
    <div style="margin-top:12px;"><label class="lbl">📎 Documento de origem <span style="font-weight:400;color:var(--text-hint)">(opcional — ofício/requisição que deu causa à OS)</span></label>
      <input type="file" id="m-dc-file" accept="application/pdf,image/*,.doc,.docx" onchange="subir(this,'origem')" style="font-size:12px;">
      <div id="m-dc-lista"></div>
    </div>
    <div style="margin-top:12px;"><label class="lbl">📄 Ordem de Serviço (PDF)</label>
      <input type="file" id="m-os-file" accept="application/pdf" onchange="subir(this,'os')" style="font-size:12px;">
      <div id="m-os-lista"></div>
    </div>
    <div id="box-planilha" style="margin-top:12px;display:${o.com_diarias?'block':'none'};"><label class="lbl">📊 Planilha de diárias (Excel/PDF)</label>
      <input type="file" id="m-pl-file" accept=".xlsx,.xls,application/pdf" onchange="subir(this,'planilha')" style="font-size:12px;">
      <div id="m-pl-lista"></div>
    </div>
    <div id="m-erro" style="color:var(--danger);font-size:12.5px;margin-top:10px;"></div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-gold" style="flex:1;justify-content:center;" onclick="salvarOS('${o.id||''}')">Salvar</button>
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>`;
  _anx = { os_url:o.os_url||'', os_arquivo:o.os_arquivo||'', planilha_url:o.planilha_url||'', planilha_arquivo:o.planilha_arquivo||'', doc_origem_url:o.doc_origem_url||'', doc_origem_arquivo:o.doc_origem_arquivo||'' };
  renderAnx();
}
let _anx = {};
function renderAnx(){
  const d=document.getElementById('m-dc-lista'); if(d) d.innerHTML = _anx.doc_origem_url? `<div class="anexo"><a href="${esc(_anx.doc_origem_url)}" target="_blank">📎 ${esc(_anx.doc_origem_arquivo||'documento')}</a><button class="x" onclick="_anx.doc_origem_url='';_anx.doc_origem_arquivo='';renderAnx()">✕</button></div>`:'';
  const o=document.getElementById('m-os-lista'); if(o) o.innerHTML = _anx.os_url? `<div class="anexo"><a href="${esc(_anx.os_url)}" target="_blank">📄 ${esc(_anx.os_arquivo||'OS.pdf')}</a><button class="x" onclick="_anx.os_url='';_anx.os_arquivo='';renderAnx()">✕</button></div>`:'';
  const p=document.getElementById('m-pl-lista'); if(p) p.innerHTML = _anx.planilha_url? `<div class="anexo"><a href="${esc(_anx.planilha_url)}" target="_blank">📊 ${esc(_anx.planilha_arquivo||'planilha')}</a><button class="x" onclick="_anx.planilha_url='';_anx.planilha_arquivo='';renderAnx()">✕</button></div>`:'';
}
function b64f(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);}); }
async function subir(inp, tipo){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  if(f.size>15*1048576){ alert('Arquivo acima de 15 MB.'); return; }
  const rot={os:'a OS',planilha:'a planilha',origem:'o documento de origem'}[tipo]||'o anexo';
  const er=document.getElementById('m-erro'); er.textContent='Enviando '+rot+'…';
  try{
    const DRIVE = (typeof OFICIOS_DRIVE_URL!=='undefined')?OFICIOS_DRIVE_URL:'';
    if(!DRIVE){ throw new Error('Upload do Drive não configurado — cole o link do arquivo manualmente.'); }
    const payload={nome:f.name,mime:f.type||'application/octet-stream',ano:document.getElementById('m-ano').value,subpasta:'ordens-servico',base64:await b64f(f)};
    const r=await fetch(DRIVE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('Drive '+r.status); const j=await r.json();
    if(!j||!j.link) throw new Error(j&&j.erro?j.erro:'Drive sem link');
    if(tipo==='os'){ _anx.os_url=j.link; _anx.os_arquivo=f.name; }
    else if(tipo==='origem'){ _anx.doc_origem_url=j.link; _anx.doc_origem_arquivo=f.name; }
    else { _anx.planilha_url=j.link; _anx.planilha_arquivo=f.name; }
    er.textContent=''; renderAnx();
  }catch(e){ er.textContent='Erro no anexo: '+(e.message||e); }
}
async function salvarOS(id){
  const er=document.getElementById('m-erro'); er.textContent='';
  const dados={
    ano: +document.getElementById('m-ano').value,
    numero: document.getElementById('m-num').value,
    operacao: document.getElementById('m-op').value.trim(),
    grupamento: document.getElementById('m-gp').value.trim(),
    descricao: document.getElementById('m-desc').value.trim(),
    com_diarias: document.getElementById('m-diarias').checked,
    is_paf: document.getElementById('m-paf').checked,
    data_operacao_inicio: document.getElementById('m-dini').value || '',
    data_operacao_fim: document.getElementById('m-dfim').value || '',
    os_url:_anx.os_url, os_arquivo:_anx.os_arquivo, planilha_url:_anx.planilha_url, planilha_arquivo:_anx.planilha_arquivo,
    doc_origem_url:_anx.doc_origem_url, doc_origem_arquivo:_anx.doc_origem_arquivo
  };
  if(!dados.operacao){ er.textContent='Informe a operação.'; return; }
  try{ await _sbRpc('os_salvar', { p_token:S.token, p_id: id||null, p_dados: dados }); fecharModal(); await carregar(); }
  catch(e){ er.textContent = e.message; }
}
function fecharModal(){ document.getElementById('modais').innerHTML=''; }

/* ───────── Detalhe / tramitação ───────── */
async function abrirDetalhe(id){
  const o = OS.find(x=>x.id===id); if(!o) return;
  let hist=[]; try{ hist = await _sbRpc('os_historico', { p_token:S.token, p_id:id }) || []; }catch(e){}
  const fmt = d => d? new Date(d+'T00:00').toLocaleDateString('pt-BR') : '';
  const fmtDT = ts => { if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
  const hbe = {}; hist.forEach(h=>{ hbe[h.etapa]=h; });
  const seq = sequencia(o);                       // etapas aplicáveis a ESTA OS
  const efet = etapaEfetiva(o);                   // etapa considerando a data da operação
  const finalStored = (o.etapa==='concluida' || o.etapa==='cancelada');  // trava botões
  const finalEf = (efet==='concluida' || efet==='cancelada');            // exibição
  const ant = antEtapa(o), prox = proxEtapa(o);   // prox = próxima etapa MANUAL (null se a próxima é por data)
  const ini = o.data_operacao_inicio, dfim = o.data_operacao_fim;

  let cur;
  if(efet==='concluida') cur = seq.length;
  else if(efet==='cancelada'){ const idxs=hist.map(h=>seq.indexOf(h.etapa)).filter(i=>i>=0); cur=idxs.length?Math.max(...idxs):0; }
  else cur = Math.max(0, seq.indexOf(efet));

  const stepper = seq.map((k,i)=>{
    const et=EINFO[k];
    const st = i<cur ? 'done' : (i===cur && efet==='cancelada') ? 'cancel' : (i===cur && !finalEf) ? 'cur' : 'pend';
    const h = hbe[k];
    let desc = et.d;
    if(k==='aguardando_autorizacao' && o.com_diarias) desc='Aguardando autorização da operação e das diárias.';
    if(k==='execucao') desc = ini ? ('Início em '+fmt(ini)+(dfim?(' · término em '+fmt(dfim)):'')+' — automático pela data.') : 'Defina o período da operação para ativar automaticamente.';
    let sttxt;
    if(st==='done') sttxt = (h&&h.criado_em?('Concluído · '+fmtDT(h.criado_em)):'Concluído');
    else if(st==='cur') sttxt = (k==='encaminhada') ? (ini?'Encaminhada · aguardando a data da operação':'Encaminhada · defina o período') : 'Etapa atual';
    else if(st==='cancel') sttxt='Cancelada nesta etapa';
    else sttxt = et.auto? 'Automático pela data' : 'Aguardando etapa anterior';
    const dot = st==='done'?`<span class="sdot done">✓</span>` : st==='cur'?`<span class="sdot cur" style="--c:${et.c}">●</span>` : st==='cancel'?`<span class="sdot cancel">✖</span>`:`<span class="sdot"></span>`;
    const btn = (st==='cur' && !finalStored && prox) ? `<button class="btn btn-gold sbtn" onclick="avancar('${o.id}','${prox}')">✓ Concluir — ir para ${EINFO[prox].t||EINFO[prox].l}</button>` : '';
    return `<div class="step ${st}">${dot}<div class="sbody">
        <div class="stit">${et.t||et.l}</div>
        <div class="sdesc">${desc}</div>
        <div class="sstat ${st}">${sttxt}${(st==='done'&&h&&h.responsavel)?' · '+esc(h.responsavel):''}</div>
        ${(h&&h.obs)?'<div class="sobs">“'+esc(h.obs)+'”</div>':''}
        ${btn}
      </div></div>`;
  }).join('');

  const finalNode = efet==='concluida'
    ? `<div class="step done"><span class="sdot done">🏁</span><div class="sbody"><div class="stit">Concluída</div><div class="sdesc">Operação finalizada${dfim?(' em '+fmt(dfim)):''}.</div><div class="sstat done">${o.etapa==='concluida'?'Concluído':'Automático pela data'}</div></div></div>`
    : efet==='cancelada'
    ? `<div class="step cancel"><span class="sdot cancel">✖</span><div class="sbody"><div class="stit" style="color:#ef4444">OS cancelada</div></div></div>`
    : `<div class="step pend"><span class="sdot"></span><div class="sbody"><div class="stit" style="color:var(--text-muted)">Concluída</div><div class="sstat">${dfim?('Automático após '+fmt(dfim)):'Automático pela data'}</div></div></div>`;

  const docItem = (url,arq,ic,rot) => url
    ? `<a class="docrow" href="${esc(url)}" target="_blank"><span class="dic">${ic}</span><span class="dinfo"><b>${esc(arq||rot)}</b><small>Google Drive</small></span><span class="dgo">↗</span></a>`
    : `<div class="docrow off"><span class="dic">${ic}</span><span class="dinfo"><b>${rot}</b><small>não anexado</small></span></div>`;

  const cEf = EINFO[efet]||{};
  document.getElementById('modais').innerHTML = `
  <div class="modal-bg" onclick="fecharModal()"></div>
  <div class="drawer">
    <div class="mh"><h2>OS ${String(o.numero).padStart(3,'0')}.3/${o.ano}</h2><button class="x" onclick="fecharModal()">✕</button></div>
    <div style="font-weight:700;color:var(--text-white);font-size:15px;line-height:1.3;">${esc(o.operacao||'(sem nome)')}</div>
    <div style="font-size:12px;color:var(--text-muted);margin:4px 0 8px;">${o.grupamento?('Destino: '+esc(o.grupamento)):''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <span class="chip" style="background:${cEf.c}22;color:${cEf.c};">${cEf.ic||''} ${cEf.l||efet}</span>
      ${o.com_diarias?'<span class="chip" style="background:rgba(168,85,247,.15);color:#c084fc;">💰 Com diárias</span>':''}
      ${o.is_paf?'<span class="chip" style="background:rgba(20,184,166,.15);color:#2dd4bf;">🌲 PAF</span>':''}
    </div>

    <div class="stepper">${stepper}${finalNode}</div>

    <div style="margin-top:14px;"><div class="lbl">Documentos vinculados</div>
      ${docItem(o.doc_origem_url,o.doc_origem_arquivo,'📎','Documento de origem')}
      ${docItem(o.os_url,o.os_arquivo,'📄','Ordem de Serviço (PDF)')}
      ${o.com_diarias?docItem(o.planilha_url,o.planilha_arquivo,'📊','Planilha de diárias'):''}
    </div>

    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
      ${(!finalStored && ant)?`<button class="btn btn-outline" onclick="avancar('${o.id}','${ant}')">↩ Voltar etapa</button>`:''}
      ${(!finalStored && !prox && efet!=='concluida')?`<button class="btn btn-gold" onclick="avancar('${o.id}','concluida')">🏁 Concluir agora</button>`:''}
      ${!finalStored?`<button class="btn btn-outline" style="color:#ef4444;border-color:rgba(239,68,68,.4);" onclick="avancar('${o.id}','cancelada')">✖ Cancelar OS</button>`:''}
      ${finalStored?`<button class="btn btn-outline" onclick="avancar('${o.id}','encaminhada')">↩ Reabrir</button>`:''}
      <button class="btn btn-outline" onclick="abrirEditar(OS.find(x=>x.id==='${o.id}'))">✎ Editar</button>
      <button class="btn btn-danger" onclick="excluir('${o.id}')">🗑 Excluir</button>
    </div>

    <div style="margin-top:20px;"><div class="lbl">Histórico completo</div>
      <div class="hist">${hist.slice().reverse().map(h=>`<div class="it"><div style="font-size:13px;color:var(--text-white);font-weight:600;">${EINFO[h.etapa]?.ic||'•'} ${EINFO[h.etapa]?.l||h.etapa}</div><div style="font-size:11px;color:var(--text-hint);">${fmtDT(h.criado_em)} · ${esc(h.responsavel||'')}${h.obs?' — '+esc(h.obs):''}</div></div>`).join('') || '<div style="font-size:12px;color:var(--text-hint);">—</div>'}</div>
    </div>
  </div>`;
  // Posiciona o drawer ABAIXO do cabeçalho + topnav (evita sobreposição).
  requestAnimationFrame(()=>{ const d=document.querySelector('.drawer'); if(!d) return; let off=0;
    const hd=document.querySelector('header.header')||document.querySelector('.header'); const tn=document.querySelector('.topnav');
    if(hd) off=Math.max(off, hd.getBoundingClientRect().bottom);
    if(tn) off=Math.max(off, tn.getBoundingClientRect().bottom);
    d.style.top=Math.round(Math.max(0,off))+'px'; });
}
async function avancar(id, etapa){
  const obs = prompt('Observação desta etapa (opcional):','');
  if(obs===null) return;
  try{ await _sbRpc('os_mudar_etapa', { p_token:S.token, p_id:id, p_dados:{ etapa, data:hojeLocal(), responsavel:MATR, obs:obs||null } }); await carregar(); abrirDetalhe(id); }
  catch(e){ alert('Erro: '+e.message); }
}
async function excluir(id){
  if(!confirm('Excluir esta OS e todo o seu histórico? Não pode ser desfeito.')) return;
  try{ await _sbRpc('os_excluir', { p_token:S.token, p_id:id }); fecharModal(); await carregar(); }
  catch(e){ alert('Erro: '+e.message); }
}

/* init */
if(!PODE){ document.getElementById('semacesso').style.display='block'; }
else { document.getElementById('conteudo').style.display='block'; carregar(); }
</script>
