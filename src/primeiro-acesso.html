<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3ª Cia PM MAmb — Primeiro Acesso</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <script>
    /* Verifica sessão antes de carregar */
    (function(){
      try {
        const raw = sessionStorage.getItem('poe_sessao_v2') || localStorage.getItem('poe_sessao_v2');
        if (!raw) { window.location.replace('index.html'); return; }
        const s = JSON.parse(raw);
        if (!s.primeiro_acesso) { window.location.replace('painel.html'); }
      } catch(e) { window.location.replace('index.html'); }
    })();
  </script>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#1e1e1e;}
    .card{background:#2d2d2d;border-radius:12px;width:100%;max-width:430px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7);}
    .banner img{width:100%;display:block;}
    .body{padding:28px 36px 32px;}
    .ttl{color:#fff;font-size:20px;font-weight:700;text-align:center;margin-bottom:4px;}
    .sub{color:#999;font-size:13px;text-align:center;margin-bottom:6px;}
    .aviso{background:rgba(255,152,0,.12);border:1px solid rgba(255,152,0,.35);border-radius:7px;color:#ffb74d;font-size:12px;padding:10px 14px;text-align:center;margin-bottom:24px;line-height:1.6;}
    .lbl{display:block;color:var(--gold);font-size:13px;font-weight:600;margin-bottom:7px;}
    .fw{position:relative;margin-bottom:18px;}
    .fw input{width:100%;background:#1a1a1a;border:1px solid #444;border-radius:7px;padding:11px 42px 11px 14px;color:#eee;font-size:14px;outline:none;transition:border-color .2s;box-sizing:border-box;}
    .fw input::placeholder{color:#555;}
    .fw input:focus{border-color:var(--gold);}
    .eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;display:flex;align-items:center;}
    .eye:hover{color:var(--gold);}
    .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .forca{height:4px;border-radius:2px;margin-top:-12px;margin-bottom:16px;background:#333;transition:all .3s;}
    .forca.fraca{background:#ef5350;width:33%;}
    .forca.media{background:#ff9800;width:66%;}
    .forca.forte{background:#66bb6a;width:100%;}
    .forca-txt{font-size:11px;color:#777;margin-top:4px;margin-bottom:16px;}
    .btn-enter{width:100%;background:var(--gold);color:#1a1000;border:none;border-radius:7px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;}
    .btn-enter:hover{background:var(--gold-light);}
    .btn-enter:disabled{opacity:.7;cursor:not-allowed;}
    .err{background:rgba(239,83,80,.13);border:1px solid rgba(239,83,80,.35);border-radius:6px;color:#ef9a9a;font-size:13px;padding:10px 14px;margin-bottom:16px;text-align:center;display:none;}
    .err.show{display:block;}
    .ok{background:rgba(102,187,106,.12);border:1px solid rgba(102,187,106,.3);border-radius:6px;color:#66bb6a;font-size:13px;padding:10px 14px;margin-bottom:16px;text-align:center;display:none;}
    .ok.show{display:block;}
    .regras{background:#1a1a1a;border:1px solid #333;border-radius:7px;padding:12px 16px;margin-bottom:20px;}
    .regras p{color:#666;font-size:11px;margin:0;line-height:1.8;}
    .regras span{color:#999;}
  </style>
</head>
<body>
<div class="card">
  <div class="banner"><img src="assets/header-pmmg.png" alt="PMMG"></div>
  <div class="body">
    <h1 class="ttl">Primeiro Acesso</h1>
    <p class="sub">Bem-vindo, <strong id="nome-usuario" style="color:var(--gold)">—</strong></p>

    <div class="aviso">
      ⚠️ Por segurança, você precisa definir uma senha pessoal antes de continuar.<br>
      Esta senha substituirá a senha padrão do sistema.
    </div>

    <div class="err" id="err"></div>
    <div class="ok"  id="ok"></div>

    <label class="lbl">Nova Senha</label>
    <div class="fw">
      <input type="password" id="pw1" placeholder="Mínimo 6 caracteres"
             maxlength="100" oninput="verificarForca()"
             onkeydown="if(event.key==='Enter')document.getElementById('pw2').focus()">
      <button type="button" class="eye" onclick="togglePw('pw1','eye1')">
        <svg id="eye1" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="forca" id="forca-bar"></div>
    <div class="forca-txt" id="forca-txt"></div>

    <label class="lbl">Confirmar Nova Senha</label>
    <div class="fw">
      <input type="password" id="pw2" placeholder="Repita a nova senha"
             maxlength="100"
             onkeydown="if(event.key==='Enter')handleTrocar()">
      <button type="button" class="eye" onclick="togglePw('pw2','eye2')">
        <svg id="eye2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="regras">
      <p>
        <span>Requisitos da senha:</span><br>
        • Mínimo de 6 caracteres<br>
        • Não pode ser igual à senha padrão <em>Mudar@123</em>
      </p>
    </div>

    <button class="btn-enter" id="btn" onclick="handleTrocar()">Definir Senha e Entrar</button>
  </div>
</div>

<script>
let _sessao = null;

window.addEventListener('DOMContentLoaded', () => {
  _sessao = SbAuth.sessaoLer();
  if (!_sessao) { window.location.replace('index.html'); return; }
  document.getElementById('nome-usuario').textContent = _sessao.nome || _sessao.matricula;
});

function togglePw(inputId, iconId){
  const i  = document.getElementById(inputId);
  const ic = document.getElementById(iconId);
  if(i.type === 'password'){
    i.type = 'text';
    ic.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    i.type = 'password';
    ic.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function verificarForca(){
  const pw  = document.getElementById('pw1').value;
  const bar = document.getElementById('forca-bar');
  const txt = document.getElementById('forca-txt');
  if(!pw){ bar.className='forca'; txt.textContent=''; return; }
  let pontos = 0;
  if(pw.length >= 6)  pontos++;
  if(pw.length >= 10) pontos++;
  if(/[A-Z]/.test(pw)) pontos++;
  if(/[0-9]/.test(pw)) pontos++;
  if(/[^A-Za-z0-9]/.test(pw)) pontos++;
  if(pontos <= 2){ bar.className='forca fraca'; txt.textContent='Senha fraca'; txt.style.color='#ef5350'; }
  else if(pontos <= 3){ bar.className='forca media'; txt.textContent='Senha média'; txt.style.color='#ff9800'; }
  else { bar.className='forca forte'; txt.textContent='Senha forte'; txt.style.color='#66bb6a'; }
}

async function handleTrocar(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  const btn = document.getElementById('btn');

  err.classList.remove('show');
  ok.classList.remove('show');

  if(!pw1 || !pw2){
    err.textContent = 'Preencha os dois campos de senha.';
    err.classList.add('show'); return;
  }
  if(pw1 !== pw2){
    err.textContent = 'As senhas não coincidem.';
    err.classList.add('show'); return;
  }
  if(pw1.length < 6){
    err.textContent = 'A senha deve ter pelo menos 6 caracteres.';
    err.classList.add('show'); return;
  }
  if(pw1 === SbAuth.SENHA_PADRAO){
    err.textContent = 'A nova senha não pode ser igual à senha padrão.';
    err.classList.add('show'); return;
  }

  btn.textContent = '⏳ Salvando...';
  btn.disabled = true;

  const r = await SbAuth.trocarSenha(_sessao.id, pw1);

  if(!r.ok){
    err.textContent = r.erro;
    err.classList.add('show');
    btn.textContent = 'Definir Senha e Entrar';
    btn.disabled = false;
    return;
  }

  ok.textContent = '✔ Senha definida com sucesso! Redirecionando...';
  ok.classList.add('show');

  setTimeout(() => {
    window.location.href = 'painel.html';
  }, 1500);
}
</script>
</body>
</html>
