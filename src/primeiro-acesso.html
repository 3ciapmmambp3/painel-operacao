<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiro Acesso — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#1e1e1e;}
    .card{background:#2d2d2d;border-radius:12px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7);}
    .card-top{background:#111;border-bottom:3px solid var(--gold);padding:16px 24px;display:flex;align-items:center;gap:14px;}
    .card-top img{height:40px;border-radius:3px;}
    .card-top h1{font-size:14px;font-weight:700;color:var(--gold);}
    .card-top p{font-size:11px;color:var(--text-muted);margin-top:2px;}
    .body{padding:24px 32px 32px;}
    .alert-box{background:rgba(255,152,0,.1);border:1px solid rgba(255,152,0,.3);border-radius:7px;padding:14px 16px;margin-bottom:22px;display:flex;gap:10px;}
    .alert-icon{font-size:20px;flex-shrink:0;}
    .alert-txt{font-size:12px;color:#ffcc80;line-height:1.6;}
    .alert-txt strong{color:#ffb74d;display:block;margin-bottom:3px;}
    .sec-title{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:16px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .user-info{background:#1a1a1a;border-radius:6px;padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
    .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#1a1000;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:600;color:var(--text-white);}
    .user-np{font-size:11px;color:var(--text-muted);}
    .lbl{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
    .fg{margin-bottom:16px;}
    .fw{position:relative;}
    .fw input{width:100%;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:10px 42px 10px 12px;color:#eee;font-size:13px;outline:none;transition:border-color .2s;}
    .fw input:focus{border-color:var(--gold);}
    .fw input::placeholder{color:#555;}
    .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;}
    .eye:hover{color:var(--gold);}
    .eye svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .req{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
    .req-item{font-size:11px;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--text-hint);transition:all .2s;}
    .req-item.ok{border-color:rgba(102,187,106,.4);color:#66bb6a;background:rgba(102,187,106,.08);}
    .btn-save{width:100%;background:var(--gold);color:#1a1000;border:none;border-radius:6px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s;}
    .btn-save:hover{background:var(--gold-light);}
    .btn-save:disabled{opacity:.6;cursor:not-allowed;}
    .err{background:rgba(239,83,80,.13);border:1px solid rgba(239,83,80,.35);border-radius:5px;color:#ef9a9a;font-size:12px;padding:9px 12px;margin-bottom:12px;display:none;}
    .err.show{display:block;}
  </style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <img src="assets/header-pmmg.png" alt="PMMG">
    <div>
      <h1>PRIMEIRO ACESSO</h1>
      <p>3ª Cia PM MAmb — Defina sua senha</p>
    </div>
  </div>
  <div class="body">
    <div class="alert-box">
      <span class="alert-icon">⚠️</span>
      <div class="alert-txt">
        <strong>Alteração de senha obrigatória</strong>
        Este é seu primeiro acesso ao sistema. Por segurança, você deve definir uma nova senha antes de continuar.
      </div>
    </div>

    <!-- Info do usuário logado -->
    <div class="user-info">
      <div class="user-avatar" id="u-avatar">?</div>
      <div>
        <div class="user-name" id="u-nome">—</div>
        <div class="user-np" id="u-np">—</div>
      </div>
    </div>

    <div class="sec-title">Definir Nova Senha</div>
    <div class="err" id="err"></div>

    <div class="fg">
      <label class="lbl">Nova Senha</label>
      <div class="fw">
        <input type="password" id="pw1" placeholder="Mínimo 6 caracteres"
               oninput="checkReqs()" autocomplete="new-password">
        <button type="button" class="eye" onclick="togglePw('pw1','ic1')">
          <svg id="ic1" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="fg">
      <label class="lbl">Confirmar Nova Senha</label>
      <div class="fw">
        <input type="password" id="pw2" placeholder="Repita a senha"
               oninput="checkReqs()" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')salvar()">
        <button type="button" class="eye" onclick="togglePw('pw2','ic2')">
          <svg id="ic2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="req">
      <span class="req-item" id="req-len">Mín. 6 caracteres</span>
      <span class="req-item" id="req-match">Senhas iguais</span>
      <span class="req-item" id="req-dif">Diferente da padrão</span>
    </div>

    <button class="btn-save" id="btn-save" onclick="salvar()" style="margin-top:16px;">
      Salvar e Entrar no Sistema
    </button>
  </div>
</div>

<script>
/* ── Storage com fallback ── */
const _mem = {};
function _set(k,v){ try{localStorage.setItem(k,v);}catch(e){} _mem[k]=v; }
function _get(k){ try{const v=localStorage.getItem(k);if(v!==null){_mem[k]=v;return v;}}catch(e){} return _mem[k]||null; }

let sessao = null;

window.addEventListener('DOMContentLoaded', () => {
  const raw = _get('poe_sessao');
  if(!raw){ window.location.href='index.html'; return; }
  sessao = JSON.parse(raw);
  if(!sessao.primeiroAcesso){ window.location.href='painel.html'; return; }

  /* Exibe info do usuário */
  document.getElementById('u-nome').textContent = sessao.nome || sessao.numeroPolicia;
  document.getElementById('u-np').textContent = 'Nº PM: ' + sessao.numeroPolicia;
  const initials = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('u-avatar').textContent = initials;
});

function togglePw(id, ic){
  const i=document.getElementById(id), sv=document.getElementById(ic);
  if(i.type==='password'){
    i.type='text';
    sv.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    i.type='password';
    sv.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function checkReqs(){
  const p1=document.getElementById('pw1').value;
  const p2=document.getElementById('pw2').value;
  const set=(id,ok)=>{ document.getElementById(id).className='req-item'+(ok?' ok':''); };
  set('req-len', p1.length>=6);
  set('req-match', p1===p2 && p1.length>0);
  set('req-dif', p1!=='Mudar@123' && p1.length>0);
}

function salvar(){
  if(!sessao) return;
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn-save');
  err.classList.remove('show');

  if(pw1.length < 6){ err.textContent='A senha deve ter pelo menos 6 caracteres.'; err.classList.add('show'); return; }
  if(pw1 !== pw2){    err.textContent='As senhas não coincidem.'; err.classList.add('show'); return; }
  if(pw1 === 'Mudar@123'){ err.textContent='Defina uma senha diferente da senha padrão.'; err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  /* Atualiza no banco */
  try {
    const raw = _get('poe_usuarios');
    const lista = raw ? JSON.parse(raw) : [];
    const idx = lista.findIndex(u => u.id === sessao.id);
    if(idx !== -1){
      lista[idx].senha = pw1;
      lista[idx].primeiroAcesso = false;
      _set('poe_usuarios', JSON.stringify(lista));
    }
    /* Atualiza sessão */
    sessao.primeiroAcesso = false;
    _set('poe_sessao', JSON.stringify(sessao));
    window.location.href = 'painel.html';
  } catch(e) {
    err.textContent = 'Erro ao salvar: ' + e.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Salvar e Entrar no Sistema';
  }
}
</script>
</body>
</html>
