<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhyngzhpznhiidO0D4Dju9-nr8N-3bPR4il683btr_FH0fH8A6HlA7f9oV4nOh-MDj/exec";

const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{
    const s = JSON.parse(raw);
    if(!s || !s.id){ window.location.href='index.html'; return null; }
    return s;
  }catch(e){ window.location.href='index.html'; return null; }
})();

if (sessao){
  document.getElementById('user-nome').textContent = sessao.nome || sessao.matricula;
  const initials = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  const badge = document.getElementById('user-badge');
  const nivel = sessao.nivel_acesso;
  const mapaBadge = {
    admin_geral: ['ADMIN GERAL', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin: ['ADMIN', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin_pelotao: ['ADMIN PELOTÃO', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
    admin_gp: ['ADMIN GP', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
  };
  const info = mapaBadge[nivel] || ['OPERACIONAL', 'rgba(66,165,245,.15)', 'var(--info)', 'rgba(66,165,245,.3)'];
  badge.textContent = info[0];
  badge.style.cssText = `font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;background:${info[1]};color:${info[2]};border:1px solid ${info[3]};`;
  const admTopnavItem = document.getElementById('admTopnavItem');
  const ehAdmin = ['admin_geral','admin','admin_pelotao','admin_gp'].includes(nivel);
  if (admTopnavItem && ehAdmin) admTopnavItem.style.display = '';
  if (nivel === 'admin_geral'){
    const btnImp = document.getElementById('admLinkImportacao');
    if (btnImp) btnImp.style.display = '';
    const btnAdmin = document.getElementById('admLinkAdministracao');
    if (btnAdmin) btnAdmin.style.display = '';
  }
  const podeGerenciarTTA = nivel === 'admin_geral' ||
    ((sessao.funcao||'').toLowerCase() === 'aux p1' && (sessao.grupamento_id||'').toUpperCase() === 'ADM');
  if (podeGerenciarTTA){
    const linkGestao = document.getElementById('linkGestaoTTA');
    if (linkGestao) linkGestao.style.display = '';
  }
  // Exportação (PDF/Excel) só pra quem tem algum nível administrativo.
  if (!ehAdmin){
    const botoes = document.getElementById('prod-export-botoes');
    if (botoes) botoes.style.display = 'none';
  }
}

// ---------- Dropdowns da barra do topo ----------
document.querySelectorAll('.topnav-link[data-dropdown]').forEach(link => {
  link.addEventListener('click', (e) => {
    e.stopPropagation();
    const dd = document.getElementById(link.dataset.dropdown);
    const jaAberto = dd.classList.contains('open');
    document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!jaAberto) dd.classList.add('open');
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
});

// ---------- Sidebar: recolher/expandir ----------
/* sidebar por secao agora vem de secnav.js */

// =====================================================================
// DADOS
// =====================================================================
let camposProdutividade = [];  // [{nome, tipo, usarRanking}] — indicadores da OPERAÇÃO escolhida
let camposNumericos = [];      // mesma lista, sem os campos tipo "Texto" (não somam)
let tipoPorNome = {};          // nome -> tipo, pra formatação
let todosOsRegistros = [];     // cada linha = 1 relatório com Produtividade preenchida
let graficoBarras = null;
let graficoLinha = null;

// Catálogo de Campos & Quesitos (Supabase) — fonte dos indicadores de produtividade.
let QUESITOS_PROD = [];
// Operações do painel com suas datas (p/ pré-preencher o período do filtro).
let operacoesComDatas = [];    // [{nome, inicio, final}]
// Fallback: campos da planilha CAMPOS_PRODUTIVIDADE, usados só se o Supabase falhar.
let _camposPlanilhaFallback = [];

function normalizar_(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}

// Data de ontem, em hora local (evita o problema de toISOString() converter
// pra UTC e "pular" pro dia errado perto da virada da meia-noite).
function dataOntemISO_(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

// Converte pra número aceitando tanto "5.9" quanto "5,9" (alguns registros
// antigos podem ter sido salvos com vírgula decimal).
function parseNum_(v){
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = v.toString().trim();
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  return parseFloat(s);
}
// Ícone + cor automáticos por palavra-chave do nome do indicador — assim,
// indicadores novos que você adicionar na planilha já ganham visual
// coerente sem eu precisar mexer no código de novo.
const ICONE_REGRAS_ = [
  { re: /pris(ã|a)o|apreens(ã|a)o de adolescente/i, icone: '🚔', cor: '#ef5350' },
  { re: /droga/i, icone: '💊', cor: '#e57373' },
  { re: /arma|muni(çã|ca)o/i, icone: '🔫', cor: '#c62828' },
  { re: /ve(í|i)culo/i, icone: '🚗', cor: '#42a5f5' },
  { re: /animal/i, icone: '🐾', cor: '#66bb6a' },
  { re: /desmate|floresta|madeira|carv(ã|a)o/i, icone: '🌳', cor: '#43a047' },
  { re: /rede|pesc|tarrafa|anz(ó|o)i|covo|espinh|jequi|garat(é|e)ia|pinda|fisga|carretilha/i, icone: '🎣', cor: '#26a69a' },
  { re: /embarca(çã|ca)o|drag|balsa/i, icone: '🚤', cor: '#00acc1' },
  { re: /visita/i, icone: '🤝', cor: '#ffca28' },
  { re: /opera(çã|ca)o/i, icone: '🎯', cor: '#9b8a5c' },
  { re: /autua(çã|ca)o|multa/i, icone: '📝', cor: '#ff9800' },
  { re: /valor|r\$|moeda/i, icone: '💰', cor: '#ffa726' },
  { re: /pessoa|abordad/i, icone: '👤', cor: '#78909c' },
  { re: /local/i, icone: '📍', cor: '#8d6e63' },
  { re: /total (bo|rat|bos|tco)\b/i, icone: '📄', cor: '#90a4ae' },
];
function iconeECor_(nome){
  const regra = ICONE_REGRAS_.find(r => r.re.test(nome));
  return regra ? regra : { icone: '📊', cor: '#9b8a5c' };
}


// "R$", Decimal mostra até 2 casas, Inteiro é número redondo).
function formatarValorPorTipo_(valor, nome){
  const tipo = tipoPorNome[nome] || 'Inteiro';
  if (tipo === 'Moeda') return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (tipo === 'Decimal') return Number(valor).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  return Number(valor).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

async function carregarTudo(){
  const status = document.getElementById('prod-status');
  try {
    const [refRes, prodRes] = await Promise.all([
      auth_fetchReferencias(SCRIPT_URL),
      fetch(`${SCRIPT_URL}?action=listarProdutividade`).then(r => r.json()),
      carregarQuesitosProdSupabase(),   // catálogo de indicadores (Campos & Quesitos)
    ]);

    // Fallback (só se o Supabase falhar): campos ativos da planilha.
    _camposPlanilhaFallback = (refRes.CAMPOS_PRODUTIVIDADE || []).filter(c => c.status !== 'Inativo');

    if (prodRes.result !== 'success'){
      document.getElementById('prod-conteudo').innerHTML = '<div class="mr-empty">Erro ao carregar dados de produtividade.</div>';
      return;
    }

    // Escopo de visualização por nível de acesso (mesma regra do resto do sistema).
    todosOsRegistros = (prodRes.produtividade || []).filter(r => auth_podeVerGrupamento(sessao, r['Fração de Atuação']));

    popularFiltroOperacao(await carregarOperacoesSupabaseProd());
    popularFiltroFracao();

    // Por padrão, mostra o dia ANTERIOR (o turno normalmente só termina no
    // fim do dia, então "hoje" apareceria vazio na maior parte das vezes).
    // Se quiser ver outro período, é só trocar as datas nos filtros.
    const ontemISO = dataOntemISO_();
    document.getElementById('filtroDataInicio').value = ontemISO;
    document.getElementById('filtroDataFim').value = ontemISO;

    // Indicadores da operação atual do filtro ("Todas" no primeiro carregamento).
    aplicarCamposDaOperacao();

    renderizarTudo();
  } catch(err){
    console.error('Erro ao carregar produtividade:', err);
    document.getElementById('prod-conteudo').innerHTML = '<div class="mr-empty">Erro ao carregar. Recarregue a página.</div>';
  }
}

// Operações do painel (Supabase) — fonte do cadastro (aba "Nova Operação").
// Traz TODAS (inclusive encerradas), pois este é um filtro de EXTRAÇÃO de dados
// históricos: pode-se querer filtrar por uma operação já finalizada. Best-effort:
// se o Supabase falhar, o filtro ainda se monta a partir dos próprios registros.
async function carregarOperacoesSupabaseProd(){
  try{
    if (typeof SB_AUTH_URL === 'undefined' || typeof SB_AUTH_KEY === 'undefined') return [];
    const H = { apikey: SB_AUTH_KEY, Authorization:`Bearer ${SB_AUTH_KEY}`, 'Content-Type':'application/json' };
    const r = await fetch(`${SB_AUTH_URL}/rest/v1/rpc/operacoes_listar`, { method:'POST', headers:H, body:'{}' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    if (!Array.isArray(rows)) return [];
    // Guarda início/fim de cada operação p/ pré-preencher o período do filtro.
    operacoesComDatas = rows.map(o => ({
      nome:   (o.nome || '').trim(),
      inicio: o.inicio ? String(o.inicio).slice(0,10) : '',
      final:  o.final  ? String(o.final ).slice(0,10) : '',
    })).filter(o => o.nome);
    return operacoesComDatas.map(o => o.nome);
  }catch(e){ console.warn('[produtividade] operacoes_listar indisponível:', e); return []; }
}

// Catálogo de Campos & Quesitos (Supabase). Fonte dos indicadores de produtividade:
// só entram os ATIVOS; desativar em Campos & Quesitos remove a coluna, cadastrar
// um novo faz aparecer. Best-effort: se falhar, cai no fallback da planilha.
async function carregarQuesitosProdSupabase(){
  try{
    if (typeof SB_AUTH_URL === 'undefined' || typeof SB_AUTH_KEY === 'undefined') return;
    const H = { apikey: SB_AUTH_KEY, Authorization:`Bearer ${SB_AUTH_KEY}`, 'Content-Type':'application/json' };
    const r = await fetch(`${SB_AUTH_URL}/rest/v1/rpc/operacao_quesitos_get`, { method:'POST', headers:H, body:'{}' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const arr = await r.json();
    QUESITOS_PROD = Array.isArray(arr) ? arr : [];
  }catch(e){ console.warn('[produtividade] operacao_quesitos_get indisponível:', e); QUESITOS_PROD = []; }
}

// Traduz o tipo do quesito p/ o vocabulário de produtividade (só numéricos somam).
function _tipoQuesitoParaProd_(t){
  switch(t){
    case 'numero':  return 'Inteiro';
    case 'decimal': return 'Decimal';
    case 'moeda':   return 'Moeda';
    default:        return 'Texto'; // texto_curto/longo, data, sim_nao, opcoes
  }
}

// Indicadores (colunas) que valem para a operação escolhida no filtro:
//  - sempre os globais de escopo 'produtividade' (ativos);
//  - os 'todas' (ativos), pois são preenchidos em qualquer operação;
//  - os 'especificas' (ativos) da operação selecionada — ou, em "Todas", de todas
//    as operações, p/ a visão agregada não esconder nenhum indicador ativo.
// Ranking: por decisão, TODO indicador numérico ativo entra no ranking.
function _camposDeQuesitos_(opNome){
  const arr = QUESITOS_PROD || [];
  const seen = new Set();
  const out = [];
  const push = q => {
    const nome = (q.label || '').trim();
    if (!nome) return;
    const k = nome.toLowerCase();
    if (seen.has(k)) return;
    seen.add(k);
    const tipo = _tipoQuesitoParaProd_(q.tipo);
    out.push({ nome, tipo, usarRanking: tipo !== 'Texto' });
  };
  arr.filter(q => q.escopo === 'produtividade' && q.ativo !== false).forEach(push);
  arr.filter(q => q.escopo === 'todas' && q.ativo !== false).forEach(push);
  if (opNome){
    arr.filter(q => q.escopo === 'especificas' && q.ativo !== false && Array.isArray(q.operacoes) && q.operacoes.includes(opNome)).forEach(push);
  } else {
    arr.filter(q => q.escopo === 'especificas' && q.ativo !== false).forEach(push);
  }
  return out;
}

// (Re)define os indicadores conforme a operação atual do filtro e atualiza os
// derivados (numéricos / tipo por nome). Chamado no load e ao trocar a operação.
function aplicarCamposDaOperacao(){
  const op = (document.getElementById('filtroOperacao').value || '').trim();
  // Catálogo "configurado" = tem ao menos um indicador de produtividade (ativo ou
  // não). Nesse caso mandamos SÓ o Supabase: se estiver tudo desativado, o painel
  // fica vazio (fiel à decisão do admin). Só caímos na planilha quando o catálogo
  // não veio (Supabase indisponível / ainda não semeado).
  const catalogoConfigurado = (QUESITOS_PROD || []).some(q => q.escopo === 'produtividade');
  let campos = _camposDeQuesitos_(op);
  if (!campos.length && !catalogoConfigurado) campos = _camposPlanilhaFallback;
  camposProdutividade = campos;
  camposNumericos = camposProdutividade.filter(c => c.tipo !== 'Texto');
  tipoPorNome = {};
  camposProdutividade.forEach(c => { tipoPorNome[c.nome] = c.tipo; });
}

// Troca de operação no filtro: pré-preenche o período com o início/fim cadastrados
// da operação (editável) e recalcula os indicadores antes de renderizar.
function onOperacaoChange(){
  const op = (document.getElementById('filtroOperacao').value || '').trim();
  const info = op ? (operacoesComDatas || []).find(o => o.nome === op) : null;
  if (info && (info.inicio || info.final)){
    if (info.inicio) document.getElementById('filtroDataInicio').value = info.inicio;
    if (info.final)  document.getElementById('filtroDataFim').value  = info.final;
  }
  aplicarCamposDaOperacao();
  renderizarTudo();
}

// Monta o filtro de Operação SEM depender da planilha: une o cadastro do painel
// (Supabase) com os nomes que realmente aparecem nos registros carregados. Assim,
// criar/excluir operação no painel reflete aqui na hora e operações legadas (nomes
// antigos gravados nos registros) continuam filtráveis.
function popularFiltroOperacao(operacoesSupabase){
  const select = document.getElementById('filtroOperacao');
  const atual = select.value;
  const dosRegistros = todosOsRegistros.flatMap(r => Array.isArray(r['Operações']) ? r['Operações'] : []);
  const nomes = Array.from(new Set(
      [...(operacoesSupabase||[]), ...dosRegistros]
        .map(n => (n||'').trim())
        .filter(n => n && n.indexOf('OUTRA') === -1)
    )).sort((a,b) => a.localeCompare(b, 'pt-BR'));
  select.innerHTML = '<option value="">Todas</option>' + nomes.map(n => `<option value="${n}">${n}</option>`).join('');
  if (nomes.includes(atual)) select.value = atual;
}

function popularFiltroFracao(){
  const select = document.getElementById('filtroFracao');
  const fracoes = Array.from(new Set(todosOsRegistros.map(r => r['Fração de Atuação']).filter(Boolean))).sort();
  select.innerHTML = '<option value="">Todas</option>' + fracoes.map(f => `<option value="${f}">${f}</option>`).join('');
}

function aplicarFiltros(){
  const op = document.getElementById('filtroOperacao').value;
  const dataIni = document.getElementById('filtroDataInicio').value;
  const dataFim = document.getElementById('filtroDataFim').value;
  const fracao = document.getElementById('filtroFracao').value;

  return todosOsRegistros.filter(r => {
    if (op && !(r['Operações']||[]).includes(op)) return false;
    if (dataIni && (!r['Data'] || r['Data'] < dataIni)) return false;
    if (dataFim && (!r['Data'] || r['Data'] > dataFim)) return false;
    if (fracao && r['Fração de Atuação'] !== fracao) return false;
    return true;
  });
}

// Trocar a OPERAÇÃO recalcula os indicadores e pré-preenche o período; os demais
// filtros só re-renderizam.
document.getElementById('filtroOperacao').addEventListener('change', onOperacaoChange);
['filtroDataInicio','filtroDataFim','filtroFracao'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderizarTudo);
});
document.getElementById('btnLimparFiltrosProd').addEventListener('click', () => {
  document.getElementById('filtroOperacao').value = '';
  const ontemISO = dataOntemISO_();
  document.getElementById('filtroDataInicio').value = ontemISO;
  document.getElementById('filtroDataFim').value = ontemISO;
  document.getElementById('filtroFracao').value = '';
  aplicarCamposDaOperacao(); // volta pros indicadores da visão "Todas"
  renderizarTudo();
});

// =====================================================================
// RENDERIZAÇÃO
// =====================================================================
function renderizarTudo(){
  const dados = aplicarFiltros();
  const conteudo = document.getElementById('prod-conteudo');

  if (!dados.length){
    conteudo.innerHTML = `<div class="mr-empty">${todosOsRegistros.length ? 'Nenhum registro encontrado com esses filtros.' : 'Nenhum dado de Produtividade encontrado no seu escopo de visualização.'}</div>`;
    return;
  }

  // ---- Totais por indicador ----
  const totais = {};
  camposNumericos.forEach(c => totais[c.nome] = 0);
  dados.forEach(r => {
    camposNumericos.forEach(c => {
      const v = parseNum_(r[c.nome]);
      if (!isNaN(v)) totais[c.nome] += v;
    });
  });

  // ---- Estatísticas gerais ----
  const idsUnicos = new Set(dados.map(r => r['ID Relatório']));
  const totalTurnos = idsUnicos.size;
  const fracoesUnicas = new Set(dados.map(r => r['Fração de Atuação']).filter(Boolean));
  const equipesUnicas = new Set(dados.map(r => r['Equipe']).filter(Boolean));
  const totalMilitares = dados.reduce((s,r) => s + (parseNum_(r['Total de Militares (Geral)'])||0), 0);
  const totalViaturas = dados.reduce((s,r) => s + (parseNum_(r['Total de Viaturas (Geral)'])||0), 0);
  const datas = dados.map(r => r['Data']).filter(Boolean).sort();
  const periodoIni = datas[0], periodoFim = datas[datas.length-1];

  // ---- Resumo executivo ----
  const topIndicadores = Object.entries(totais).filter(([,v]) => v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const resumoTexto = topIndicadores.length
    ? `Entre <b>${formatarDataBR_(periodoIni)}</b> e <b>${formatarDataBR_(periodoFim)}</b>, foram empregados <b>${totalTurnos}</b> turno${totalTurnos!==1?'s':''} em <b>${fracoesUnicas.size}</b> fração${fracoesUnicas.size!==1?'ões':''} de atuação, com <b>${equipesUnicas.size}</b> equipe${equipesUnicas.size!==1?'s':''} distintas, resultando em: `
      + topIndicadores.map(([k,v]) => `<b>${formatarNumero_(v)}</b> ${k.toLowerCase()}`).join(' · ') + '.'
    : `Nenhum indicador de Produtividade preenchido no período selecionado.`;

  // ---- Ranking: todo indicador numérico ativo ----
  const camposRanking = camposProdutividade.filter(c => c.usarRanking);
  // ---- Quesitos de texto (não somam): viram colunas na tabela de relatórios ----
  const camposTexto = camposProdutividade.filter(c => c.tipo === 'Texto');

  // ---- Ranking por Fração — uma coluna por indicador, sem somar tipos diferentes ----
  const porFracao = {};
  dados.forEach(r => {
    const f = r['Fração de Atuação'] || '—';
    if (!porFracao[f]) { porFracao[f] = { turnos: new Set(), valores: {} }; camposRanking.forEach(c => porFracao[f].valores[c.nome] = 0); }
    porFracao[f].turnos.add(r['ID Relatório']);
    camposRanking.forEach(c => { porFracao[f].valores[c.nome] += (parseNum_(r[c.nome])||0); });
  });
  const rankingFracao = Object.entries(porFracao).sort((a,b) => b[1].turnos.size - a[1].turnos.size).slice(0,10);

  // ---- Ranking por Equipe — mesma lógica ----
  const porEquipe = {};
  dados.forEach(r => {
    const eq = `${r['Fração de Atuação']||'—'} / Equipe ${r['Equipe']||'—'}`;
    if (!porEquipe[eq]) { porEquipe[eq] = { turnos: new Set(), valores: {} }; camposRanking.forEach(c => porEquipe[eq].valores[c.nome] = 0); }
    porEquipe[eq].turnos.add(r['ID Relatório']);
    camposRanking.forEach(c => { porEquipe[eq].valores[c.nome] += (parseNum_(r[c.nome])||0); });
  });
  const rankingEquipe = Object.entries(porEquipe).sort((a,b) => b[1].turnos.size - a[1].turnos.size).slice(0,10);

  // ---- Produtividade por dia (linha do tempo) ----
  const porDia = {};
  dados.forEach(r => {
    const d = r['Data'] || '—';
    if (!porDia[d]) porDia[d] = 0;
    camposNumericos.forEach(c => { porDia[d] += (parseNum_(r[c.nome])||0); });
  });
  const diasOrdenados = Object.keys(porDia).sort();

  // ---- Indicadores de desempenho calculados ----
  // Busca o total por nome tolerando acento/caixa: o rótulo cadastrado no quesito
  // pode ter grafia diferente da usada aqui (ex.: "Veiculos" x "Veículos"). Se o
  // indicador não estiver ativo p/ a operação, simplesmente não é encontrado (0),
  // e a métrica que depende dele mostra "—".
  const totaisNorm = {};
  Object.keys(totais).forEach(k => { totaisNorm[normalizar_(k)] = totais[k]; });
  const totalPorNome_ = nome => totaisNorm[normalizar_(nome)] || 0;

  const totalAbordagens = totalPorNome_('Pessoas Abordadas');
  const totalVeicFisc = totalPorNome_('Veículos Fiscalizados');
  const totalPrisoes = totalPorNome_('Prisões (Pessoas maiores)') + totalPorNome_('Apreensão de Adolescentes');
  const totalVeicApreendidos = totalPorNome_('Veículos Apreendidos');
  const totalLocaisFisc = totalPorNome_('Locais Fiscalizados');
  const totalLocaisDesmate = totalPorNome_('Locais de Desmate Fiscalizados');

  const indicadoresCalc = [
    { lbl: 'Média de abordagens por turno', val: totalTurnos ? (totalAbordagens/totalTurnos).toFixed(1) : '—' },
    { lbl: 'Média de veículos fiscalizados por turno', val: totalTurnos ? (totalVeicFisc/totalTurnos).toFixed(1) : '—' },
    { lbl: 'Prisões por 100 abordagens', val: totalAbordagens ? (totalPrisoes/totalAbordagens*100).toFixed(2) : '—' },
    { lbl: 'Veículos apreendidos por 100 fiscalizados', val: totalVeicFisc ? (totalVeicApreendidos/totalVeicFisc*100).toFixed(2) : '—' },
    { lbl: '% locais fiscalizados com desmate', val: totalLocaisFisc ? (totalLocaisDesmate/totalLocaisFisc*100).toFixed(1)+'%' : '—' },
    { lbl: 'Média diária de produtividade (todos indicadores)', val: diasOrdenados.length ? (diasOrdenados.reduce((s,d)=>s+porDia[d],0)/diasOrdenados.length).toFixed(1) : '—' },
  ];

  // ==================== MONTAGEM DO HTML ====================
  conteudo.innerHTML = `
    <div class="resumo-exec">
      <b>📌 Resumo do Período</b><br><br>${resumoTexto}
    </div>

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="secao-titulo">📊 Estatísticas do Período</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kv">${totalTurnos}</div><div class="kl">Turnos com Produtividade</div></div>
      <div class="kpi-card"><div class="kv">${fracoesUnicas.size}</div><div class="kl">Frações Atendidas</div></div>
      <div class="kpi-card"><div class="kv">${equipesUnicas.size}</div><div class="kl">Equipes Distintas</div></div>
      <div class="kpi-card"><div class="kv">${totalMilitares}</div><div class="kl">Militares Empregados (soma)</div></div>
      <div class="kpi-card"><div class="kv">${totalViaturas}</div><div class="kl">Viaturas Empregadas (soma)</div></div>
    </div>

    <div class="secao-titulo">📈 Gráficos</div>
    <div class="duas-colunas">
      <div class="chart-box"><h4>Top 8 Indicadores (total do período)</h4><canvas id="chartBarras" height="220"></canvas></div>
      <div class="chart-box"><h4>Produtividade por Dia</h4><canvas id="chartLinha" height="220"></canvas></div>
    </div>

    <div class="secao-titulo">🏆 Ranking por Fração de Atuação</div>
    <div class="chart-box" id="prod-ranking-fracao">
      ${!camposRanking.length ? '<div class="mr-empty">Nenhum indicador numérico ativo para esta operação em Campos &amp; Quesitos.</div>' : `
      <div style="overflow-x:auto;">
      <table class="prod-table">
        <thead><tr><th>#</th><th>Fração</th><th>Turnos</th>${camposRanking.map(c => `<th>${iconeECor_(c.nome).icone} ${c.nome}</th>`).join('')}</tr></thead>
        <tbody>${rankingFracao.map(([f,v],i) => `<tr><td><span class="rank-pos">${i+1}</span></td><td>${f}</td><td>${v.turnos.size}</td>${camposRanking.map(c => `<td>${formatarValorPorTipo_(v.valores[c.nome], c.nome)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      </div>`}
    </div>

    <div class="secao-titulo">🏆 Ranking por Equipe</div>
    <div class="chart-box" id="prod-ranking-equipe">
      ${!camposRanking.length ? '<div class="mr-empty">Nenhum indicador numérico ativo para esta operação em Campos &amp; Quesitos.</div>' : `
      <div style="overflow-x:auto;">
      <table class="prod-table">
        <thead><tr><th>#</th><th>Fração / Equipe</th><th>Turnos</th>${camposRanking.map(c => `<th>${iconeECor_(c.nome).icone} ${c.nome}</th>`).join('')}</tr></thead>
        <tbody>${rankingEquipe.map(([f,v],i) => `<tr><td><span class="rank-pos">${i+1}</span></td><td>${f}</td><td>${v.turnos.size}</td>${camposRanking.map(c => `<td>${formatarValorPorTipo_(v.valores[c.nome], c.nome)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      </div>`}
    </div>

    <div class="secao-titulo">🎯 Indicadores de Desempenho</div>
    <div class="indicadores-calc">
      ${indicadoresCalc.map(ic => `<div class="indicador-calc"><div class="ic-val">${ic.val}</div><div class="ic-lbl">${ic.lbl}</div></div>`).join('')}
    </div>

    <div class="secao-titulo">📋 Relatórios do Período</div>
    <div id="prod-lista-tabela">
      <table class="prod-table detalhe">
        <thead><tr><th>Data</th><th>Fração</th><th>Equipe</th><th>Comandante</th><th>Operação</th>${camposTexto.map(c => `<th>${_escHtml_(c.nome)}</th>`).join('')}</tr></thead>
        <tbody>${dados.map(r => `<tr>
          <td>${formatarDataBR_(r['Data'])}</td>
          <td>${r['Fração de Atuação']||'—'}</td>
          <td>${r['Equipe']||'—'}</td>
          <td>${r['Comandante']||'—'}</td>
          <td>${(r['Operações']||[]).join(', ')||'—'}</td>
          ${camposTexto.map(c => `<td>${_escHtml_(r[c.nome]) || '—'}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  // KPIs dinâmicos (um card por indicador que tiver valor > 0)
  const kpiGrid = document.getElementById('kpi-grid');
  const kpisComValor = Object.entries(totais).filter(([,v]) => v > 0);
  kpiGrid.innerHTML = kpisComValor.length
    ? kpisComValor.map(([k,v]) => {
        const ic = iconeECor_(k);
        return `<div class="kpi-card" style="border-top-color:${ic.cor};"><div class="kv">${ic.icone} ${formatarValorPorTipo_(v,k)}</div><div class="kl">${k}</div></div>`;
      }).join('')
    : '<div class="mr-empty">Nenhum indicador com valor no período.</div>';

  desenharGraficos_(topIndicadores, diasOrdenados, porDia);

  // Guarda o estado atual pra exportação
  window._prodEstadoAtual = { dados, totais, resumoTexto, periodoIni, periodoFim, rankingFracao, rankingEquipe, indicadoresCalc, camposRanking,
    porDia, diasOrdenados,
    stats: { turnos: totalTurnos, fracoes: fracoesUnicas.size, equipes: equipesUnicas.size, militares: totalMilitares, viaturas: totalViaturas } };
}

function formatarNumero_(v){
  return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}
// Escapa texto livre (valores de quesitos de texto) antes de injetar no HTML.
function _escHtml_(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatarDataBR_(iso){
  if (!iso) return '—';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function desenharGraficos_(topIndicadores, diasOrdenados, porDia){
  if (graficoBarras) graficoBarras.destroy();
  if (graficoLinha) graficoLinha.destroy();

  const ctxB = document.getElementById('chartBarras');
  if (ctxB){
    const top8 = topIndicadores.length ? topIndicadores : [];
    graficoBarras = new Chart(ctxB, {
      type: 'bar',
      data: {
        labels: top8.map(([k]) => k),
        datasets: [{ data: top8.map(([,v]) => v), backgroundColor: '#9b8a5c' }],
      },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#999',font:{size:9}}}, y:{ticks:{color:'#999'}} } },
    });
  }

  const ctxL = document.getElementById('chartLinha');
  if (ctxL){
    graficoLinha = new Chart(ctxL, {
      type: 'line',
      data: {
        labels: diasOrdenados.map(formatarDataBR_),
        // pointRadius alto garante que um período de UM único dia (1 ponto, sem
        // linha) ainda apareça claramente.
        datasets: [{ data: diasOrdenados.map(d => porDia[d]), borderColor:'#9b8a5c', backgroundColor:'rgba(155,138,92,.15)', fill:true, tension:.3, pointRadius:5, pointHoverRadius:7, pointBackgroundColor:'#d4b968', spanGaps:true }],
      },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#999',font:{size:9}}}, y:{beginAtZero:true, ticks:{color:'#999'}} } },
    });
  }
}

document.getElementById('btnExportExcel').addEventListener('click', () => {
  const estado = window._prodEstadoAtual;
  if (!estado) return;

  const wb = XLSX.utils.book_new();

  const linhasTotais = Object.entries(estado.totais).filter(([,v]) => v > 0).map(([k,v]) => ({ Indicador: k, Total: v }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasTotais), 'Totais');

  const linhasDetalhe = estado.dados.map(r => {
    const obj = { Data: r['Data'], 'Fração de Atuação': r['Fração de Atuação'], Equipe: r['Equipe'], Comandante: r['Comandante'], Operação: (r['Operações']||[]).join(', ') };
    camposProdutividade.forEach(c => { obj[c.nome] = r[c.nome] || 0; });
    return obj;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasDetalhe), 'Relatórios');

  const linhasFracao = estado.rankingFracao.map(([f,v],i) => {
    const linha = { Posição: i+1, Fração: f, Turnos: v.turnos.size };
    estado.camposRanking.forEach(c => { linha[c.nome] = v.valores[c.nome]; });
    return linha;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasFracao), 'Ranking Fração');

  XLSX.writeFile(wb, `produtividade_${new Date().toISOString().slice(0,10)}.xlsx`);
});

document.getElementById('btnExportPdf').addEventListener('click', async () => {
  const estado = window._prodEstadoAtual;
  if (!estado) return;
  const btn = document.getElementById('btnExportPdf');
  btn.disabled = true; btn.textContent = '⏳ Gerando...';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

    // ---- Paleta / geometria ----
    const pageW = doc.internal.pageSize.getWidth();   // 210
    const pageH = doc.internal.pageSize.getHeight();  // 297
    const MARGIN = 14, contentW = pageW - MARGIN*2;
    const OURO = [155,138,92], OURO_CLARO = [212,185,104], ESCURO = [26,16,0];
    const TXT = [40,32,20], MUTED = [120,110,90], LINHA = [225,220,205];
    const TOP_TABELA = 22, BOTTOM = 16;

    // ---- Helpers ----
    const carregarImg_ = (src) => new Promise((res) => {
      const img = new Image();
      img.onload = () => { try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        res({ dataURL: c.toDataURL('image/png'), w: img.naturalWidth, h: img.naturalHeight });
      } catch(e){ res(null); } };
      img.onerror = () => res(null);
      img.src = src;
    });
    const stripHtml_ = (s) => String(s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');

    let y = 0;
    const novaPagina_ = () => { doc.addPage(); y = TOP_TABELA; };
    const garantir_ = (h) => { if (y + h > pageH - BOTTOM) novaPagina_(); };

    // Tabela padronizada (título dourado + estilo listrado)
    const tabela_ = (titulo, head, body, extra) => {
      if (!body.length) return;
      garantir_(16);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...MUTED);
      doc.text(titulo.toUpperCase(), MARGIN, y);
      doc.autoTable(Object.assign({
        startY: y + 3,
        head: [head], body,
        theme: 'striped',
        styles: { fontSize: 7.5, cellPadding: 2, textColor: TXT, lineColor: LINHA, lineWidth: 0.1, overflow: 'linebreak' },
        headStyles: { fillColor: ESCURO, textColor: OURO_CLARO, fontStyle: 'bold', fontSize: 7.5 },
        alternateRowStyles: { fillColor: [247,244,235] },
        margin: { top: TOP_TABELA, bottom: BOTTOM, left: MARGIN, right: MARGIN },
      }, extra||{}));
      y = doc.lastAutoTable.finalY + 8;
    };

    // ---- Filtros selecionados (o PDF reflete exatamente estes) ----
    const opSel   = (document.getElementById('filtroOperacao')?.value || '').trim();
    const fracSel = (document.getElementById('filtroFracao')?.value || '').trim();
    const diSel   = document.getElementById('filtroDataInicio')?.value || estado.periodoIni;
    const dfSel   = document.getElementById('filtroDataFim')?.value   || estado.periodoFim;
    const opLabel   = opSel || 'Todas as operações';
    const fracLabel = fracSel || 'Todas as frações';

    // ---- Cabeçalho institucional (modelo do Relatório de Serviço) ----
    const [imgEsq, imgDir] = await Promise.all([
      carregarImg_('assets/escudo-cpe.png'),
      carregarImg_('assets/brasao-bpmmamb.png'),
    ]);
    const bh = 18;
    if (imgEsq) doc.addImage(imgEsq.dataURL, 'PNG', MARGIN, 10, bh*(imgEsq.w/imgEsq.h), bh);
    if (imgDir) { const w = bh*(imgDir.w/imgDir.h); doc.addImage(imgDir.dataURL, 'PNG', pageW - MARGIN - w, 10, w, bh); }

    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(30,24,14);
    doc.text('Comando de Policiamento Especializado', pageW/2, 13, { align:'center' });
    doc.text('Batalhão de Polícia Militar de Meio Ambiente', pageW/2, 17.5, { align:'center' });
    doc.text('3ª Companhia de Polícia Militar de Meio Ambiente', pageW/2, 22, { align:'center' });
    doc.setFontSize(17); doc.setTextColor(20,16,8);
    doc.text('RELATÓRIO DE PRODUTIVIDADE', pageW/2, 30, { align:'center' });
    doc.setDrawColor(...OURO); doc.setLineWidth(0.7); doc.line(MARGIN, 33, pageW - MARGIN, 33);

    // ---- Operação em destaque + demais filtros ----
    let hy = 39;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...OURO);
    const opLines = doc.splitTextToSize('OPERAÇÃO: ' + opLabel.toUpperCase(), contentW);
    doc.text(opLines, pageW/2, hy, { align:'center' }); hy += opLines.length*5.5 + 1;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...TXT);
    doc.text(`Fração de atuação: ${fracLabel}    |    Período: ${formatarDataBR_(diSel)} a ${formatarDataBR_(dfSel)}`, pageW/2, hy, { align:'center' }); hy += 4.5;
    doc.setFontSize(7.5); doc.setTextColor(...MUTED);
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}`, pageW/2, hy, { align:'center' }); hy += 3;
    doc.setDrawColor(...LINHA); doc.setLineWidth(0.2); doc.line(MARGIN, hy, pageW - MARGIN, hy);
    y = hy + 7;

    // ---- Resumo do período ----
    const resumo = stripHtml_(estado.resumoTexto);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const linhasResumo = doc.splitTextToSize(resumo, contentW - 10);
    const boxH = linhasResumo.length * 4.4 + 12;
    garantir_(boxH);
    doc.setFillColor(250,247,238); doc.setDrawColor(...OURO_CLARO); doc.setLineWidth(0.3);
    doc.roundedRect(MARGIN, y, contentW, boxH, 2, 2, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...OURO);
    doc.text('RESUMO DO PERÍODO', MARGIN + 5, y + 6);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...TXT);
    doc.text(linhasResumo, MARGIN + 5, y + 11);
    y += boxH + 8;

    // ---- Estatísticas (cards) ----
    const s = estado.stats || {};
    const cards = [
      ['Turnos', s.turnos], ['Frações', s.fracoes], ['Equipes', s.equipes],
      ['Militares', s.militares], ['Viaturas', s.viaturas],
    ];
    const nC = cards.length, cw = (contentW - (nC-1)*4) / nC, chh = 16;
    garantir_(chh + 4);
    cards.forEach((c, i) => {
      const x = MARGIN + i*(cw+4);
      doc.setFillColor(247,244,235); doc.setDrawColor(...LINHA); doc.setLineWidth(0.1);
      doc.roundedRect(x, y, cw, chh, 1.5, 1.5, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,24,14);
      doc.text(formatarNumero_(c[1]||0), x + cw/2, y + 8, { align:'center' });
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(...MUTED);
      doc.text(String(c[0]).toUpperCase(), x + cw/2, y + 12.5, { align:'center' });
    });
    y += chh + 8;

    // ---- Produção no período ----
    tabela_('Produção no Período',
      ['Indicador', 'Total'],
      Object.entries(estado.totais).filter(([,v]) => v > 0).map(([k,v]) => [k, formatarNumero_(v)]),
      { columnStyles: { 1: { halign:'right', fontStyle:'bold', cellWidth: 40 } } });

    // ---- Gráficos dedicados ao PDF (gerados fora da tela, tema p/ papel branco) ----
    // Gera um gráfico Chart.js num canvas oculto de alta resolução e devolve o PNG.
    const PALETA = ['#9b8a5c','#2f5233','#8c3b2f','#3d5a80','#c2953a','#6a4c93','#4e8098','#7a7a7a'];
    const gerarGrafico_ = (tipo, data, options, w, h) => {
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.style.position = 'absolute'; cv.style.left = '-99999px'; cv.style.top = '0';
      document.body.appendChild(cv);
      let url = null;
      try {
        const ch = new Chart(cv.getContext('2d'), {
          type: tipo, data,
          options: Object.assign({ responsive:false, animation:false, devicePixelRatio:1 }, options),
        });
        ch.update('none');
        url = cv.toDataURL('image/png', 1.0);
        ch.destroy();
      } catch(e){ console.error('grafico PDF', e); }
      cv.remove();
      return url ? { url, ratio: h/w } : null;
    };
    const truncar_ = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n-1) + '…' : s; };

    const totOrd = Object.entries(estado.totais).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);
    const dias = estado.diasOrdenados || [];
    const porDia = estado.porDia || {};
    const eixo = { ticks:{ color:'#333', font:{ size:12 } }, grid:{ color:'#e8e8e8' } };

    const graf = [];
    // 1) Barra horizontal — Top indicadores
    if (totOrd.length) {
      const top = totOrd.slice(0, 8);
      const g = gerarGrafico_('bar', {
        labels: top.map(([k]) => truncar_(k, 26)),
        datasets: [{ data: top.map(([,v]) => v), backgroundColor:'#9b8a5c', borderRadius:3 }],
      }, {
        indexAxis:'y',
        plugins:{ legend:{ display:false } },
        scales:{ x:{ beginAtZero:true, ...eixo }, y:{ ...eixo, grid:{ display:false } } },
      }, 1000, 560);
      if (g) graf.push({ t:'Top Indicadores (total do período)', ...g });
    }
    // 2) Rosca — Composição da produção
    if (totOrd.length >= 2) {
      const top = totOrd.slice(0, 6);
      const outros = totOrd.slice(6).reduce((s,[,v]) => s+v, 0);
      const comp = outros > 0 ? [...top, ['Outros', outros]] : top;
      const g = gerarGrafico_('doughnut', {
        labels: comp.map(([k]) => truncar_(k, 22)),
        datasets: [{ data: comp.map(([,v]) => v), backgroundColor: PALETA, borderColor:'#fff', borderWidth:2 }],
      }, {
        plugins:{ legend:{ position:'right', labels:{ color:'#222', font:{ size:17 }, boxWidth:20, padding:11 } } },
        cutout:'55%',
      }, 1000, 560);
      if (g) graf.push({ t:'Composição da Produção', ...g });
    }
    // 3) Linha — Produtividade por dia
    if (dias.length) {
      const g = gerarGrafico_('line', {
        labels: dias.map(formatarDataBR_),
        datasets: [{ data: dias.map(d => porDia[d]||0), borderColor:'#9b8a5c', backgroundColor:'rgba(155,138,92,.15)', fill:true, tension:.3, pointRadius:4, pointBackgroundColor:'#d4b968', borderWidth:2 }],
      }, {
        plugins:{ legend:{ display:false } },
        scales:{ x:{ ...eixo, ticks:{ color:'#333', font:{ size:11 } } }, y:{ beginAtZero:true, ...eixo } },
      }, 2050, 560);
      if (g) graf.push({ t:'Produtividade por Dia', full:true, ...g });
    }

    if (graf.length) {
      const meia = (contentW - 6) / 2;
      // Altura da 1ª linha, para o título "GRÁFICOS" nunca ficar sozinho no fim da página.
      let primeiraLinhaH;
      if (graf[0].full) {
        primeiraLinhaH = 5 + Math.min(contentW * graf[0].ratio, 55) + 8;
      } else {
        const par0 = graf[1] && !graf[1].full ? graf[1] : null;
        const h1 = Math.min(meia * graf[0].ratio, 46);
        const h2 = par0 ? Math.min(meia * par0.ratio, 46) : 0;
        primeiraLinhaH = 5 + Math.max(h1, h2) + 8;
      }
      garantir_(6 + primeiraLinhaH);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...MUTED);
      doc.text('GRÁFICOS', MARGIN, y);
      y += 3;
      let i = 0;
      while (i < graf.length) {
        const g = graf[i];
        if (g.full) {
          const w = contentW, h = Math.min(w * g.ratio, 55);
          garantir_(h + 8);
          doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80,70,50);
          doc.text(g.t, MARGIN, y + 3);
          doc.addImage(g.url, 'PNG', MARGIN, y + 5, w, h);
          y += 5 + h + 8; i += 1;
        } else {
          const par = graf[i+1] && !graf[i+1].full ? graf[i+1] : null;
          const h1 = Math.min(meia * g.ratio, 46);
          const h2 = par ? Math.min(meia * par.ratio, 46) : 0;
          const hRow = Math.max(h1, h2);
          garantir_(hRow + 8);
          doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(80,70,50);
          doc.text(g.t, MARGIN, y + 3);
          doc.addImage(g.url, 'PNG', MARGIN, y + 5, meia, h1);
          if (par) {
            doc.text(par.t, MARGIN + meia + 6, y + 3);
            doc.addImage(par.url, 'PNG', MARGIN + meia + 6, y + 5, meia, h2);
          }
          y += 5 + hRow + 8; i += par ? 2 : 1;
        }
      }
    }

    // Ranking (por Fração e por Equipe) fica apenas no Excel, a pedido.

    // ---- Indicadores de desempenho (calculados) ----
    tabela_('Indicadores de Desempenho',
      ['Indicador', 'Valor'],
      (estado.indicadoresCalc||[]).map(ic => [ic.lbl, String(ic.val)]),
      { columnStyles: { 1: { halign:'right', fontStyle:'bold', cellWidth: 32, textColor: OURO } } });

    // ---- Relatórios do período (detalhe) ----
    tabela_('Relatórios do Período',
      ['Data','Fração','Comandante','Tipo de Serviço'],
      estado.dados.map(r => [formatarDataBR_(r['Data']), r['Fração de Atuação']||'—', r['Comandante']||'—', r['Tipo de Serviço']||'—']),
      { styles:{ fontSize:6.8, cellPadding:1.5, textColor:TXT, lineColor:LINHA, lineWidth:0.1, overflow:'linebreak' },
        columnStyles: { 0: { cellWidth: 18 } } });

    // ---- Cabeçalho corrido (págs. > 1) + rodapé com paginação ----
    const totalPg = doc.getNumberOfPages();
    for (let p = 1; p <= totalPg; p++) {
      doc.setPage(p);
      if (p > 1) {
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...OURO);
        doc.text('Relatório de Produtividade — ' + opLabel, MARGIN, 12);
        doc.setDrawColor(...OURO_CLARO); doc.setLineWidth(0.3); doc.line(MARGIN, 14, pageW - MARGIN, 14);
      }
      doc.setDrawColor(...LINHA); doc.setLineWidth(0.2); doc.line(MARGIN, pageH - 12, pageW - MARGIN, pageH - 12);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(140,130,110);
      doc.text('Painel de Gestão Operacional — 3ª Cia PM MAmb', MARGIN, pageH - 8);
      doc.text(`Página ${p} de ${totalPg}`, pageW - MARGIN, pageH - 8, { align:'right' });
    }

    doc.save(`produtividade_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(err){
    console.error('Erro ao gerar PDF:', err);
    alert('Erro ao gerar o PDF.');
  } finally {
    btn.disabled = false; btn.textContent = '🖨 PDF';
  }
});

if (sessao) carregarTudo();
</script>

</body>
