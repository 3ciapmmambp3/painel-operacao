<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhyngzhpznhiidO0D4Dju9-nr8N-3bPR4il683btr_FH0fH8A6HlA7f9oV4nOh-MDj/exec";

const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{
    const s = JSON.parse(raw);
    if(!s || !s.id){ window.location.href='index.html'; return null; }
    return s;
  }catch(e){ window.location.href='index.html'; return null; }
})();

if (sessao){
  document.getElementById('user-nome').textContent = sessao.nome || sessao.matricula;
  const initials = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  const badge = document.getElementById('user-badge');
  const nivel = sessao.nivel_acesso;
  const mapaBadge = {
    admin_geral: ['ADMIN GERAL', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin: ['ADMIN', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin_pelotao: ['ADMIN PELOTÃO', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
    admin_gp: ['ADMIN GP', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
  };
  const info = mapaBadge[nivel] || ['OPERACIONAL', 'rgba(66,165,245,.15)', 'var(--info)', 'rgba(66,165,245,.3)'];
  badge.textContent = info[0];
  badge.style.cssText = `font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;background:${info[1]};color:${info[2]};border:1px solid ${info[3]};`;
  const admTopnavItem = document.getElementById('admTopnavItem');
  const ehAdmin = ['admin_geral','admin','admin_pelotao','admin_gp'].includes(nivel);
  if (admTopnavItem && ehAdmin) admTopnavItem.style.display = '';
  if (nivel === 'admin_geral'){
    const btnImp = document.getElementById('admLinkImportacao');
    if (btnImp) btnImp.style.display = '';
    const btnAdmin = document.getElementById('admLinkAdministracao');
    if (btnAdmin) btnAdmin.style.display = '';
  }
  const podeGerenciarTTA = nivel === 'admin_geral' ||
    ((sessao.funcao||'').toLowerCase() === 'aux p1' && (sessao.grupamento_id||'').toUpperCase() === 'ADM');
  if (podeGerenciarTTA){
    const linkGestao = document.getElementById('linkGestaoTTA');
    if (linkGestao) linkGestao.style.display = '';
  }
  // Exportação (PDF/Excel) só pra quem tem algum nível administrativo.
  if (!ehAdmin){
    const botoes = document.getElementById('prod-export-botoes');
    if (botoes) botoes.style.display = 'none';
  }
}

// ---------- Dropdowns da barra do topo ----------
document.querySelectorAll('.topnav-link[data-dropdown]').forEach(link => {
  link.addEventListener('click', (e) => {
    e.stopPropagation();
    const dd = document.getElementById(link.dataset.dropdown);

    document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!jaAberto) dd.classList.add('open');

document.addEventListener('click', () => {
  document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
});

// ---------- Sidebar: recolher/expandir ----------
(function(){
  const sidebar = document.getElementById('rdSidebar');
  const btn = document.getElementById('rdBtnColapsar');
  if (!sidebar || !btn) return;
  const colapsada = localStorage.getItem('rd_sidebar_colapsada') === '1';
  if (colapsada){ sidebar.classList.add('colapsada'); btn.textContent = '▸'; }
  btn.addEventListener('click', () => {

    localStorage.setItem('rd_sidebar_colapsada', agora ? '1' : '0');

// =====================================================================
// DADOS
// =====================================================================
let camposProdutividade = [];  // [{nome, tipo}], vêm de CAMPOS_PRODUTIVIDADE
let camposNumericos = [];      // mesma lista, sem os campos tipo "Texto" (não somam)
let tipoPorNome = {};          // nome -> tipo, pra formatação
let todosOsRegistros = [];     // cada linha = 1 relatório com Produtividade preenchida
let graficoBarras = null;
let graficoLinha = null;

function normalizar_(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}

// Data de ontem, em hora local (evita o problema de toISOString() converter
// pra UTC e "pular" pro dia errado perto da virada da meia-noite).
function dataOntemISO_(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

// Converte pra número aceitando tanto "5.9" quanto "5,9" (alguns registros
// antigos podem ter sido salvos com vírgula decimal).
function parseNum_(v){
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = v.toString().trim();
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  return parseFloat(s);
}
// Ícone + cor automáticos por palavra-chave do nome do indicador — assim,
// indicadores novos que você adicionar na planilha já ganham visual
// coerente sem eu precisar mexer no código de novo.
const ICONE_REGRAS_ = [
  { re: /pris(ã|a)o|apreens(ã|a)o de adolescente/i, icone: '🚔', cor: '#ef5350' },
  { re: /droga/i, icone: '💊', cor: '#e57373' },
  { re: /arma|muni(çã|ca)o/i, icone: '🔫', cor: '#c62828' },
  { re: /ve(í|i)culo/i, icone: '🚗', cor: '#42a5f5' },
  { re: /animal/i, icone: '🐾', cor: '#66bb6a' },
  { re: /desmate|floresta|madeira|carv(ã|a)o/i, icone: '🌳', cor: '#43a047' },
  { re: /rede|pesc|tarrafa|anz(ó|o)i|covo|espinh|jequi|garat(é|e)ia|pinda|fisga|carretilha/i, icone: '🎣', cor: '#26a69a' },
  { re: /embarca(çã|ca)o|drag|balsa/i, icone: '🚤', cor: '#00acc1' },
  { re: /visita/i, icone: '🤝', cor: '#ffca28' },
  { re: /opera(çã|ca)o/i, icone: '🎯', cor: '#9b8a5c' },
  { re: /autua(çã|ca)o|multa/i, icone: '📝', cor: '#ff9800' },
  { re: /valor|r\$|moeda/i, icone: '💰', cor: '#ffa726' },
  { re: /pessoa|abordad/i, icone: '👤', cor: '#78909c' },
  { re: /local/i, icone: '📍', cor: '#8d6e63' },
  { re: /total (bo|rat|bos|tco)\b/i, icone: '📄', cor: '#90a4ae' },
];
function iconeECor_(nome){
  const regra = ICONE_REGRAS_.find(r => r.re.test(nome));
  return regra ? regra : { icone: '📊', cor: '#9b8a5c' };
}


// "R$", Decimal mostra até 2 casas, Inteiro é número redondo).
function formatarValorPorTipo_(valor, nome){
  const tipo = tipoPorNome[nome] || 'Inteiro';
  if (tipo === 'Moeda') return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (tipo === 'Decimal') return Number(valor).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  return Number(valor).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

async function carregarTudo(){
  const status = document.getElementById('prod-status');
  try {
    const [refRes, prodRes] = await Promise.all([
      auth_fetchReferencias(SCRIPT_URL),
      fetch(`${SCRIPT_URL}?action=listarProdutividade`).then(r => r.json()),
    ]);

    camposProdutividade = refRes.CAMPOS_PRODUTIVIDADE || [];
    camposNumericos = camposProdutividade.filter(c => c.tipo !== 'Texto');
    tipoPorNome = {};
    camposProdutividade.forEach(c => { tipoPorNome[c.nome] = c.tipo; });
    const operacoes = refRes.OPERACOES || [];

    if (prodRes.result !== 'success'){
      document.getElementById('prod-conteudo').innerHTML = '<div class="mr-empty">Erro ao carregar dados de produtividade.</div>';
      return;
    }

    // Escopo de visualização por nível de acesso (mesma regra do resto do sistema).
    todosOsRegistros = (prodRes.produtividade || []).filter(r => auth_podeVerGrupamento(sessao, r['Fração de Atuação']));

    popularFiltroOperacao(operacoes);
    popularFiltroFracao();

    // Por padrão, mostra o dia ANTERIOR (o turno normalmente só termina no
    // fim do dia, então "hoje" apareceria vazio na maior parte das vezes).
    // Se quiser ver outro período, é só trocar as datas nos filtros.
    const ontemISO = dataOntemISO_();
    document.getElementById('filtroDataInicio').value = ontemISO;
    document.getElementById('filtroDataFim').value = ontemISO;

    renderizarTudo();
  } catch(err){
    console.error('Erro ao carregar produtividade:', err);
    document.getElementById('prod-conteudo').innerHTML = '<div class="mr-empty">Erro ao carregar. Recarregue a página.</div>';
  }
}

function popularFiltroOperacao(operacoes){
  const select = document.getElementById('filtroOperacao');
  const nomes = Array.from(new Set(operacoes.map(o => o.value).filter(Boolean))).sort();
  select.innerHTML = '<option value="">Todas</option>' + nomes.map(n => `<option value="${n}">${n}</option>`).join('');
}

function popularFiltroFracao(){
  const select = document.getElementById('filtroFracao');
  const fracoes = Array.from(new Set(todosOsRegistros.map(r => r['Fração de Atuação']).filter(Boolean))).sort();
  select.innerHTML = '<option value="">Todas</option>' + fracoes.map(f => `<option value="${f}">${f}</option>`).join('');
}

function aplicarFiltros(){
  const op = document.getElementById('filtroOperacao').value;
  const dataIni = document.getElementById('filtroDataInicio').value;
  const dataFim = document.getElementById('filtroDataFim').value;
  const fracao = document.getElementById('filtroFracao').value;

  return todosOsRegistros.filter(r => {
    if (op && !(r['Operações']||[]).includes(op)) return false;
    if (dataIni && (!r['Data'] || r['Data'] < dataIni)) return false;
    if (dataFim && (!r['Data'] || r['Data'] > dataFim)) return false;
    if (fracao && r['Fração de Atuação'] !== fracao) return false;
    return true;
  });
}

['filtroOperacao','filtroDataInicio','filtroDataFim','filtroFracao'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderizarTudo);
});
document.getElementById('btnLimparFiltrosProd').addEventListener('click', () => {
  document.getElementById('filtroOperacao').value = '';
  const ontemISO = dataOntemISO_();
  document.getElementById('filtroDataInicio').value = ontemISO;
  document.getElementById('filtroDataFim').value = ontemISO;
  document.getElementById('filtroFracao').value = '';
  renderizarTudo();
});

// =====================================================================
// RENDERIZAÇÃO
// =====================================================================
function renderizarTudo(){
  const dados = aplicarFiltros();
  const conteudo = document.getElementById('prod-conteudo');

  if (!dados.length){
    conteudo.innerHTML = `<div class="mr-empty">${todosOsRegistros.length ? 'Nenhum registro encontrado com esses filtros.' : 'Nenhum dado de Produtividade encontrado no seu escopo de visualização.'}</div>`;
    return;
  }

  // ---- Totais por indicador ----
  const totais = {};
  camposNumericos.forEach(c => totais[c.nome] = 0);
  dados.forEach(r => {
    camposNumericos.forEach(c => {
      const v = parseNum_(r[c.nome]);
      if (!isNaN(v)) totais[c.nome] += v;
    });
  });

  // ---- Estatísticas gerais ----
  const idsUnicos = new Set(dados.map(r => r['ID Relatório']));
  const totalTurnos = idsUnicos.size;
  const fracoesUnicas = new Set(dados.map(r => r['Fração de Atuação']).filter(Boolean));
  const equipesUnicas = new Set(dados.map(r => r['Equipe']).filter(Boolean));
  const totalMilitares = dados.reduce((s,r) => s + (parseNum_(r['Total de Militares (Geral)'])||0), 0);
  const totalViaturas = dados.reduce((s,r) => s + (parseNum_(r['Total de Viaturas (Geral)'])||0), 0);
  const datas = dados.map(r => r['Data']).filter(Boolean).sort();
  const periodoIni = datas[0], periodoFim = datas[datas.length-1];

  // ---- Resumo executivo ----
  const topIndicadores = Object.entries(totais).filter(([,v]) => v>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const resumoTexto = topIndicadores.length
    ? `Entre <b>${formatarDataBR_(periodoIni)}</b> e <b>${formatarDataBR_(periodoFim)}</b>, foram empregados <b>${totalTurnos}</b> turno${totalTurnos!==1?'s':''} em <b>${fracoesUnicas.size}</b> fração${fracoesUnicas.size!==1?'ões':''} de atuação, com <b>${equipesUnicas.size}</b> equipe${equipesUnicas.size!==1?'s':''} distintas, resultando em: `
      + topIndicadores.map(([k,v]) => `<b>${formatarNumero_(v)}</b> ${k.toLowerCase()}`).join(' · ') + '.'
    : `Nenhum indicador de Produtividade preenchido no período selecionado.`;

  // ---- Indicadores marcados pra aparecer no Ranking (coluna "Usar no Ranking") ----
  const camposRanking = camposProdutividade.filter(c => c.usarRanking);

  // ---- Ranking por Fração — uma coluna por indicador, sem somar tipos diferentes ----
  const porFracao = {};
  dados.forEach(r => {
    const f = r['Fração de Atuação'] || '—';
    if (!porFracao[f]) { porFracao[f] = { turnos: new Set(), valores: {} }; camposRanking.forEach(c => porFracao[f].valores[c.nome] = 0); }
    porFracao[f].turnos.add(r['ID Relatório']);
    camposRanking.forEach(c => { porFracao[f].valores[c.nome] += (parseNum_(r[c.nome])||0); });
  });
  const rankingFracao = Object.entries(porFracao).sort((a,b) => b[1].turnos.size - a[1].turnos.size).slice(0,10);

  // ---- Ranking por Equipe — mesma lógica ----
  const porEquipe = {};
  dados.forEach(r => {
    const eq = `${r['Fração de Atuação']||'—'} / Equipe ${r['Equipe']||'—'}`;
    if (!porEquipe[eq]) { porEquipe[eq] = { turnos: new Set(), valores: {} }; camposRanking.forEach(c => porEquipe[eq].valores[c.nome] = 0); }
    porEquipe[eq].turnos.add(r['ID Relatório']);
    camposRanking.forEach(c => { porEquipe[eq].valores[c.nome] += (parseNum_(r[c.nome])||0); });
  });
  const rankingEquipe = Object.entries(porEquipe).sort((a,b) => b[1].turnos.size - a[1].turnos.size).slice(0,10);

  // ---- Produtividade por dia (linha do tempo) ----
  const porDia = {};
  dados.forEach(r => {
    const d = r['Data'] || '—';
    if (!porDia[d]) porDia[d] = 0;
    camposNumericos.forEach(c => { porDia[d] += (parseNum_(r[c.nome])||0); });
  });
  const diasOrdenados = Object.keys(porDia).sort();

  // ---- Indicadores de desempenho calculados ----
  const totalAbordagens = totais['Pessoas Abordadas'] || 0;
  const totalVeicFisc = totais['Veículos Fiscalizados'] || 0;
  const totalPrisoes = (totais['Prisões (Pessoas maiores)']||0) + (totais['Apreensão de Adolescentes']||0);
  const totalVeicApreendidos = totais['Veículos Apreendidos'] || 0;
  const totalLocaisFisc = totais['Locais Fiscalizados'] || 0;
  const totalLocaisDesmate = totais['Locais de Desmate Fiscalizados'] || 0;

  const indicadoresCalc = [
    { lbl: 'Média de abordagens por turno', val: totalTurnos ? (totalAbordagens/totalTurnos).toFixed(1) : '—' },
    { lbl: 'Média de veículos fiscalizados por turno', val: totalTurnos ? (totalVeicFisc/totalTurnos).toFixed(1) : '—' },
    { lbl: 'Prisões por 100 abordagens', val: totalAbordagens ? (totalPrisoes/totalAbordagens*100).toFixed(2) : '—' },
    { lbl: 'Veículos apreendidos por 100 fiscalizados', val: totalVeicFisc ? (totalVeicApreendidos/totalVeicFisc*100).toFixed(2) : '—' },
    { lbl: '% locais fiscalizados com desmate', val: totalLocaisFisc ? (totalLocaisDesmate/totalLocaisFisc*100).toFixed(1)+'%' : '—' },
    { lbl: 'Média diária de produtividade (todos indicadores)', val: diasOrdenados.length ? (diasOrdenados.reduce((s,d)=>s+porDia[d],0)/diasOrdenados.length).toFixed(1) : '—' },
  ];

  // ==================== MONTAGEM DO HTML ====================
  conteudo.innerHTML = `
    <div class="resumo-exec">
      <b>📌 Resumo do Período</b><br><br>${resumoTexto}
    </div>

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="secao-titulo">📊 Estatísticas do Período</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kv">${totalTurnos}</div><div class="kl">Turnos com Produtividade</div></div>
      <div class="kpi-card"><div class="kv">${fracoesUnicas.size}</div><div class="kl">Frações Atendidas</div></div>
      <div class="kpi-card"><div class="kv">${equipesUnicas.size}</div><div class="kl">Equipes Distintas</div></div>
      <div class="kpi-card"><div class="kv">${totalMilitares}</div><div class="kl">Militares Empregados (soma)</div></div>
      <div class="kpi-card"><div class="kv">${totalViaturas}</div><div class="kl">Viaturas Empregadas (soma)</div></div>
    </div>

    <div class="secao-titulo">📈 Gráficos</div>
    <div class="duas-colunas">
      <div class="chart-box"><h4>Top 8 Indicadores (total do período)</h4><canvas id="chartBarras" height="220"></canvas></div>
      <div class="chart-box"><h4>Produtividade por Dia</h4><canvas id="chartLinha" height="220"></canvas></div>
    </div>

    <div class="secao-titulo">🏆 Ranking por Fração de Atuação</div>
    <div class="chart-box" id="prod-ranking-fracao">
      ${!camposRanking.length ? '<div class="mr-empty">Nenhum indicador marcado com "Usar no Ranking" na planilha CAMPOS_PRODUTIVIDADE.</div>' : `
      <div style="overflow-x:auto;">
      <table class="prod-table">
        <thead><tr><th>#</th><th>Fração</th><th>Turnos</th>${camposRanking.map(c => `<th>${iconeECor_(c.nome).icone} ${c.nome}</th>`).join('')}</tr></thead>
        <tbody>${rankingFracao.map(([f,v],i) => `<tr><td><span class="rank-pos">${i+1}</span></td><td>${f}</td><td>${v.turnos.size}</td>${camposRanking.map(c => `<td>${formatarValorPorTipo_(v.valores[c.nome], c.nome)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      </div>`}
    </div>

    <div class="secao-titulo">🏆 Ranking por Equipe</div>
    <div class="chart-box" id="prod-ranking-equipe">
      ${!camposRanking.length ? '<div class="mr-empty">Nenhum indicador marcado com "Usar no Ranking" na planilha CAMPOS_PRODUTIVIDADE.</div>' : `
      <div style="overflow-x:auto;">
      <table class="prod-table">
        <thead><tr><th>#</th><th>Fração / Equipe</th><th>Turnos</th>${camposRanking.map(c => `<th>${iconeECor_(c.nome).icone} ${c.nome}</th>`).join('')}</tr></thead>
        <tbody>${rankingEquipe.map(([f,v],i) => `<tr><td><span class="rank-pos">${i+1}</span></td><td>${f}</td><td>${v.turnos.size}</td>${camposRanking.map(c => `<td>${formatarValorPorTipo_(v.valores[c.nome], c.nome)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
      </div>`}
    </div>

    <div class="secao-titulo">🎯 Indicadores de Desempenho</div>
    <div class="indicadores-calc">
      ${indicadoresCalc.map(ic => `<div class="indicador-calc"><div class="ic-val">${ic.val}</div><div class="ic-lbl">${ic.lbl}</div></div>`).join('')}
    </div>

    <div class="secao-titulo">📋 Relatórios do Período</div>
    <div id="prod-lista-tabela">
      <table class="prod-table detalhe">
        <thead><tr><th>Data</th><th>Fração</th><th>Equipe</th><th>Comandante</th><th>Operação</th></tr></thead>
        <tbody>${dados.map(r => `<tr>
          <td>${formatarDataBR_(r['Data'])}</td>
          <td>${r['Fração de Atuação']||'—'}</td>
          <td>${r['Equipe']||'—'}</td>
          <td>${r['Comandante']||'—'}</td>
          <td>${(r['Operações']||[]).join(', ')||'—'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  `;

  // KPIs dinâmicos (um card por indicador que tiver valor > 0)
  const kpiGrid = document.getElementById('kpi-grid');
  const kpisComValor = Object.entries(totais).filter(([,v]) => v > 0);
  kpiGrid.innerHTML = kpisComValor.length
    ? kpisComValor.map(([k,v]) => {
        const ic = iconeECor_(k);
        return `<div class="kpi-card" style="border-top-color:${ic.cor};"><div class="kv">${ic.icone} ${formatarValorPorTipo_(v,k)}</div><div class="kl">${k}</div></div>`;
      }).join('')
    : '<div class="mr-empty">Nenhum indicador com valor no período.</div>';

  desenharGraficos_(topIndicadores, diasOrdenados, porDia);

  // Guarda o estado atual pra exportação
  window._prodEstadoAtual = { dados, totais, resumoTexto, periodoIni, periodoFim, rankingFracao, rankingEquipe, indicadoresCalc, camposRanking };
}

function formatarNumero_(v){
  return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}
function formatarDataBR_(iso){
  if (!iso) return '—';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function desenharGraficos_(topIndicadores, diasOrdenados, porDia){
  if (graficoBarras) graficoBarras.destroy();
  if (graficoLinha) graficoLinha.destroy();

  const ctxB = document.getElementById('chartBarras');
  if (ctxB){
    const top8 = topIndicadores.length ? topIndicadores : [];
    graficoBarras = new Chart(ctxB, {
      type: 'bar',
      data: {
        labels: top8.map(([k]) => k),
        datasets: [{ data: top8.map(([,v]) => v), backgroundColor: '#9b8a5c' }],
      },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#999',font:{size:9}}}, y:{ticks:{color:'#999'}} } },
    });
  }

  const ctxL = document.getElementById('chartLinha');
  if (ctxL){
    graficoLinha = new Chart(ctxL, {
      type: 'line',
      data: {
        labels: diasOrdenados.map(formatarDataBR_),
        datasets: [{ data: diasOrdenados.map(d => porDia[d]), borderColor:'#9b8a5c', backgroundColor:'rgba(155,138,92,.15)', fill:true, tension:.3 }],
      },
      options: { responsive:true, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#999',font:{size:9}}}, y:{ticks:{color:'#999'}} } },
    });
  }
}

// =====================================================================
// EXPORTAÇÃO — EXCEL
// =====================================================================
document.getElementById('btnExportExcel').addEventListener('click', () => {
  const estado = window._prodEstadoAtual;
  if (!estado) return;

  const wb = XLSX.utils.book_new();

  const linhasTotais = Object.entries(estado.totais).filter(([,v]) => v > 0).map(([k,v]) => ({ Indicador: k, Total: v }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasTotais), 'Totais');

  const linhasDetalhe = estado.dados.map(r => {
    const obj = { Data: r['Data'], 'Fração de Atuação': r['Fração de Atuação'], Equipe: r['Equipe'], Comandante: r['Comandante'], Operação: (r['Operações']||[]).join(', ') };
    camposProdutividade.forEach(c => { obj[c.nome] = r[c.nome] || 0; });
    return obj;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasDetalhe), 'Relatórios');

  const linhasFracao = estado.rankingFracao.map(([f,v],i) => {
    const linha = { Posição: i+1, Fração: f, Turnos: v.turnos.size };
    estado.camposRanking.forEach(c => { linha[c.nome] = v.valores[c.nome]; });
    return linha;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhasFracao), 'Ranking Fração');

  XLSX.writeFile(wb, `produtividade_${new Date().toISOString().slice(0,10)}.xlsx`);
});

// =====================================================================
// EXPORTAÇÃO — PDF
// =====================================================================
document.getElementById('btnExportPdf').addEventListener('click', async () => {
  const estado = window._prodEstadoAtual;
  if (!estado) return;
  const btn = document.getElementById('btnExportPdf');
  btn.disabled = true; btn.textContent = '⏳ Gerando...';

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

    doc.setFontSize(14);
    doc.text('RELATÓRIO DE PRODUTIVIDADE — 3ª CIA PM MAmb', 14, 16);
    doc.setFontSize(9);
    doc.text(`Período: ${formatarDataBR_(estado.periodoIni)} a ${formatarDataBR_(estado.periodoFim)}  |  Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 22);

    const totaisArr = Object.entries(estado.totais).filter(([,v]) => v > 0).map(([k,v]) => [k, formatarNumero_(v)]);
    doc.autoTable({ startY: 28, head: [['Indicador', 'Total']], body: totaisArr, styles:{fontSize:8}, headStyles:{fillColor:[26,16,0]} });

    let y = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(11);
    doc.text('Ranking por Fração de Atuação', 14, y);
    doc.autoTable({ startY: y+3, head: [['#','Fração','Turnos', ...estado.camposRanking.map(c => c.nome)]],
      body: estado.rankingFracao.map(([f,v],i) => [i+1, f, v.turnos.size, ...estado.camposRanking.map(c => formatarValorPorTipo_(v.valores[c.nome], c.nome))]),
      styles:{fontSize:7}, headStyles:{fillColor:[26,16,0]} });

    y = doc.lastAutoTable.finalY + 10;
    if (y > 250){ doc.addPage(); y = 16; }
    doc.setFontSize(11);
    doc.text('Relatórios do Período', 14, y);
    doc.autoTable({ startY: y+3, head: [['Data','Fração','Equipe','Comandante']],
      body: estado.dados.map(r => [formatarDataBR_(r['Data']), r['Fração de Atuação']||'—', r['Equipe']||'—', r['Comandante']||'—']),
      styles:{fontSize:7}, headStyles:{fillColor:[26,16,0]} });

    doc.save(`produtividade_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch(err){
    console.error('Erro ao gerar PDF:', err);
    alert('Erro ao gerar o PDF.');
  } finally {
    btn.disabled = false; btn.textContent = '🖨 PDF';
  }
});

if (sessao) carregarTudo();
