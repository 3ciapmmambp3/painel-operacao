<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha da demanda — 3ª Cia PM MAmb</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- auth.js só p/ SB_AUTH_URL/KEY (esta página NÃO exige login — é pública, aberta pelo link do Cartão). -->
  <script src="auth.js"></script>
  <style>
    *{box-sizing:border-box} body{font-family:'Inter',Arial,Helvetica,sans-serif;color:#000;margin:0;padding:0;background:#e9ece9}
    .vbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;background:#eef2ee;border-bottom:1px solid #cdd5cd;padding:10px 16px}
    .vbar .vt{flex:1;font-weight:700;font-size:13px;color:#3a5a3a}
    .vbar button{font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:7px;border:1px solid #cdd5cd;background:#fff;color:#2a3a2a;cursor:pointer}
    .vbar button.pr{background:#2f5233;color:#fff;border-color:#2f5233}
    .vbar button[disabled]{opacity:.55;cursor:default}
    .doc{background:#fff;color:#000;max-width:820px;margin:22px auto;padding:30px 34px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
    .doc *{color:#000}
    .view-brasoes{display:flex;align-items:flex-start;justify-content:center;gap:20px;text-align:center;border-bottom:2px solid #9b8a5c;padding-bottom:16px;margin-bottom:22px}
    .view-brasoes img{height:74px;width:auto;flex-shrink:0;margin-top:20px}
    .view-titulo{flex:1;min-width:0;padding-top:20px}
    .view-titulo .vt-orgao{font-size:12.5px;font-weight:800;line-height:1.55;text-transform:uppercase;letter-spacing:.02em}
    .view-titulo h1{font-family:'Playfair Display',serif;font-size:24px;margin:1.1em 0 0;letter-spacing:.02em}
    .view-titulo .vt-id{font-size:11.5px;font-weight:700;margin-top:8px;letter-spacing:.02em}
    h4.sec{font-family:'Playfair Display',serif;font-size:16px;margin:26px 0 10px}
    h4.sec small{font-family:'Inter',sans-serif;font-weight:400;font-size:11.5px;color:#3a5a3a}
    table.t{width:100%;border-collapse:collapse;margin-bottom:10px;table-layout:fixed}
    table.t td{padding:6px 10px;font-size:14px;line-height:1.45;border:0;border-bottom:1px solid #ddd;vertical-align:top;word-wrap:break-word}
    table.t td.l{width:38%;color:#666;font-weight:600}
    table.t td a{color:#0645ad;text-decoration:underline;word-break:break-all}
    table.t td.bl{padding:8px 10px}
    table.t td.bl .bl-l{display:block;color:#666;font-weight:600;font-size:13px;margin-bottom:3px}
    table.t td.bl .bl-v{white-space:pre-wrap;word-wrap:break-word;line-height:1.5;text-align:justify;text-justify:inter-word}
    .state{max-width:820px;margin:60px auto;text-align:center;color:#3a5a3a;font-size:15px;font-weight:600}
    @media print{@page{margin:0} body{background:#fff} .vbar{display:none!important} .doc{max-width:none;margin:0;padding:16mm;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="vbar">
    <span class="vt">👁 Ficha da demanda — confira e clique em Imprimir / PDF</span>
    <button class="pr" id="btn-print" onclick="window.print()" disabled>🖨 Imprimir / PDF</button>
    <button id="btn-dl" onclick="baixarPDF()" disabled>⬇ Baixar PDF</button>
  </div>
  <div id="app"><div class="state">Carregando ficha…</div></div>

<script>
const API=(typeof SB_AUTH_URL!=='undefined')?SB_AUTH_URL:'';
const AKEY=(typeof SB_AUTH_KEY!=='undefined')?SB_AUTH_KEY:'';
const H={'apikey':AKEY,'Authorization':'Bearer '+AKEY,'Content-Type':'application/json'};
const SIT_LBL={ PENDENTE:'Pendente', 'EM ANDAMENTO':'Em andamento', CONCLUIDA:'Concluída', RESPONDIDA:'Respondida', FINALIZADA:'Finalizada', DEVOLVIDA:'Devolvida', INATIVADA:'Inativada' };
const E = v => (v==null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmtData(iso){ if(!iso) return '—'; const p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):String(iso); }
function recebDe(d){ return d.data_recebimento || (d.created_at ? String(d.created_at).slice(0,10) : ''); }

// Monta o HTML da ficha — IDÊNTICO ao gerarPDF() de denuncias.html.
function fichaHTML(d){
  const denuncia = d.tipo==='denuncia';
  const titulo = denuncia ? 'FICHA DE DENÚNCIA' : 'FICHA DE REQUISIÇÃO';
  const nrTexto = (denuncia ? 'DENÚNCIA' : 'REQUISIÇÃO') + ' Nº ' + (d.numero||'') + ' — 3ª CIA PM MAmb';
  const _dig = s => (s==null?'':s).toString().replace(/\D/g,'');
  const _ident = (mat, nome) => {
    const n = (nome==null?'':String(nome)).trim();
    if(!n && !mat) return '—';
    if(mat && _dig(n).includes(_dig(mat))) return 'Nº PM ' + E(n.toUpperCase());
    return (mat ? 'Nº PM ' + E(mat) + ' — ' : '') + E((n||'—').toUpperCase());
  };
  const row = (lbl,val) => '<tr><td class="l">'+E(lbl)+'</td><td>'+((val==null||val==='')?'—':E(val))+'</td></tr>';
  const rowH = (lbl,htmlVal) => '<tr><td class="l">'+E(lbl)+'</td><td>'+(htmlVal||'—')+'</td></tr>';
  const rowBlk = (lbl,val) => '<tr><td class="bl" colspan="2"><span class="bl-l">'+E(lbl)+'</span><div class="bl-v">'+((val==null||val==='')?'—':E(val))+'</div></td></tr>';
  const anexosArr = (d.anexos||[]);
  const anexoCell = anexosArr.length
    ? anexosArr.map(a => {
        const nome = E(a.nome||'anexo');
        const href = a.link || a.web_view_link;
        return href ? '<a href="'+String(href).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+nome+'</a>' : nome;
      }).join('<br>')
    : '';
  const corpo = denuncia
    ? row('Infração', d.tema)+row('Município', d.municipio)+rowBlk('Endereço', d.endereco)+
      row('Denunciante', d.denunciante)+row('Denunciado', d.denunciado)+
      rowBlk('Histórico', d.descricao)+rowBlk('Roteiro', d.referencia)+
      rowH('PM que recebeu', _ident(d.registrado_por_matricula, d.registrado_por_nome))+row('Data de recebimento', fmtData(recebDe(d)))+
      rowH('Anexo', anexoCell)+rowBlk('Observações', d.observacoes)
    : row('Origem', d.origem)+row('Nº ofício/processo', d.numero_oficio)+row('Infração', d.tema)+
      row('Município', d.municipio)+rowBlk('Endereço', d.endereco)+rowBlk('Objeto', d.objeto)+
      rowBlk('Histórico', d.descricao)+rowBlk('Roteiro', d.referencia)+
      rowH('PM que recebeu', _ident(d.registrado_por_matricula, d.registrado_por_nome))+row('Data de recebimento', fmtData(recebDe(d)))+
      row('Prazo', fmtData(d.prazo))+rowH('Anexo', anexoCell)+rowBlk('Observações', d.observacoes);
  const respondida = d.situacao==='RESPONDIDA' || d.situacao==='CONCLUIDA';
  const respostaRows = respondida
    ? row('Situação', SIT_LBL[d.situacao]||d.situacao)
      + row(denuncia?'Data da fiscalização':'Data de atendimento', fmtData(d.data_resposta))
      + row('Equipe', d.resp_equipe)
      + row('Viatura', d.resp_viatura)
      + row('Nº REDS (BO/BOS/RAT)', d.numero_reds)
      + row('Nº Auto de Infração', d.numero_auto_infracao)
      + row('Nº Ato de Fiscalização', d.numero_ato_fiscalizacao)
      + (d.observacoes_resposta ? rowBlk('Observações da resposta', d.observacoes_resposta) : '')
    : '';
  return '<div class="doc">'
    + '<div class="view-brasoes">'
    +   '<img src="assets/escudo-cpe.png" alt="CPE" onerror="this.style.display=\'none\'">'
    +   '<div class="view-titulo">'
    +     '<div class="vt-orgao">Comando de Policiamento Especializado</div>'
    +     '<div class="vt-orgao">Batalhão de Polícia Militar de Meio Ambiente</div>'
    +     '<div class="vt-orgao">3ª Companhia de Polícia Militar de Meio Ambiente</div>'
    +     '<h1>'+titulo+'</h1>'
    +     '<div class="vt-id">'+E(nrTexto)+'</div>'
    +   '</div>'
    +   '<img src="assets/brasao-bpmmamb.png" alt="BPM MAmb" onerror="this.style.display=\'none\'">'
    + '</div>'
    + '<h4 class="sec">'+(denuncia?'Dados da denúncia':'Dados da requisição')+'</h4>'
    + '<table class="t">'+corpo+'</table>'
    + (respondida?('<h4 class="sec">Resposta / Atendimento <small>— conforme lançado no relatório de serviço</small></h4><table class="t">'+respostaRows+'</table>'):'')
    + '</div>';
}

let _D=null;
function _nomeArq(d){
  const denuncia = d.tipo==='denuncia';
  return (denuncia?'DENÚNCIA':'REQUISIÇÃO')+' Nº '+String(d.numero||'').replace(/[\\/:*?"<>|]+/g,'-');
}

async function baixarPDF(){
  if(!_D) return;
  const btn=document.getElementById('btn-dl'); const orig=btn.textContent;
  btn.textContent='⏳ Gerando…'; btn.disabled=true;
  try{
    if(!(window.html2pdf)){
      await new Promise((res,rej)=>{ const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    try{ await (document.fonts?document.fonts.ready:0); }catch(e){}
    const el=document.querySelector('.doc');
    try{ await Promise.all([].map.call(el.querySelectorAll('img'),i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;}))); }catch(e){}
    await window.html2pdf().set({
      margin:[10,10,12,10],
      filename:_nomeArq(_D)+'.pdf',
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(el).save();
  }catch(e){ console.error('html2pdf',e); alert('Não consegui gerar o PDF automático. Use "Imprimir / PDF" e salve como PDF.'); }
  btn.textContent=orig; btn.disabled=false;
}

(async function(){
  const app=document.getElementById('app');
  const id=new URLSearchParams(location.search).get('id');
  if(!id){ app.innerHTML='<div class="state">Ficha não informada (falta o parâmetro da demanda).</div>'; return; }
  if(!API||!AKEY){ app.innerHTML='<div class="state">Configuração indisponível.</div>'; return; }
  try{
    const q=API+'/rest/v1/denuncias?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1';
    const r=await fetch(q,{headers:H});
    if(!r.ok) throw new Error(r.status+' '+await r.text());
    const arr=await r.json();
    const d=Array.isArray(arr)?arr[0]:null;
    if(!d){ app.innerHTML='<div class="state">Demanda não encontrada ou indisponível.</div>'; return; }
    _D=d;
    app.innerHTML=fichaHTML(d);
    document.title=_nomeArq(d);
    document.getElementById('btn-print').disabled=false;
    document.getElementById('btn-dl').disabled=false;
  }catch(e){
    console.error('ficha-publica',e);
    app.innerHTML='<div class="state">Erro ao carregar a ficha. Tente novamente mais tarde.</div>';
  }
})();
</script>
</body>
</html>
