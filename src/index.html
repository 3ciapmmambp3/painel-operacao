<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3ª Cia PM MAmb — Login</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#1e1e1e;}
    .card{background:#2d2d2d;border-radius:12px;width:100%;max-width:430px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7);}
    .banner img{width:100%;display:block;}
    .body{padding:28px 36px 32px;}
    .ttl{color:#fff;font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;}
    .sub{color:#999;font-size:13px;text-align:center;margin-bottom:28px;}
    .lbl{display:block;color:var(--gold);font-size:13px;font-weight:600;margin-bottom:7px;}
    .fw{position:relative;margin-bottom:20px;}
    .fw input{width:100%;background:#1a1a1a;border:1px solid #444;border-radius:7px;padding:11px 42px 11px 14px;color:#eee;font-size:14px;outline:none;transition:border-color .2s;}
    .fw input::placeholder{color:#555;}
    .fw input:focus{border-color:var(--gold);}
    .eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;display:flex;align-items:center;}
    .eye:hover{color:var(--gold);}
    .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .btn-enter{width:100%;background:var(--gold);color:#1a1000;border:none;border-radius:7px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;}
    .btn-enter:hover{background:var(--gold-light);}
    .btn-enter:disabled{opacity:.7;cursor:not-allowed;}
    .link-forgot{display:block;text-align:center;color:var(--gold);font-size:13px;margin-top:16px;cursor:pointer;}
    .link-forgot:hover{color:var(--gold-light);text-decoration:underline;}
    .info-box{background:#1a1a1a;border:1px solid #3a3a3a;border-radius:7px;padding:14px 16px;margin-top:20px;}
    .info-box p{color:#777;font-size:12px;line-height:1.65;text-align:center;}
    .err{background:rgba(239,83,80,.13);border:1px solid rgba(239,83,80,.35);border-radius:6px;color:#ef9a9a;font-size:13px;padding:10px 14px;margin-bottom:16px;text-align:center;display:none;}
    .err.show{display:block;}
  </style>
  <script src="pwa.js" defer></script>
</head>
<body>
<div class="card">
  <div class="banner"><img src="assets/header-pmmg.png" alt="PMMG"></div>
  <div class="body">
    <h1 class="ttl">Painel de Gestão Operacional</h1>
    <p class="sub">3ª Cia PM MAmb — Polícia Militar de Minas Gerais</p>

    <div class="err" id="err"></div>

    <label class="lbl">Número de Polícia</label>
    <div class="fw">
      <input type="text" id="np" placeholder="000.000-0" maxlength="9"
             autocomplete="username" oninput="fmtNP(this)">
    </div>

    <label class="lbl">Senha</label>
    <div class="fw">
      <input type="password" id="pw" placeholder="••••••••"
             maxlength="100" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')handleLogin()">
      <button type="button" class="eye" onclick="togglePw()">
        <svg id="eye-ic" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="btn-enter" id="btn-enter" onclick="handleLogin()">Entrar</button>

    <a class="link-forgot" onclick="alert('Entre em contato com o administrador do sistema.')">
      Esqueci minha senha
    </a>

    <div class="info-box">
      <p>O cadastro de novos usuários é feito exclusivamente pelo administrador.<br>
         Caso não possua acesso, entre em contato com o responsável.</p>
    </div>
  </div>
</div>

<script>
function fmtNP(el){
  let v = el.value.replace(/[^0-9]/g, '');
  if(v.length > 7) v = v.slice(0, 7);
  if(v.length > 6)      v = v.slice(0,3) + '.' + v.slice(3,6) + '-' + v.slice(6);
  else if(v.length > 3) v = v.slice(0,3) + '.' + v.slice(3);
  el.value = v;
}

function togglePw(){
  const i = document.getElementById('pw');
  const ic = document.getElementById('eye-ic');
  if(i.type === 'password'){
    i.type = 'text';
    ic.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    i.type = 'password';
    ic.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

async function handleLogin(){
  const np  = document.getElementById('np').value.trim();
  const pw  = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn-enter');

  err.classList.remove('show');

  if(!np || !pw){
    err.textContent = 'Preencha o número de polícia e a senha.';
    err.classList.add('show');
    return;
  }

  btn.textContent = '⏳ Entrando...';
  btn.disabled = true;

  const r = await SbAuth.login(np, pw);

  btn.textContent = 'Entrar';
  btn.disabled = false;

  if(!r.ok){
    err.textContent = r.erro;
    err.classList.add('show');
    return;
  }

  if(r.primeiroAcesso){
    window.location.href = 'trocar-senha.html';
  } else {
    window.location.href = 'inicio.html';
  }
}
</script>
</body>
</html>
