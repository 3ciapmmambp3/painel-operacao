<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){
  var saved;
  try{ saved=localStorage.getItem('poe_theme'); }catch(e){}
  if(!saved) saved=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiais TCO/SEMAD — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <script src="demandas-sidebar.js"></script>
  <style>
    body{display:flex;flex-direction:column;min-height:100vh;}
    .mr-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin:20px;}
    .mr-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
    .mr-toolbar h2{font-size:14px;color:var(--text-white);}
    .mr-empty{color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0;}
    #mr-lista{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table.mr-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
    table.mr-table th{text-align:left;color:var(--text-muted);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;}
    table.mr-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--text-white);}
    table.mr-table tr.linha-clicavel{cursor:pointer;}
    table.mr-table tr.linha-clicavel:hover{background:rgba(155,138,92,.08);}
    .mr-filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .mr-filtro-input{background:var(--bg-dark);color:var(--text-white);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;}
    .mr-paginacao{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;}
    .mr-paginacao button:disabled{opacity:.4;cursor:not-allowed;}

    .sub-tabs{display:flex;gap:8px;margin-bottom:16px;}
    .sub-tab{padding:8px 18px;border-radius:6px;border:1px solid var(--border);color:var(--text-muted);font-size:13px;font-weight:700;cursor:pointer;background:transparent;}
    .sub-tab.active{color:#1a1000;background:var(--gold);border-color:var(--gold);}

    .status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap;}

    /* ---- Modal ---- */
    .modal-overlay{position:fixed;inset:0;background:rgba(18,30,25,0.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:var(--bg-card);border-radius:8px;width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);}
    .modal-head{display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;color:var(--gold);padding:16px 22px;border-radius:8px 8px 0 0;flex-shrink:0;border-bottom:2px solid var(--gold);}
    .modal-head h3{font-size:16px;font-weight:700;color:var(--gold);}
    .modal-close{background:rgba(155,138,92,.18);border:none;color:var(--gold);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;}
    .modal-close:hover{background:rgba(155,138,92,.32);}
    .modal-body{padding:20px 22px;overflow-y:auto;flex:1;}
    .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;flex-wrap:wrap;gap:10px;}

    .info-secao{margin-bottom:18px;}
    .info-secao h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
    .info-item label{display:block;font-size:10px;color:var(--text-muted);text-transform:uppercase;margin-bottom:2px;}
    .info-item .valor{font-size:13px;color:var(--text-white);}
    .info-item.full{grid-column:1/-1;}

    .campo-edit{margin-bottom:14px;}
    .campo-edit label{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;font-weight:700;}
    .campo-edit select, .campo-edit input[type="text"], .campo-edit input[type="date"]{
      width:100%;background:var(--bg-dark);color:var(--text-white);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;
    }
    .anexo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .anexo-row a{color:var(--gold);font-size:12px;}
    .anexo-row input[type="file"]{font-size:11px;color:var(--text-muted);max-width:220px;}
    .anexo-status{font-size:11px;color:var(--text-muted);}

    .btn-danger{background:transparent;border:1px solid #ef5350;color:#ef5350;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
    .btn-danger:hover{background:rgba(239,83,80,.12);}
    .somente-leitura-aviso{background:rgba(66,165,245,.12);border:1px solid rgba(66,165,245,.35);color:#64b5f6;font-size:12px;padding:8px 12px;border-radius:6px;margin-bottom:14px;}

    /* ---- Nova barra de navegação (topo, com dropdown) ---- */
    .topnav{display:flex;align-items:center;gap:2px;background:var(--bg-dark);border-bottom:1px solid var(--border);padding:0 16px;position:relative;z-index:20;}
    .topnav-item{position:relative;}
    .topnav-link{display:flex;align-items:center;gap:5px;padding:11px 9px;color:var(--text-muted);font-size:11px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
    .topnav-link:hover{color:var(--text-white);}
    .topnav-link.active{color:var(--gold);border-bottom-color:var(--gold);}
    .topnav-link .chev{font-size:9px;opacity:.7;}
    .topnav-dropdown{display:none;position:absolute;top:100%;left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:0 0 8px 8px;min-width:190px;box-shadow:0 12px 24px rgba(0,0,0,.4);padding:6px;}
    .topnav-dropdown.open{display:block;}
    .topnav-dropdown a{display:block;padding:9px 12px;color:var(--text-white);font-size:12.5px;border-radius:6px;}
    .topnav-dropdown a:hover{background:var(--bg-hover);color:var(--gold);}

    /* ---- Layout com sidebar interna (área "Relatório Diário") ---- */
    .page-layout{display:flex;flex:1;}
    .rd-sidebar{width:198px;flex-shrink:0;background:var(--bg-dark);border-right:1px solid var(--border);padding:14px 10px;transition:width .18s;}
    .rd-sidebar.colapsada{width:52px;}
    .rd-sidebar.colapsada .lbl,.rd-sidebar.colapsada .rd-sidebar-titulo{display:none;}
    .rd-sidebar.colapsada .rd-item{justify-content:center;padding:9px;}
    .rd-sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;}
    .rd-sidebar.colapsada .rd-sidebar-head{justify-content:center;}
    .rd-sidebar-titulo{color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
    .rd-btn-colapsar{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:3px;display:flex;}
    .rd-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;color:var(--text-muted);font-size:12.5px;cursor:pointer;white-space:nowrap;margin-bottom:1px;position:relative;}
    .rd-item[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:10px;background:#111;color:var(--text-white);padding:6px 12px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.5);border:1px solid var(--border);pointer-events:none;}
    .rd-item:hover{background:var(--bg-hover);}
    .rd-item.ativo{background:var(--gold-bg);color:var(--gold-light);font-weight:700;}
    .rd-conteudo{flex:1;min-width:0;}

    @media screen and (max-width: 768px){
      .topnav{flex-wrap:wrap;overflow:visible;}
      .topnav-link{padding:11px 12px;font-size:11.5px;}
      .page-layout{flex-direction:column;}
      .rd-sidebar{width:100% !important;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:nowrap;flex-direction:row;gap:4px;padding:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
      .rd-sidebar::-webkit-scrollbar{display:none;}
      .rd-sidebar-head{display:none;} /* título + botão de recolher não fazem sentido na fita horizontal */
      .rd-btn-colapsar{display:none;} /* no celular a sidebar já fica em formato de fita, sem precisar recolher */
      .rd-sidebar .lbl{display:inline;} /* garante que o rótulo não some, mesmo se "colapsada" tiver sido marcada antes */
      .rd-item{flex:0 0 auto;justify-content:center;font-size:11px;padding:8px 10px;white-space:nowrap;}
    }
  </style>
  <script src="pwa.js" defer></script>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhyngzhpznhiidO0D4Dju9-nr8N-3bPR4il683btr_FH0fH8A6HlA7f9oV4nOh-MDj/exec";

const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{
    const s = JSON.parse(raw);
    if(!s || !s.id){ window.location.href='index.html'; return null; }
    return s;
  }catch(e){ window.location.href='index.html'; return null; }
})();

if (sessao){
  document.getElementById('user-nome').textContent = sessao.nome || sessao.matricula;
  const initials = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  const badge = document.getElementById('user-badge');
  const nivel = sessao.nivel_acesso;
  const mapaBadge = {
    admin_geral: ['ADMIN GERAL', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin: ['ADMIN', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin_pelotao: ['ADMIN PELOTÃO', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
    admin_gp: ['ADMIN GP', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
  };
  const info = mapaBadge[nivel] || ['OPERACIONAL', 'rgba(66,165,245,.15)', 'var(--info)', 'rgba(66,165,245,.3)'];
  badge.textContent = info[0];
  badge.style.cssText = `font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;background:${info[1]};color:${info[2]};border:1px solid ${info[3]};`;
  const admTopnavItem = document.getElementById('admTopnavItem');
  if (admTopnavItem && ['admin_geral','admin','admin_pelotao','admin_gp'].includes(nivel)){
    admTopnavItem.style.display = '';
  }
  if (nivel === 'admin_geral'){
    const btnImp = document.getElementById('admLinkImportacao');
    if (btnImp) btnImp.style.display = '';
    const btnAdmin = document.getElementById('admLinkAdministracao');
    if (btnAdmin) btnAdmin.style.display = '';
  }
}

// ---------- Dropdowns da barra do topo (OPERAÇÃO / ADM) ----------
document.querySelectorAll('.topnav-link[data-dropdown]').forEach(link => {
  link.addEventListener('click', (e) => {
    e.stopPropagation();
    const dd = document.getElementById(link.dataset.dropdown);
    const jaAberto = dd.classList.contains('open');
    document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
    if (!jaAberto) dd.classList.add('open');
  });
});
document.addEventListener('click', () => {
  document.querySelectorAll('.topnav-dropdown.open').forEach(d => d.classList.remove('open'));
});

// ---------- Sidebar do Relatório Diário: recolher/expandir (lembra a escolha) ----------
(function(){
  const sidebar = document.getElementById('rdSidebar');
  const btn = document.getElementById('rdBtnColapsar');
  if (!sidebar || !btn) return;
  const colapsada = localStorage.getItem('rd_sidebar_colapsada') === '1';
  if (colapsada){ sidebar.classList.add('colapsada'); btn.textContent = '▸'; }
  btn.addEventListener('click', () => {
    sidebar.classList.toggle('colapsada');
    const agora = sidebar.classList.contains('colapsada');
    btn.textContent = agora ? '▸' : '◂';
    localStorage.setItem('rd_sidebar_colapsada', agora ? '1' : '0');
  });
})();

// ---------- Configuração de status por aba (valor + cor) ----------
const STATUS_POR_ABA = {
  TCO: [
    { value: 'PENDENTE', cor: '#ef5350' },
    { value: 'ENCAMINHADO', cor: '#42a5f5' },
    { value: 'AGUARDANDO AUTORIZAÇÃO JUDICIAL', cor: '#ffa726' },
    { value: 'DESTRUÍDO', cor: '#9e9e9e' },
    { value: 'RESTITUÍDO', cor: '#66bb6a' },
  ],
  SEMAD: [
    { value: 'PENDENTE DE ENCAMINHAMENTO', cor: '#ef5350' },
    { value: 'ENCAMINHADO', cor: '#66bb6a' },
  ],
};

// Campos administrativos editáveis diretamente (texto/data) por aba — não
// inclui os campos de anexo (PDF), que são tratados à parte.
const CAMPOS_ADMIN_TEXTO = {
  TCO: [
    { campo: 'BOS/RAT/REDS DESTRUIÇÃO / RESTITUIÇÃO DO MATERIAL', label: 'BOS/RAT/REDS de Destruição/Restituição', tipo: 'text' },
  ],
  SEMAD: [
    { campo: 'DATA ENCAMINHADO', label: 'Data Encaminhado', tipo: 'date' },
  ],
};

// Campos de anexo (PDF) por aba.
const CAMPOS_ANEXO = {
  TCO: [
    { campo: 'OFÍCIO DE ENCAMINHAMENTO DO "TCO"', label: 'Ofício de Encaminhamento do TCO' },
    { campo: 'OFÍCIO SOLICITANDO DESTRUIÇÃO / RESTITUIÇÃO DOS MATERIAIS', label: 'Ofício Solicitando Destruição/Restituição' },
    { campo: 'AUTORIZAÇÃO JUDICIAL PARA DESTRUIÇÃO / RESTITUIÇÃO', label: 'Autorização Judicial' },
    { campo: 'OFÍCIO COMUNICANDO O "MP"', label: 'Ofício Comunicando o MP' },
    { campo: 'OFÍCIO COMUNICANDO O "JUDICIÁRIO"', label: 'Ofício Comunicando o Judiciário' },
  ],
  SEMAD: [
    { campo: 'OFÍCIO DE ENCAMINHAMENTO DOS MATERIAIS APREENDIDOS', label: 'Ofício de Encaminhamento' },
  ],
};

// Campos "de origem" (lançados no relatório, somente leitura nesta tela) por aba.
const CAMPOS_ORIGEM = {
  TCO: [
    ['REDS', 'Nº REDS (BO/BOS/RAT)'],
    ['NATUREZA (CÓDIGO)', 'Natureza (Código)'],
    ['QUANTIDADE', 'Quantidade de Materiais'],
    ['Nº ENVELOPE/LACRE', 'Nº Envelope/Lacre'],
    ['MATERIAIS APREENDIDOS', 'Material Apreendido (Descrição)', true],
    ['LOCAL DE ACAUTELAMENTO DOS MATERIAIS', 'Local de Acautelamento', true],
    ['COMARCA', 'Comarca'],
    ['NOME DO AUTOR / ENVOLVIDO', 'Nome do Autor/Envolvido'],
    ['DATA DA AUDIÊNCIA', 'Data da Audiência'],
    ['HORA DA AUDIÊNCIA', 'Hora da Audiência'],
    ['OBSERVAÇÕES', 'Observações', true],
  ],
  SEMAD: [
    ['DATA', 'Data'],
    ['REDS', 'Nº REDS (BO/BOS/RAT)'],
    ['AUTO DE INFRAÇÃO SISEMA', 'Nº Auto de Infração'],
    ['MATERIAIS APREENDIDOS', 'Materiais Apreendidos', true],
    ['OBSERVAÇÕES', 'Observações', true],
  ],
};

let abaAtual = 'TCO';
let todosMateriais = [];
let paginaAtual = 1;
const ITENS_POR_PAGINA = 15;
let itemEmEdicao = null; // material atualmente aberto no modal

function statusInfo(aba, valor){
  const lista = STATUS_POR_ABA[aba] || [];
  return lista.find(s => s.value === valor) || null;
}

function badgeStatusHTML(aba, valor){
  if (!valor) return '<span class="status-badge" style="background:rgba(255,255,255,.08);color:var(--text-muted);">—</span>';
  const info = statusInfo(aba, valor);
  const cor = info ? info.cor : '#78909c';
  return `<span class="status-badge" style="background:${cor}22;color:${cor};border:1px solid ${cor}66;">${valor}</span>`;
}

function popularFiltroSituacao(){
  const select = document.getElementById('filtroSituacao');
  const lista = STATUS_POR_ABA[abaAtual] || [];
  select.innerHTML = '<option value="">Todas as situações</option>'
    + lista.map(s => `<option value="${s.value}">${s.value}</option>`).join('');
}

function trocarAba(aba){
  abaAtual = aba;
  document.getElementById('rdItemTco')?.classList.toggle('ativo', aba === 'TCO');
  document.getElementById('rdItemSemad')?.classList.toggle('ativo', aba === 'SEMAD');
  document.getElementById('tituloAcompanhamento').textContent = `Materiais Acautelados — ${aba}`;
  document.getElementById('filtroBusca').value = '';
  paginaAtual = 1;
  popularFiltroSituacao();
  carregarMateriais();
}

function aplicarFiltros(lista){
  const situacao = document.getElementById('filtroSituacao').value;
  const busca = document.getElementById('filtroBusca').value.trim().toUpperCase();
  return lista.filter(item => {
    if (situacao && item['SITUAÇÃO DO MATERIAIS APREENDIDOS'] !== situacao) return false;
    if (busca){
      const alvo = `${item['REDS'] || ''} ${item['NOME DO AUTOR / ENVOLVIDO'] || ''}`.toUpperCase();
      if (alvo.indexOf(busca) === -1) return false;
    }
    return true;
  });
}

function renderizarTabela(){
  const lista = document.getElementById('mr-lista');
  const paginacao = document.getElementById('mr-paginacao');
  const filtrados = aplicarFiltros(todosMateriais);

  if (!filtrados.length){
    const msg = todosMateriais.length
      ? 'Nenhum material encontrado com esses filtros.'
      : `Nenhum ${abaAtual} encontrado no seu escopo de visualização.`;
    lista.innerHTML = `<div class="mr-empty" id="mr-status">${msg}</div>`;
    paginacao.innerHTML = '';
    return;
  }

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / ITENS_POR_PAGINA));
  if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
  const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
  const pagina = filtrados.slice(inicio, inicio + ITENS_POR_PAGINA);

  const colunaData = abaAtual === 'TCO' ? 'DATA REDS' : 'DATA';
  const colunaResumo = 'MATERIAIS APREENDIDOS';

  const linhas = pagina.map((item, idx) => {
    const resumo = (item[colunaResumo] || '').toString();
    const resumoCurto = resumo.length > 40 ? resumo.slice(0, 40) + '...' : resumo;
    return `<tr class="linha-clicavel" data-idx="${inicio + idx}">
      <td>${item['REDS'] || '—'}</td>
      <td>${item[colunaData] || '—'}</td>
      <td>${item['GRUPAMENTO'] || '—'}</td>
      <td>${resumoCurto || '—'}</td>
      <td>${badgeStatusHTML(abaAtual, item['SITUAÇÃO DO MATERIAIS APREENDIDOS'])}</td>
    </tr>`;
  }).join('');

  lista.innerHTML = `<table class="mr-table">
    <thead><tr><th>REDS</th><th>DATA</th><th>GRUPAMENTO</th><th>MATERIAL</th><th>SITUAÇÃO</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;

  lista.querySelectorAll('tr[data-idx]').forEach(tr => {
    tr.addEventListener('click', () => {
      const idx = parseInt(tr.dataset.idx, 10);
      abrirDetalhe(filtrados[idx]);
    });
  });

  paginacao.innerHTML = `
    <button class="btn-outline" id="btnPagAnterior" ${paginaAtual === 1 ? 'disabled' : ''}>‹ Anterior</button>
    <span style="color:var(--text-muted);font-size:12px;">Página ${paginaAtual} de ${totalPaginas} (${filtrados.length} item${filtrados.length === 1 ? '' : 's'})</span>
    <button class="btn-outline" id="btnPagProxima" ${paginaAtual === totalPaginas ? 'disabled' : ''}>Próxima ›</button>
  `;
  const btnAnt = document.getElementById('btnPagAnterior');
  const btnProx = document.getElementById('btnPagProxima');
  if (btnAnt) btnAnt.addEventListener('click', () => { paginaAtual--; renderizarTabela(); });
  if (btnProx) btnProx.addEventListener('click', () => { paginaAtual++; renderizarTabela(); });
}

async function carregarMateriais(){
  const lista = document.getElementById('mr-lista');
  lista.innerHTML = '<div class="mr-empty" id="mr-status">Carregando...</div>';
  document.getElementById('mr-paginacao').innerHTML = '';

  try {
    const res = await fetch(`${SCRIPT_URL}?action=listarMateriais&aba=${abaAtual}`);
    const data = await res.json();
    if (data.result !== 'success'){
      lista.innerHTML = '<div class="mr-empty" id="mr-status">Erro ao carregar materiais.</div>';
      return;
    }
    // Filtra pelo escopo de visualização do usuário logado (Admin Geral/Admin
    // veem tudo; Admin Pelotão vê o pelotão; Admin GP só o próprio GP).
    todosMateriais = (data.materiais || []).filter(item => auth_podeVerGrupamento(sessao, item['GRUPAMENTO']));
    paginaAtual = 1;
    renderizarTabela();
  } catch(err){
    console.error('Erro ao carregar materiais:', err);
    lista.innerHTML = '<div class="mr-empty" id="mr-status">Erro ao carregar materiais. Recarregue a página.</div>';
  }
}

['filtroSituacao', 'filtroBusca'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { paginaAtual = 1; renderizarTabela(); });
});
document.getElementById('btnLimparFiltros').addEventListener('click', () => {
  document.getElementById('filtroSituacao').value = '';
  document.getElementById('filtroBusca').value = '';
  paginaAtual = 1;
  renderizarTabela();
});

// ---------- Modal de Detalhe / Edição ----------
function podeEditar(item){
  if (!auth_podeVerGrupamento(sessao, item['GRUPAMENTO'])) return false;
  return sessao.nivel_acesso !== 'admin'; // Admin só visualiza
}
function podeExcluir(){
  return sessao.nivel_acesso === 'admin_geral';
}
function editorAtual(){
  return {
    matricula: sessao.matricula || '',
    nome: (sessao.nome || '').toUpperCase(),
    pg: (sessao.pg || '').toUpperCase(),
  };
}

function abrirDetalhe(item){
  itemEmEdicao = item;
  const editavel = podeEditar(item);
  const excluivel = podeExcluir();

  document.getElementById('modalTitulo').textContent = `${abaAtual} — REDS ${item['REDS'] || ''}`;
  document.getElementById('btnExcluir').style.display = excluivel ? '' : 'none';
  document.getElementById('btnSalvarModal').style.display = editavel ? '' : 'none';

  const origem = CAMPOS_ORIGEM[abaAtual] || [];
  const origemHTML = origem.map(([campo, label, full]) => `
    <div class="info-item${full ? ' full' : ''}">
      <label>${label}</label>
      <div class="valor">${item[campo] || '—'}</div>
    </div>`).join('');

  const situacaoOpts = (STATUS_POR_ABA[abaAtual] || [])
    .map(s => `<option value="${s.value}" ${item['SITUAÇÃO DO MATERIAIS APREENDIDOS'] === s.value ? 'selected' : ''}>${s.value}</option>`).join('');

  const camposTexto = (CAMPOS_ADMIN_TEXTO[abaAtual] || []).map(c => `
    <div class="campo-edit">
      <label>${c.label}</label>
      <input type="${c.tipo}" data-campo-admin="${c.campo}" value="${item[c.campo] || ''}" ${editavel ? '' : 'disabled'}>
    </div>`).join('');

  const anexosHTML = (CAMPOS_ANEXO[abaAtual] || []).map(c => {
    const link = item[c.campo] || '';
    return `
    <div class="campo-edit">
      <label>${c.label}</label>
      <div class="anexo-row">
        ${link ? `<a href="${link}" target="_blank" rel="noopener">📄 Ver anexo atual</a>` : '<span class="anexo-status">Nenhum anexo ainda</span>'}
        ${editavel ? `<input type="file" accept="application/pdf" data-campo-anexo="${c.campo}">` : ''}
        <span class="anexo-status" data-status-anexo="${c.campo}"></span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('modalBody').innerHTML = `
    ${!editavel ? '<div class="somente-leitura-aviso">Você tem permissão apenas para visualizar este item.</div>' : ''}
    <div class="info-secao">
      <h4>Dados do Lançamento</h4>
      <div class="info-grid">
        <div class="info-item"><label>Grupamento</label><div class="valor">${item['GRUPAMENTO'] || '—'}</div></div>
        <div class="info-item"><label>Nº de Ordem</label><div class="valor">${item['NR. DE ORDEM'] || '—'}</div></div>
        ${origemHTML}
      </div>
    </div>
    <div class="info-secao">
      <h4>Acompanhamento Administrativo</h4>
      <div class="campo-edit">
        <label>Situação</label>
        <select data-campo-admin="SITUAÇÃO DO MATERIAIS APREENDIDOS" ${editavel ? '' : 'disabled'}>${situacaoOpts}</select>
      </div>
      ${camposTexto}
      ${anexosHTML}
    </div>
  `;

  // Upload automático ao escolher o arquivo.
  document.querySelectorAll('[data-campo-anexo]').forEach(input => {
    input.addEventListener('change', () => uploadAnexo(input));
  });

  document.getElementById('modalOverlay').classList.add('open');
}

function fecharModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  itemEmEdicao = null;
}
document.getElementById('modalCloseX').addEventListener('click', fecharModal);
document.getElementById('btnFecharModal').addEventListener('click', fecharModal);

async function uploadAnexo(inputEl){
  const campo = inputEl.dataset.campoAnexo;
  const arquivo = inputEl.files[0];
  if (!arquivo || !itemEmEdicao) return;
  const statusEl = document.querySelector(`[data-status-anexo="${campo}"]`);
  if (statusEl) statusEl.textContent = 'Enviando...';
  inputEl.disabled = true;

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(arquivo);
    });

    const payload = {
      modo: 'anexo',
      aba: abaAtual,
      reds: itemEmEdicao['REDS'],
      campo: campo,
      nomeArquivo: arquivo.name,
      arquivoBase64: base64,
      editadoPor: editorAtual(),
    };

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: new URLSearchParams({ payload: JSON.stringify(payload) }),
    });
    const data = await res.json();
    if (data.result !== 'success'){
      if (statusEl) statusEl.textContent = 'Erro no envio.';
      alert('Erro ao enviar anexo: ' + (data.erro || 'desconhecido'));
      return;
    }
    itemEmEdicao[campo] = data.link;
    if (statusEl) statusEl.textContent = 'Enviado com sucesso!';
    const alvo = todosMateriais.find(m => m['REDS'] === itemEmEdicao['REDS']);
    if (alvo) alvo[campo] = data.link;
    setTimeout(() => abrirDetalhe(itemEmEdicao), 600);
  } catch(err){
    console.error('Erro no upload:', err);
    if (statusEl) statusEl.textContent = 'Erro no envio.';
    alert('Erro ao enviar o anexo.');
  } finally {
    inputEl.disabled = false;
  }
}

document.getElementById('btnSalvarModal').addEventListener('click', async () => {
  if (!itemEmEdicao) return;
  const btn = document.getElementById('btnSalvarModal');
  const campos = {};
  document.querySelectorAll('[data-campo-admin]').forEach(el => {
    campos[el.dataset.campoAdmin] = el.value;
  });

  btn.disabled = true;
  btn.textContent = 'Salvando...';
  try {
    const payload = {
      modo: 'atualizarAdministrativo',
      aba: abaAtual,
      reds: itemEmEdicao['REDS'],
      campos: campos,
      editadoPor: editorAtual(),
    };
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: new URLSearchParams({ payload: JSON.stringify(payload) }),
    });
    const data = await res.json();
    if (data.result !== 'success'){
      alert('Erro ao salvar: ' + (data.erro || 'desconhecido'));
      return;
    }
    Object.assign(itemEmEdicao, campos);
    const alvo = todosMateriais.find(m => m['REDS'] === itemEmEdicao['REDS']);
    if (alvo) Object.assign(alvo, campos);
    fecharModal();
    renderizarTabela();
  } catch(err){
    console.error('Erro ao salvar:', err);
    alert('Erro ao salvar as alterações.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar alterações';
  }
});

document.getElementById('btnExcluir').addEventListener('click', async () => {
  if (!itemEmEdicao) return;
  const confirmar = confirm(`Tem certeza que deseja EXCLUIR o ${abaAtual} do REDS ${itemEmEdicao['REDS']}? Essa ação não pode ser desfeita.`);
  if (!confirmar) return;

  const btn = document.getElementById('btnExcluir');
  btn.disabled = true;
  try {
    const payload = {
      modo: 'excluirMaterial',
      aba: abaAtual,
      reds: itemEmEdicao['REDS'],
      editadoPor: editorAtual(),
    };
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: new URLSearchParams({ payload: JSON.stringify(payload) }),
    });
    const data = await res.json();
    if (data.result !== 'success'){
      alert('Erro ao excluir: ' + (data.erro || 'desconhecido'));
      return;
    }
    todosMateriais = todosMateriais.filter(m => m['REDS'] !== itemEmEdicao['REDS']);
    fecharModal();
    renderizarTabela();
  } catch(err){
    console.error('Erro ao excluir:', err);
    alert('Erro ao excluir o item.');
  } finally {
    btn.disabled = false;
  }
});

if (sessao){
  const abaDaUrl = new URLSearchParams(window.location.search).get('aba');
  if (abaDaUrl === 'SEMAD') abaAtual = 'SEMAD';
  document.getElementById('rdItemTco')?.classList.toggle('ativo', abaAtual === 'TCO');
  document.getElementById('rdItemSemad')?.classList.toggle('ativo', abaAtual === 'SEMAD');
  document.getElementById('tituloAcompanhamento').textContent = `Materiais Acautelados — ${abaAtual}`;
  popularFiltroSituacao();
  carregarMateriais();
}
</script>
