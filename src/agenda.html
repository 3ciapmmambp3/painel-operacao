<script>
(function(){
  var saved; try{ saved=localStorage.getItem('poe_theme'); }catch(e){}
  if(!saved) saved=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();

  <style>
    body{display:flex;flex-direction:column;min-height:100vh;}
    .topnav .hubdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
    .hub-p1{background:#6f97b8}.hub-p2{background:#9184c9}.hub-p3{background:var(--gold)}

    .pr-media{background:rgba(255,183,77,.14);color:#ffb74d;border:1px solid rgba(255,183,77,.35);}

    /* modal */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-start;justify-content:center;z-index:1000;padding:36px 16px;overflow:auto;}

<script>
const SECOES = {
  p1:{nome:'Recursos Humanos',   cor:'#6f97b8', selo:'P1'},
  p2:{nome:'Inteligência',       cor:'#9184c9', selo:'P2'},
  p3:{nome:'Emprego Operacional',cor:'#b3a06e', selo:'P3'},
  p4:{nome:'Apoio Logístico',    cor:'#bd8149', selo:'P4'},
  p5:{nome:'Comunicação Organizacional', cor:'#56a89c', selo:'P5'}
};
const ST_LABEL = {pendente:'Pendente', em_andamento:'Em andamento', concluida:'Concluída'};
const PR_LABEL = {alta:'Alta', media:'Média', baixa:'Baixa'};

const secao = (new URLSearchParams(location.search).get('secao')||'').toLowerCase();
const meta = SECOES[secao];

const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{ const s = JSON.parse(raw); if(!s||!s.id){ window.location.href='index.html'; return null; } return s; }
  catch(e){ window.location.href='index.html'; return null; }
})();

let TAREFAS = [];
let filtro = 'abertas';
const MIL_MAP = {};   // dígitos da matrícula (7) → {matricula, nome, label}
let MILITARES = [];        // lista completa p/ o seletor múltiplo (com grupamento)
let MULTI_SEL = new Set(); // dígitos (7) marcados no seletor "Atribuir a vários"
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = ()=>({'apikey':SB_AUTH_KEY,'Authorization':`Bearer ${SB_AUTH_KEY}`,'Content-Type':'application/json'});
async function rpc(fn, body){
  const r = await fetch(`${SB_AUTH_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:H(),body:JSON.stringify(body)});
  const txt = await r.text(); let data; try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!r.ok){ throw new Error((data && (data.message||data.hint)) || 'Falha na operação.'); }
  return data;
}
const _p2 = n => String(n).padStart(2,'0');
// prazo e conclusão agora têm HORA (timestamptz) → exibe dd/mm/aaaa HH:MM
const fmtD  = s => { if(!s) return ''; const d=new Date(s); return isNaN(d)?String(s):`${d.toLocaleDateString('pt-BR')} ${_p2(d.getHours())}:${_p2(d.getMinutes())}`; };
const fmtDT = fmtD;
// ISO → valor do <input datetime-local> (hora local)
const toLocalInput = s => { if(!s) return ''; const d=new Date(s); if(isNaN(d)) return ''; return `${d.getFullYear()}-${_p2(d.getMonth()+1)}-${_p2(d.getDate())}T${_p2(d.getHours())}:${_p2(d.getMinutes())}`; };

function initHeaderSessao(){
  const nome = sessao.nome || sessao.matricula;
  document.getElementById('user-nome').textContent = nome;
  const ini = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent = ini;
}

function boot(){
  if(!meta){ document.body.innerHTML='<p style="padding:40px;text-align:center;color:#aaa;">Seção inválida.</p>'; return; }
  document.getElementById('ag-selo').textContent = meta.selo;
  document.getElementById('ag-selo').style.background = meta.cor;
  document.getElementById('ag-nome').textContent = 'Agenda — '+meta.nome;
  document.getElementById('ag-back').href = 'hub-'+secao+'.html';
  initHeaderSessao();
  carregarMilitares();
  _bindPm('f-responsavel','f-responsavel-nome');
  _bindPm('f-executor','f-executor-nome');
  carregar();
}

async function carregarMilitares(){
  try{
    const lst = await rpc('agenda_pessoas_listar', {p_token: sessao.token});
    const dl = document.getElementById('dl-militares'); let html='';
    MILITARES = [];
    (lst||[]).forEach(m=>{
      const dig = (m.matricula||'').replace(/\D/g,'');
      if(!dig) return;
      const nome = m.nome_completo || m.nome_guerra || m.matricula;
      const label = [m.posto_graduacao, m.nome_guerra||nome].filter(Boolean).join(' ');
      const key = dig.padStart(7,'0');
      MIL_MAP[key] = {matricula: m.matricula, nome, label};
      MILITARES.push({ dig:key, matricula:m.matricula, nome, nome_guerra:m.nome_guerra||'', posto:m.posto_graduacao||'', grupamento:m.grupamento_id||'' });
      html += `<option data-mat="${esc(m.matricula)}" data-nome="${esc(nome)}" value="${esc(label)}"></option>`;
    });
    if(dl) dl.innerHTML = html;
    // re-resolve os hints caso o modal já esteja aberto
    _milHint('f-responsavel','f-responsavel-nome');
    _milHint('f-executor','f-executor-nome');
  }catch(e){ /* roster opcional; segue com o texto digitado */ }
}

async function carregar(){
  const box = document.getElementById('ag-list');
  try{
    TAREFAS = await rpc('agenda_listar', {p_token: sessao.token, p_secao: secao}) || [];
    render();
  }catch(e){
    document.getElementById('ag-conteudo').innerHTML =
      `<div class="ag-restrito"><div class="lk">🔒 Acesso restrito</div>
       <p style="color:var(--text-muted);font-size:13px;margin-top:8px;">A agenda da seção <b>${meta.selo}</b> é visível apenas aos militares dessa seção, ao Comando e ao Admin Geral.</p></div>`;
  }
}

function contagens(){
  const c={todas:TAREFAS.length,abertas:0,pendente:0,em_andamento:0,concluida:0};
  TAREFAS.forEach(t=>{ c[t.status]=(c[t.status]||0)+1; if(t.status!=='concluida') c.abertas++; });
  return c;
}
function render(){
  const c=contagens();
  const defs=[['abertas','Abertas'],['pendente','Pendentes'],['em_andamento','Em andamento'],['concluida','Concluídas'],['todas','Todas']];
  document.getElementById('ag-filtros').innerHTML = defs.map(([k,l])=>
    `<span class="fchip ${filtro===k?'on':''}" onclick="setFiltro('${k}')">${l} <span class="cnt">${c[k]||0}</span></span>`).join('');

  const lista = TAREFAS.filter(t => filtro==='todas' ? true : filtro==='abertas' ? t.status!=='concluida' : t.status===filtro);
  const box = document.getElementById('ag-list');
  if(!lista.length){ box.innerHTML = `<div class="ag-empty">Nenhuma tarefa ${filtro==='todas'?'':'('+({abertas:'aberta',pendente:'pendente',em_andamento:'em andamento',concluida:'concluída'}[filtro])+')'} por aqui.<br><br><button class="btn-gold" onclick="abrirModal()">+ Nova tarefa</button></div>`; return; }
  box.innerHTML = lista.map(cardHTML).join('');
}

function cardHTML(t){
  const atrasada = t.prazo && t.status!=='concluida' && new Date(t.prazo) < new Date();
  const meta1=[];
  const _resp = t.responsavel_nome || t.responsavel_matricula;
  if(_resp) meta1.push(`👤 deve fazer: <b>${esc(_resp)}</b>`);
  if(t.prazo) meta1.push(`📅 prazo: <b class="${atrasada?'atras':''}">${fmtD(t.prazo)}${atrasada?' (atrasado)':''}</b>`);
  if(t.status==='concluida'){
    const _exec = t.executor_nome || t.executor_matricula;
    if(_exec) meta1.push(`✅ fez: <b>${esc(_exec)}</b>`);
    if(t.data_conclusao) meta1.push(`🏁 <b>${fmtDT(t.data_conclusao)}</b>`);
  }
  if(t.criado_por_nome) meta1.push(`✍ criado por ${esc(t.criado_por_nome)}`);

  const acoes=[];
  if(t.status==='concluida'){
    // Concluída é imutável: sem Editar/Reabrir — só Complementar (reabre + registra).
    acoes.push(`<button class="tkb go" onclick="complementar('${t.id}')">＋ Complementar</button>`);
  } else {
    if(t.status==='pendente') acoes.push(`<button class="tkb" onclick="mudarStatus('${t.id}','em_andamento')">▶ Iniciar</button>`);
    acoes.push(`<button class="tkb go" onclick="mudarStatus('${t.id}','concluida')">✔ Concluir</button>`);
    acoes.push(`<button class="tkb" onclick="abrirModal('${t.id}')">✎ Editar</button>`);
  }
  acoes.push(`<button class="tkb del" onclick="excluir('${t.id}')">🗑 Excluir</button>`);

  const hist = Array.isArray(t.historico) ? t.historico : [];
  const histHTML = hist.length ? `<div class="tk-hist">${hist.map(h=>{
      const quando = h.em ? fmtDT(h.em) : '';
      if(h.tipo==='complemento')
        return `<div class="th"><b>＋ Complemento</b> · ${esc(h.por_nome||'')}${quando?' · '+quando:''}<div class="tht">${esc(h.texto||'')}</div></div>`;
      return `<div class="th"><b>✔ Concluída</b> · ${esc(h.por_nome||'')}${quando?' · '+quando:''}</div>`;
    }).join('')}</div>` : '';

  return `<div class="tk st-${t.status}">
    <div class="tk-top">
      <div style="flex:1;min-width:0;">
        <div class="tk-tit">${esc(t.titulo)}</div>
        ${t.descricao?`<div class="tk-desc">${esc(t.descricao)}</div>`:''}
      </div>
      <span class="badge pr-${t.prioridade}">${PR_LABEL[t.prioridade]||t.prioridade}</span>
      <span class="st-tag stt-${t.status}">${ST_LABEL[t.status]||t.status}</span>
    </div>
    ${meta1.length?`<div class="tk-meta">${meta1.map(m=>`<span>${m}</span>`).join('')}</div>`:''}
    ${t.observacao?`<div class="tk-meta"><span>🗒 ${esc(t.observacao)}</span></div>`:''}
    ${histHTML}
    <div class="tk-acoes">${acoes.join('')}</div>
  </div>`;
}

function setFiltro(k){ filtro=k; render(); }

async function mudarStatus(id, status){
  try{ await rpc('agenda_status', {p_token: sessao.token, p_id: id, p_status: status}); await carregar(); }
  catch(e){ alert(e.message); }
}
async function complementar(id){
  const t = TAREFAS.find(x=>x.id===id);
  const txt = prompt(`Complementar a demanda "${t?t.titulo:''}".\n\nDescreva o que ainda precisa ser feito. A tarefa volta para PENDENTE e o pedido fica registrado no histórico:`);
  if(txt===null) return;                       // cancelou
  if(!txt.trim()){ alert('Descreva o complemento.'); return; }
  try{ await rpc('agenda_complementar', {p_token: sessao.token, p_id: id, p_texto: txt.trim()}); await carregar(); }
  catch(e){ alert(e.message); }
}
async function excluir(id){
  const t = TAREFAS.find(x=>x.id===id);
  if(!confirm(`Excluir a tarefa "${t?t.titulo:''}"? Esta ação não pode ser desfeita.`)) return;
  try{ await rpc('agenda_excluir', {p_token: sessao.token, p_id: id}); await carregar(); }
  catch(e){ alert(e.message); }
}

// ── Militar: aceita Nº PM (com máscara 000.000-0) OU nome (autocomplete) ──
function _pmMask(v){
  const d=(v||'').replace(/\D/g,'').slice(0,7); let o='';
  if(d.length)   o=d.slice(0,3);
  if(d.length>3) o+='.'+d.slice(3,6);
  if(d.length>6) o+='-'+d.slice(6,7);
  return o;
}
const _ehNumero = v => /^[\d.\-\s]*$/.test(v||'');   // só dígitos/separadores → é matrícula
function _milPorNome(val){
  const dl=document.getElementById('dl-militares'); if(!dl) return null;
  const opt=Array.from(dl.options).find(o=>o.value.toUpperCase()===(val||'').toUpperCase());
  return opt ? {mat: opt.dataset.mat||'', nome: opt.dataset.nome||val} : null;
}
function _resolveMilitar(inputId){
  const val=(document.getElementById(inputId).value||'').trim();
  if(!val) return {mat:'', nome:''};
  if(_ehNumero(val)){
    const dig=val.replace(/\D/g,''); if(!dig) return {mat:'', nome:''};
    const m=MIL_MAP[dig.padStart(7,'0')];
    if(m) return {mat:m.matricula, nome:m.nome};
    return {mat:_pmMask(val), nome:''};      // Nº PM fora do efetivo: guarda o número
  }
  return _milPorNome(val) || {mat:'', nome: val};   // nome do roster ou nome livre
}
function _milHint(inputId, hintId){
  const h=document.getElementById(hintId); if(!h) return;
  const val=(document.getElementById(inputId).value||'').trim();
  if(!val){ h.textContent=''; h.className='mil-hint'; return; }
  if(_ehNumero(val)){
    const dig=val.replace(/\D/g,'');
    if(dig.length<7){ h.textContent='digite os 7 dígitos do Nº PM…'; h.className='mil-hint'; return; }
    const m=MIL_MAP[dig.padStart(7,'0')];
    if(m){ h.textContent='✓ '+m.label; h.className='mil-hint ok'; }
    else  { h.textContent='Nº PM fora do efetivo — será salvo assim mesmo'; h.className='mil-hint no'; }
  } else {
    const m=_milPorNome(val);
    if(m){ h.textContent='✓ '+(m.nome||val); h.className='mil-hint ok'; }
    else  { h.textContent='nome livre (não vinculado ao efetivo)'; h.className='mil-hint'; }
  }
}
function _bindPm(inputId, hintId){
  const el=document.getElementById(inputId); if(!el || el.dataset.pmBound) return;
  el.dataset.pmBound='1';
  el.addEventListener('input', ()=>{
    if(_ehNumero(el.value)) el.value=_pmMask(el.value);   // mascara só quando é número
    _milHint(inputId, hintId);
  });
}
function _setMilitarInput(inputId, matricula, nome, hintId){
  const el = document.getElementById(inputId); if(!el) return;
  const dig=(matricula||'').replace(/\D/g,'');
  if(dig){ const m=MIL_MAP[dig.padStart(7,'0')]; el.value = m ? m.label : _pmMask(matricula); }
  else   { el.value = nome||''; }
  if(hintId) _milHint(inputId, hintId);
}
function abrirModal(id){
  const t = id ? TAREFAS.find(x=>x.id===id) : null;
  if(t && t.status==='concluida'){ alert('Tarefa concluída não pode ser editada. Use "Complementar" para reabrir.'); return; }
  document.getElementById('mdl-titulo').textContent = t ? 'Editar tarefa' : 'Nova tarefa';
  document.getElementById('f-id').value = t? t.id : '';
  document.getElementById('f-titulo').value = t? (t.titulo||'') : '';
  document.getElementById('f-descricao').value = t? (t.descricao||'') : '';
  document.getElementById('f-prioridade').value = t? (t.prioridade||'media') : 'media';
  document.getElementById('f-status').value = t? (t.status||'pendente') : 'pendente';
  _setMilitarInput('f-responsavel', t? t.responsavel_matricula : '', t? t.responsavel_nome : '', 'f-responsavel-nome');
  document.getElementById('f-prazo').value = t? toLocalInput(t.prazo) : '';
  _setMilitarInput('f-executor', t? t.executor_matricula : '', t? t.executor_nome : '', 'f-executor-nome');
  document.getElementById('f-observacao').value = t? (t.observacao||'') : '';
  toggleExecutor();
  limparMulti();
  document.getElementById('btn-multi').style.display = t ? 'none' : '';   // lote só p/ tarefa nova
  const m=document.getElementById('mmsg'); m.className='mmsg'; m.textContent='';
  document.getElementById('ov').classList.add('show');
}
function fecharModal(){ document.getElementById('ov').classList.remove('show'); }
document.getElementById('f-status').addEventListener('change', toggleExecutor);
function toggleExecutor(){
  document.getElementById('fg-executor').style.display =
    document.getElementById('f-status').value==='concluida' ? '' : 'none';
}
async function salvar(){
  const titulo = document.getElementById('f-titulo').value.trim();
  const msg = document.getElementById('mmsg');
  if(!titulo){ msg.className='mmsg err'; msg.textContent='Informe o título da tarefa.'; return; }
  const resp = _resolveMilitar('f-responsavel');
  const exec = _resolveMilitar('f-executor');
  const dados = {
    id: document.getElementById('f-id').value || '',
    secao: secao,
    titulo,
    descricao: document.getElementById('f-descricao').value.trim(),
    prioridade: document.getElementById('f-prioridade').value,
    status: document.getElementById('f-status').value,
    responsavel_matricula: resp.mat, responsavel_nome: resp.nome,
    executor_matricula: exec.mat, executor_nome: exec.nome,
    prazo: (function(v){ return v ? new Date(v).toISOString() : ''; })(document.getElementById('f-prazo').value),
    observacao: document.getElementById('f-observacao').value.trim()
  };
  const btn=document.getElementById('f-salvar'); btn.disabled=true; btn.textContent='Salvando…';
  try{
    if(MULTI_SEL.size && !dados.id){
      // LOTE: 1 tarefa por militar marcado (cada um executa/conclui a sua).
      const alvos = [...MULTI_SEL];
      let feitas=0, erros=0;
      for(const dig of alvos){
        const m = MIL_MAP[dig]; if(!m) continue;
        const d = Object.assign({}, dados, { responsavel_matricula: m.matricula, responsavel_nome: m.nome });
        try{ await rpc('agenda_salvar', {p_token: sessao.token, p_dados: d}); feitas++; }
        catch(e){ erros++; }
        btn.textContent = `Salvando… ${feitas}/${alvos.length}`;
      }
      limparMulti(); fecharModal(); await carregar();
      if(erros) alert(`${feitas} tarefa(s) criada(s). ${erros} falharam.`);
    } else {
      await rpc('agenda_salvar', {p_token: sessao.token, p_dados: dados}); fecharModal(); await carregar();
    }
  }
  catch(e){ msg.className='mmsg err'; msg.textContent=e.message; }
  finally{ btn.disabled=false; btn.textContent='Salvar'; }
}

/* ── Seletor "Atribuir a vários" (todos da Companhia, com desmarcar) ── */
function abrirMulti(){ renderMulti(); document.getElementById('ov-multi').classList.add('show'); }
function fecharMulti(){ document.getElementById('ov-multi').classList.remove('show'); }
function _grpLabel(g){ return (g||'—').replace(/\s*\/\s*3 CIA PM MAMB.*/i,'').trim() || '—'; }
function renderMulti(){
  const q = (document.getElementById('multi-busca').value||'').toLowerCase().trim();
  const box = document.getElementById('multi-list');
  const lst = MILITARES.filter(m=>{
    if(!q) return true;
    return (m.nome+' '+m.nome_guerra+' '+m.matricula+' '+m.dig).toLowerCase().indexOf(q)>=0;
  });
  if(!lst.length){ box.innerHTML='<div class="multi-empty">Nenhum militar encontrado.</div>'; atualizarMultiCount(); return; }
  const grupos = {};
  lst.forEach(m=>{ const g=_grpLabel(m.grupamento); (grupos[g]=grupos[g]||[]).push(m); });
  const chaves = Object.keys(grupos).sort();
  box.innerHTML = chaves.map(g=>{
    const itens = grupos[g].map(m=>{
      const ck = MULTI_SEL.has(m.dig) ? 'checked' : '';
      const pm = m.matricula || m.dig;
      return `<label class="multi-item">
        <input type="checkbox" ${ck} onchange="toggleMil('${m.dig}',this.checked)">
        <span class="mi-pm">${esc(pm)}</span>
        <span class="mi-pg">${esc(m.posto||'')}</span>
        <span class="mi-nm">${esc(m.nome)}</span>
      </label>`;
    }).join('');
    return `<div class="multi-grp">
      <div class="multi-grp-head"><span class="gnome">${esc(g)}</span>
        <button type="button" class="gsel" onclick="marcarGrupo('${esc(g).replace(/'/g,"\\'")}',true)">marcar grupo</button></div>
      ${itens}</div>`;
  }).join('');
  atualizarMultiCount();
}
function toggleMil(dig, on){ if(on) MULTI_SEL.add(dig); else MULTI_SEL.delete(dig); atualizarMultiCount(); }
function marcarTodos(on){ if(on) MILITARES.forEach(m=>MULTI_SEL.add(m.dig)); else MULTI_SEL.clear(); renderMulti(); }
function marcarGrupo(gLabel, on){
  MILITARES.filter(m=>_grpLabel(m.grupamento)===gLabel).forEach(m=>{ if(on) MULTI_SEL.add(m.dig); else MULTI_SEL.delete(m.dig); });
  renderMulti();
}
function atualizarMultiCount(){ document.getElementById('multi-count').textContent = `${MULTI_SEL.size} selecionado(s)`; }
function confirmarMulti(){ fecharMulti(); atualizarMultiState(); }
function atualizarMultiState(){
  const el = document.getElementById('multi-state');
  const resp = document.getElementById('f-responsavel');
  if(MULTI_SEL.size){
    el.style.display='flex';
    el.innerHTML = `<span>👥 <b>${MULTI_SEL.size}</b> militar(es) — 1 tarefa para cada</span><button type="button" onclick="limparMulti()">remover</button>`;
    resp.disabled = true; resp.value=''; resp.placeholder='(usando seleção de vários)';
  } else { limparMulti(); }
}
function limparMulti(){
  MULTI_SEL.clear();
  const el=document.getElementById('multi-state'); if(el){ el.style.display='none'; el.innerHTML=''; }
  const resp=document.getElementById('f-responsavel'); if(resp){ resp.disabled=false; resp.placeholder='000.000-0 ou nome'; }
}

if(sessao) boot();
</script>
