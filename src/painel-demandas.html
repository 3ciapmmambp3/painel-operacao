<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){ var s; try{ s=localStorage.getItem('poe_theme'); }catch(e){} if(!s) s=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'; document.documentElement.setAttribute('data-theme', s); })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Demandas — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <style>
    body{display:flex;flex-direction:column;min-height:100vh;}
    .page-layout{display:flex;flex:1;}
    .rd-conteudo{flex:1;min-width:0;}
    .pd-wrap{width:100%;max-width:1200px;margin:0 auto;padding:20px 22px 44px;flex:1;}
    .pd-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
    .pd-head .pd-badge{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--bg-dark);border:1px solid var(--gold-border);font-size:22px;flex-shrink:0;}
    .pd-head h1{font-size:19px;color:var(--text-white);letter-spacing:.4px;}
    .pd-head .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .pd-head .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .pd-head select{padding:7px 10px;background:var(--bg-input);border:1px solid var(--border-hover);border-radius:6px;color:var(--text-white);font-size:12.5px;outline:none;}
    .pd-head .stamp{font-size:11px;color:var(--text-hint);text-align:right;}

    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
    .kpi{background:var(--bg-card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:8px;padding:14px 16px;}
    .kpi.red{border-top-color:var(--danger);}.kpi.amber{border-top-color:#ffa726;}.kpi.green{border-top-color:var(--success);}
    .kpi .lab{font-size:10px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.5px;}
    .kpi .val{font-size:30px;font-weight:800;color:var(--text-white);line-height:1;margin-top:6px;}

    .sec-title{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.7px;margin:20px 2px 10px;}
    .tblwrap{border:1px solid var(--border);border-radius:10px;overflow:auto;margin-bottom:6px;}
    table.pd-tbl{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
    table.pd-tbl th,table.pd-tbl td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--border);}
    table.pd-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-hint);position:sticky;top:0;background:var(--bg-dark);}
    table.pd-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
    .cnt-atr{color:var(--danger);font-weight:700;}.cnt-pen{color:#ffa726;font-weight:700;}.cnt-res{color:var(--success);font-weight:700;}
    .efi{display:inline-block;min-width:44px;text-align:center;font-weight:800;padding:2px 8px;border-radius:20px;font-size:11px;}
    .efi.hi{background:rgba(102,187,106,.16);color:var(--success);}
    .efi.mid{background:rgba(255,167,38,.16);color:#ffa726;}
    .efi.lo{background:rgba(239,83,80,.16);color:var(--danger);}
    .dias{font-weight:800;color:var(--danger);}

    .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    @media(max-width:900px){ .two{grid-template-columns:1fr;} }

    .apoio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
    .apoio-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 15px;}
    .apoio-card .need{font-size:13px;font-weight:800;color:var(--danger);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .apoio-card .need small{color:var(--text-muted);font-weight:600;}
    .apoio-card .grp{margin-top:9px;}
    .apoio-card .grp .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-hint);margin-bottom:4px;}
    .cand{display:flex;align-items:center;gap:8px;font-size:12px;color:#ccc;padding:3px 0;}
    .cand .dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0;}
    .cand b{color:var(--text-white);}
    .cand .mot{color:var(--text-hint);font-size:11px;}

    .pd-msg{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}
    .pd-msg.err{color:var(--danger);}
    .cfg-aviso{background:var(--gold-bg);border:1px dashed var(--gold-border);border-radius:10px;padding:16px;color:var(--text-muted);font-size:13px;line-height:1.6;}
    .cfg-aviso b{color:var(--gold-light);}
    .no-access{max-width:520px;margin:60px auto;text-align:center;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:34px;}
    .no-access h2{color:var(--gold);font-size:18px;margin-bottom:8px;}
    .empty{color:var(--text-hint);font-style:italic;padding:14px;font-size:12.5px;}
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-shields"><img src="assets/escudo-pmmg.png" alt="PMMG" onerror="this.style.display='none'"><img src="assets/escudo-cpe.png" alt="CPE" onerror="this.style.display='none'"><img src="assets/brasao-bpmmamb.png" alt="BPM MAMB" onerror="this.style.display='none'"></div><div class="header-div"></div>
    <div class="header-title"><div class="header-kicker">CPE · BPM MAmb · 3ª Cia PM MAmb</div>
      <h1>PAINEL DE GESTÃO OPERACIONAL</h1>
      <p>3ª Cia PM MAmb — Acompanhamento 2026</p>
    </div>
  </div>
  <div class="header-right">
    <div id="user-info" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;" onclick="window.location.href='perfil.html'" title="Meu Perfil">
      <span id="user-avatar" style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">?</span>
      <span id="user-nome">—</span>
      <span id="user-badge" style="font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;"></span>
    </div>
    <button class="btn-outline" onclick="localStorage.removeItem('poe_sessao_v2');sessionStorage.removeItem('poe_sessao_v2');localStorage.removeItem('poe_sessao');window.location.href='index.html'">Sair</button>
  </div>
</header>

<script src="topnav.js" data-ativo="go"></script>

<div class="page-layout">
  <div class="rd-conteudo">

<div class="pd-wrap">
  <div class="pd-head">
    <div class="pd-badge">📋</div>
    <div>
      <h1>Painel de Demandas</h1>
      <div class="sub">Acompanhamento de demandas por tipo e grupamento — fonte: planilha de demandas.</div>
    </div>
    <div class="right">
      <select id="selAno" onchange="carregar()"><option value="">Todos os anos</option></select>
      <button class="btn-outline" onclick="carregar()">↻ Atualizar</button>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>

  <div id="conteudo"><div class="pd-msg">Carregando…</div></div>
</div>

  </div><!-- /rd-conteudo -->
</div><!-- /page-layout -->

<script>
/* ── guard + acesso (admins) ── */
const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{ const s=JSON.parse(raw); if(!s||!s.id){ window.location.href='index.html'; return null; } return s; }
  catch(e){ window.location.href='index.html'; return null; }
})();
if (sessao){
  document.getElementById('user-nome').textContent = sessao.nome || sessao.matricula;
  const ini=(sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent=ini;
  const b=document.getElementById('user-badge'), nv=sessao.nivel_acesso;
  const mp={admin_geral:['ADMIN GERAL','rgba(155,138,92,.2)','var(--gold)','var(--gold-border)'],admin:['ADMIN','rgba(155,138,92,.2)','var(--gold)','var(--gold-border)'],admin_pelotao:['ADMIN PELOTÃO','rgba(255,152,0,.15)','#ffa726','rgba(255,152,0,.4)'],admin_gp:['ADMIN GP','rgba(255,152,0,.15)','#ffa726','rgba(255,152,0,.4)']};
  const inf=mp[nv]||['OPERACIONAL','rgba(66,165,245,.15)','var(--info)','rgba(66,165,245,.3)'];
  b.textContent=inf[0]; b.style.cssText=`font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;background:${inf[0]?inf[1]:''};color:${inf[2]};border:1px solid ${inf[3]};`;
}

/* ── COLE AQUI a URL /exec do Web App (db/APPS-SCRIPT-demandas.gs) ── */
const DEMANDAS_SCRIPT_URL = 'COLE_AQUI_A_URL_EXEC';

const TIPO_LBL = { NUDEN:'NUDEN', DDU:'DDU', FTP:'FTP', EMERGENCIA:'Emergência', REQUISICAO:'Requisição', DENUNCIA:'Denúncia', MC:'MC' };
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function efiClass(e){ return e>=80?'hi':(e>=50?'mid':'lo'); }

let PRIMEIRA=true;
async function carregar(){
  const box=document.getElementById('conteudo');
  if(!DEMANDAS_SCRIPT_URL || DEMANDAS_SCRIPT_URL==='COLE_AQUI_A_URL_EXEC'){
    box.innerHTML='<div class="cfg-aviso">⚙️ <b>Painel de Demandas ainda não configurado.</b><br>Publique o Web App <b>db/APPS-SCRIPT-demandas.gs</b> na planilha de demandas e cole a URL <code>/exec</code> em <b>DEMANDAS_SCRIPT_URL</b> nesta página. Enquanto isso, o restante do painel funciona normalmente.</div>';
    return;
  }
  box.innerHTML='<div class="pd-msg">Carregando demandas…</div>';
  const ano=document.getElementById('selAno').value;
  try{
    const url=DEMANDAS_SCRIPT_URL + (ano?('?ano='+encodeURIComponent(ano)):'');
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    render(d);
    document.getElementById('stamp').textContent = d.atualizadoEm ? ('Atualizado: '+d.atualizadoEm) : '';
    if(PRIMEIRA && d.anos && d.anos.length){
      const sel=document.getElementById('selAno');
      d.anos.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=a; sel.appendChild(o); });
      PRIMEIRA=false;
    }
  }catch(e){
    box.innerHTML='<div class="pd-msg err">Não foi possível carregar as demandas.<br><small>'+esc(e.message)+'</small></div>';
  }
}

function render(d){
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lab">Recebidas</div><div class="val">${d.totalRec||0}</div></div>
    <div class="kpi red"><div class="lab">Atrasadas</div><div class="val">${d.totalAtr||0}</div></div>
    <div class="kpi amber"><div class="lab">Pendentes</div><div class="val">${d.totalPen||0}</div></div>
    <div class="kpi green"><div class="lab">Respondidas</div><div class="val">${d.totalRes||0}</div></div>
  </div>`;

  // Por tipo
  const tipoRows=(d.porTipo||[]).map(t=>`<tr><td><b>${esc(TIPO_LBL[t.key]||t.key)}</b></td><td class="num">${t.prazo}d</td>
    <td class="num">${t.rec}</td><td class="num cnt-atr">${t.atr}</td><td class="num cnt-pen">${t.pen}</td><td class="num cnt-res">${t.res}</td></tr>`).join('');
  const porTipo=`<div class="sec-title">Por tipo de demanda</div><div class="tblwrap"><table class="pd-tbl">
    <thead><tr><th>Tipo</th><th class="num">Prazo</th><th class="num">Receb.</th><th class="num">Atras.</th><th class="num">Pend.</th><th class="num">Resp.</th></tr></thead>
    <tbody>${tipoRows||'<tr><td colspan="6" class="empty">Sem dados.</td></tr>'}</tbody></table></div>`;

  // Por GP (só os com movimento)
  const gpRows=(d.porGP||[]).filter(g=>g.rec>0||g.efetivo>0).map(g=>`<tr>
    <td><b>${esc(g.gpCurto)}</b> <small style="color:var(--text-hint)">${g.pelotao}º PEL</small></td>
    <td class="num">${g.rec}</td><td class="num cnt-atr">${g.atr}</td><td class="num cnt-pen">${g.pen}</td><td class="num cnt-res">${g.res}</td>
    <td class="num">${g.efetivo}</td><td class="num">${g.disponiveis}</td>
    <td class="num"><span class="efi ${efiClass(g.eficiencia)}">${g.eficiencia}%</span></td></tr>`).join('');
  const porGP=`<div class="sec-title">Por grupamento</div><div class="tblwrap"><table class="pd-tbl">
    <thead><tr><th>Grupamento</th><th class="num">Receb.</th><th class="num">Atras.</th><th class="num">Pend.</th><th class="num">Resp.</th><th class="num">Efet.</th><th class="num">Dispon.</th><th class="num">Efic.</th></tr></thead>
    <tbody>${gpRows||'<tr><td colspan="8" class="empty">Sem dados.</td></tr>'}</tbody></table></div>`;

  // Atrasadas / Pendentes
  const atrRows=(d.atrasadas||[]).slice(0,200).map(a=>`<tr><td>${esc(TIPO_LBL[a.tipo]||a.tipo)}</td><td>${esc(a.gpCurto)}</td>
    <td>${esc(a.municipio)}</td><td>${esc(a.dataStr)}</td><td class="num"><span class="dias">${a.diasAtraso}d</span></td></tr>`).join('');
  const penRows=(d.pendentes||[]).slice(0,200).map(p=>`<tr><td>${esc(TIPO_LBL[p.tipo]||p.tipo)}</td><td>${esc(p.gpCurto)}</td>
    <td>${esc(p.municipio)}</td><td>${esc(p.dataStr)}</td><td class="num">${p.prazo}d</td></tr>`).join('');
  const listas=`<div class="two">
    <div><div class="sec-title" style="color:var(--danger)">Atrasadas (${(d.atrasadas||[]).length})</div>
      <div class="tblwrap"><table class="pd-tbl"><thead><tr><th>Tipo</th><th>GP</th><th>Município</th><th>Data</th><th class="num">Atraso</th></tr></thead>
      <tbody>${atrRows||'<tr><td colspan="5" class="empty">Nenhuma atrasada. ✓</td></tr>'}</tbody></table></div></div>
    <div><div class="sec-title" style="color:#ffa726">Pendentes (${(d.pendentes||[]).length})</div>
      <div class="tblwrap"><table class="pd-tbl"><thead><tr><th>Tipo</th><th>GP</th><th>Município</th><th>Data</th><th class="num">Prazo</th></tr></thead>
      <tbody>${penRows||'<tr><td colspan="5" class="empty">Nenhuma pendente. ✓</td></tr>'}</tbody></table></div></div>
  </div>`;

  // Sugestão de apoio
  const candHtml=(arr)=>arr.length?arr.map(c=>`<div class="cand"><span class="dot"></span><b>${esc(c.gp.gpCurto)}</b> <span class="mot">${esc(c.motivo)}</span></div>`).join(''):'<div class="empty" style="padding:4px 0;">—</div>';
  const apoioCards=(d.apoio||[]).filter(s=>s.intraPlotao.length||s.extraPlotao.length).slice(0,12).map(s=>`
    <div class="apoio-card">
      <div class="need">⚠️ ${esc(s.gpNecessita.gpCurto)} <small>(${s.gpNecessita.atr} atras. · ${s.gpNecessita.pen} pend.)</small></div>
      <div class="grp"><div class="lbl">Apoio no mesmo pelotão</div>${candHtml(s.intraPlotao)}</div>
      <div class="grp"><div class="lbl">Apoio de outros pelotões</div>${candHtml(s.extraPlotao)}</div>
    </div>`).join('');
  const apoio=apoioCards?`<div class="sec-title">🧠 Sugestão de apoio</div><div class="apoio-grid">${apoioCards}</div>`:'';

  // Férias hoje
  const fh=(d.feriasHoje||[]);
  const ferRows=fh.slice(0,200).map(f=>`<tr><td>${esc(f.militar)}</td><td>${esc(f.gpCurto)}</td><td>${esc(f.inicio)}</td><td>${esc(f.fim)}</td></tr>`).join('');
  const ferias=`<div class="sec-title">Militares em férias hoje (${fh.length})</div><div class="tblwrap"><table class="pd-tbl">
    <thead><tr><th>Militar</th><th>Grupamento</th><th>Início</th><th>Fim</th></tr></thead>
    <tbody>${ferRows||'<tr><td colspan="4" class="empty">Ninguém em férias hoje.</td></tr>'}</tbody></table></div>`;

  document.getElementById('conteudo').innerHTML = kpis + porTipo + porGP + listas + apoio + ferias;
}

carregar();
</script>
</body>
</html>
