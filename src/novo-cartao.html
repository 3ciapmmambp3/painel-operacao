<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){var s;try{s=localStorage.getItem('poe_theme');}catch(e){}if(!s)s=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',s);})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Cartão Programa — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <style>
    body{padding-bottom:70px;background:var(--bg-page)}
    .wrap{max-width:900px;margin:16px auto 0;padding:0 16px}
    .pagehead{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
    .pagehead h1{font-size:20px;font-weight:800;color:var(--text-white)}
    .pagehead .sub{font-size:12px;color:var(--text-muted)}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-top:16px}
    .card>h2{font-size:12px;font-weight:800;color:var(--gold-light);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px;border-left:3px solid var(--gold);padding-left:9px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
    .grid.three{grid-template-columns:repeat(3,1fr)}
    .f{display:flex;flex-direction:column;gap:5px;min-width:0}
    .f.col2{grid-column:span 2}
    label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
    label .req{color:var(--danger)}
    input,select,textarea{background:var(--bg-input);border:1px solid var(--border-mid);border-radius:7px;padding:9px 11px;color:var(--text-white);font-size:13px;outline:none;width:100%;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:var(--gold)}
    textarea{resize:vertical;min-height:70px}
    .hint{font-size:10.5px;color:var(--text-hint)}
    /* militar picker */
    .milbox{position:relative}
    .mil-drop{position:absolute;z-index:40;left:0;right:0;top:100%;margin-top:3px;background:var(--bg-card);border:1px solid var(--border-mid);border-radius:8px;max-height:260px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .mil-drop.open{display:block}
    .mil-opt{padding:8px 11px;font-size:12.5px;color:var(--text-white);cursor:pointer;border-bottom:1px solid var(--border)}
    .mil-opt:hover,.mil-opt.hi{background:var(--gold-bg)}
    .mil-opt small{display:block;font-size:10.5px;color:var(--text-hint)}
    .mil-opt.empty{color:var(--text-hint);cursor:default}
    /* demandas */
    .dem{border:1px solid var(--border-mid);border-radius:10px;padding:14px;margin-top:12px;background:var(--bg-input)}
    .dem .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .dem .dhead b{font-size:12px;color:var(--gold-light);letter-spacing:.3px}
    .dem .rm{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
    .chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted)}
    .chkline input{width:auto}
    .anx-zone{margin-top:10px;border:1px dashed var(--border-mid);border-radius:8px;padding:10px 12px}
    .anx-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .anx-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
    .anx-item{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:6px 9px}
    .anx-item .st{font-size:10px;padding:1px 6px;border-radius:10px}
    .anx-item .st.ok{color:var(--success);background:var(--success-bg)} .anx-item .st.up{color:#ffb300;background:rgba(255,179,0,.12)} .anx-item .st.err{color:var(--danger);background:var(--danger-bg)}
    .anx-item .x{margin-left:auto;background:none;border:none;color:var(--text-hint);cursor:pointer;font-size:14px}
    .btn{border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer}
    .btn.gold{background:var(--gold);color:#1a1000}.btn.gold:disabled{opacity:.5;cursor:not-allowed}
    .btn.ghost{background:transparent;border:1px solid var(--border-mid);color:var(--text-white)}
    .btn.small{padding:7px 13px;font-size:12px}
    .foot{position:sticky;bottom:0;margin-top:20px;background:linear-gradient(0deg,var(--bg-page) 72%,transparent);padding:14px 0 6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .msg{display:none;border-radius:8px;padding:11px 14px;font-size:13px;margin-top:14px}
    .msg.show{display:block}.msg.err{background:var(--danger-bg);border:1px solid var(--danger);color:#ef9a9a}.msg.ok{background:var(--success-bg);border:1px solid var(--success);color:#a5d6a7}
    @media(max-width:680px){.grid,.grid.three{grid-template-columns:1fr}.f.col2{grid-column:auto}}
  </style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <div class="header-shields"><img src="assets/escudo-cpe.png" onerror="this.style.display='none'"><img src="assets/escudo-pmmg.png" onerror="this.style.display='none'"><img src="assets/brasao-bpmmamb.png" onerror="this.style.display='none'"></div><div class="header-div"></div>
    <div class="header-title"><div class="header-kicker">CPE · BPM MAmb · 3ª Cia PM MAmb</div><h1>CARTÃO PROGRAMA</h1><p>Emissão de cartão de serviço</p></div>
  </div>
  <div class="header-right">
    <button class="btn-outline" onclick="window.location.href='cartao-programa.html'">Voltar</button>
  </div>
</header>
<script src="topnav.js" data-ativo="p3"></script>

<div class="wrap">
  <div class="pagehead">
    <div><h1 id="titulo">Novo Cartão Programa</h1><div class="sub" id="sub">Lance a escala, a equipe e as demandas para a equipe atender no turno.</div></div>
  </div>

  <!-- 1) Escala / Serviço -->
  <div class="card">
    <h2>Escala &amp; Serviço</h2>
    <div class="grid">
      <div class="f col2"><label>Grupamento <span class="req">*</span></label><select id="grupamento"><option value="">Selecione…</option></select></div>
      <div class="f"><label>Data de empenho <span class="req">*</span></label><input type="date" id="data_empenho"></div>
      <div class="f"><label>Turno de serviço</label><input list="dl-turno" id="turno" placeholder="07:00 ÀS 17:00"><datalist id="dl-turno"><option>07:00 ÀS 17:00</option><option>19:00 ÀS 07:00</option><option>07:00 ÀS 19:00</option><option>13:00 ÀS 22:00</option></datalist></div>
      <div class="f"><label>Equipe</label><input id="equipe" maxlength="4" placeholder="A" style="text-transform:uppercase"></div>
      <div class="f"><label>Tipo de serviço</label><input list="dl-tipo" id="tipo_servico" placeholder="PATRULHA RURAL"><datalist id="dl-tipo"><option>PATRULHA RURAL</option><option>PATRULHA URBANA</option><option>OPERAÇÃO</option><option>FISCALIZAÇÃO</option><option>APOIO</option></datalist></div>
      <div class="f"><label>Operação</label><select id="operacao_sel" onchange="operacaoChange()"><option value="">Nenhuma / não se aplica</option></select><span class="hint" id="operacao_hint"></span></div>
      <div class="f" id="box-operacao-outra" style="display:none"><label>Nome da operação</label><input id="operacao_outra" placeholder="Digite o nome da operação"></div>
    </div>
  </div>

  <!-- 2) Equipe empregada -->
  <div class="card">
    <h2>Equipe empregada</h2>
    <div class="grid">
      <div class="f col2 milbox"><label>Comandante da equipe</label><input id="comandante" placeholder="Busque por nome ou Nº PM" autocomplete="off" oninput="pick.filtrar('comandante')" onkeydown="pick.key(event,'comandante')"><div class="mil-drop" id="drop-comandante"></div></div>
      <div class="f col2 milbox"><label>Motorista</label><input id="motorista" placeholder="Busque por nome ou Nº PM" autocomplete="off" oninput="pick.filtrar('motorista')" onkeydown="pick.key(event,'motorista')"><div class="mil-drop" id="drop-motorista"></div></div>
      <div class="f"><label>Viatura</label><input id="viatura" list="dl-viaturas" autocomplete="off" placeholder="Selecione a cadastrada ou digite (ex.: emprestada de outra unidade)"><datalist id="dl-viaturas"></datalist></div>
      <div class="f"><label>Total de militares</label><input type="number" min="1" id="total_militares" placeholder="auto"></div>
    </div>
    <div style="margin-top:12px"><label style="display:block;margin-bottom:6px">Patrulheiros</label><div id="patrulheiros"></div>
      <button type="button" class="btn ghost small" style="margin-top:8px" onclick="addPatrulheiro()">+ Adicionar patrulheiro</button></div>
  </div>

  <!-- 3) Demandas -->
  <div class="card">
    <h2>Demandas para atendimento</h2>
    <div id="demandas"></div>
    <button type="button" class="btn ghost small" style="margin-top:12px" onclick="addDemanda()">+ Adicionar demanda</button>
    <div class="hint" id="anx-hint" style="margin-top:10px"></div>
  </div>

  <!-- 4) Observações -->
  <div class="card">
    <h2>Observações</h2>
    <div class="chkline" style="margin-bottom:10px"><input type="checkbox" id="alterou_escala" onchange="document.getElementById('box-motivo').style.display=this.checked?'':'none'"> <span>Houve alteração na escala?</span></div>
    <div class="f" id="box-motivo" style="display:none;margin-bottom:12px"><label>Motivo da alteração</label><input id="motivo_alteracao"></div>
    <div class="f"><label>Observações para a equipe</label><textarea id="observacoes_equipe"></textarea></div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="foot">
    <button class="btn gold" id="btn-salvar" onclick="salvar()">Emitir Cartão</button>
    <button class="btn ghost" onclick="window.location.href='cartao-programa.html'">Cancelar</button>
    <span class="hint" id="foothint"></span>
  </div>
</div>

<script>
/* ── Sessão / guarda ── */
const S = (typeof sessaoLer==='function') ? sessaoLer() : null;
if(!S){ location.href='index.html'; }
const NV = (typeof NIVEIS!=='undefined') ? NIVEIS : ['operacional','admin_gp','admin_pelotao','admin','admin_geral'];
const podeEmitir = !!S && NV.indexOf(S.nivel_acesso) >= NV.indexOf('admin_gp');
if(S && !podeEmitir){ alert('Apenas comandantes (GP, Pelotão, Cia) e Admin podem emitir Cartão Programa.'); location.href='cartao-programa.html'; }

/* Modo EDIÇÃO (?editar=<id>): a linha chega via sessionStorage (setada na listagem). */
let EDIT_ID=null, EDIT_ROW=null;
try{ const _eid=new URLSearchParams(location.search).get('editar'); if(_eid){ const _raw=sessionStorage.getItem('cartao_editar'); const _r=_raw?JSON.parse(_raw):null; if(_r && _r.id===_eid){ EDIT_ID=_eid; EDIT_ROW=_r; } } }catch(e){}
if(EDIT_ROW){ document.getElementById('titulo').textContent='Editar Cartão '+(EDIT_ROW.numero||''); document.getElementById('sub').textContent='As respostas já lançadas pela equipe são preservadas.'; }

const API=(typeof SB_AUTH_URL!=='undefined')?SB_AUTH_URL:'';
const AKEY=(typeof SB_AUTH_KEY!=='undefined')?SB_AUTH_KEY:'';
const H={'apikey':AKEY,'Authorization':`Bearer ${AKEY}`,'Content-Type':'application/json'};
const DRIVE_URL=(typeof CARTAO_DRIVE_URL!=='undefined')?CARTAO_DRIVE_URL:'';
const MAX_MB=15, IMG_MAX_DIM=1600, IMG_QUALITY=0.7;

const fmtPM=v=>{const d=(v||'').toString().replace(/\D/g,'');return d?((typeof _formatarMatricula==='function')?_formatarMatricula(d):d):'';};
function _esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function _grafiaGP(s){return String(s==null?'':s).replace(/MARILIERIA/gi,'MARLIERIA').replace(/MOLEVADE/gi,'MONLEVADE');}
function erro(m){const el=document.getElementById('msg');el.className='msg err show';el.innerHTML=m;el.scrollIntoView({behavior:'smooth',block:'center'});}
function okmsg(m){const el=document.getElementById('msg');el.className='msg ok show';el.innerHTML=m;}

/* ── Grupamentos (optgroups: Cia / Pelotões / GP) — padrão do painel ── */
const _grupReady = (async function(){
  try{
    const r=await fetch(`${API}/rest/v1/rpc/grupamentos_listar`,{method:'POST',headers:H,body:'{}'});
    const rows=await r.json()||[];
    const gpOpts=rows.map(g=>`<option value="${_esc(g.grupamento_completo)}">${_esc(_grafiaGP(g.grupamento_completo))}</option>`).join('');
    const pel={};let cia='';
    rows.forEach(g=>{const m=/^(\d+)\s*GP\s*\/\s*(\d+)\s*PEL\s*\/\s*(.+?)\s*\/\s*(.+)$/i.exec(g.grupamento_completo||'');if(!m)return;const gpN=+m[1],pelN=+m[2],ciaTxt=m[3].trim(),cidade=m[4].trim();if(!cia)cia=ciaTxt;if(!pel[pelN]||gpN<pel[pelN].gp)pel[pelN]={gp:gpN,label:`${pelN} PEL / ${ciaTxt} / ${cidade}`};});
    const pelOpts=Object.keys(pel).map(Number).sort((a,b)=>a-b).map(n=>`<option value="${_esc(pel[n].label)}">${_esc(pel[n].label)}</option>`).join('');
    const ciaOpt=cia?`<option value="${_esc(cia)}">${_esc(cia)}</option>`:'';
    document.getElementById('grupamento').insertAdjacentHTML('beforeend',
      (ciaOpt?`<optgroup label="Companhia">${ciaOpt}</optgroup>`:'')+(pelOpts?`<optgroup label="Pelotões">${pelOpts}</optgroup>`:'')+`<optgroup label="Grupamentos (GP)">${gpOpts}</optgroup>`);
    // pré-seleciona o grupamento do usuário, se bater
    if(S.grupamento_id){ const sel=document.getElementById('grupamento'); [...sel.options].forEach(o=>{ if(o.value && o.value.toUpperCase()===S.grupamento_id.toUpperCase()) sel.value=o.value; }); }
  }catch(e){ console.error('grupamentos',e); }
})();

/* ── Picker de militar (reutilizável: comandante, motorista, patrulheiros) ── */
let ROSTER=[];
const _norm=s=>(s||'').toString().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const _maskLive=v=>{const d=(v||'').toString().replace(/\D/g,'').slice(0,7);if(d.length<=3)return d;if(d.length<=6)return d.slice(0,3)+'.'+d.slice(3);return d.slice(0,3)+'.'+d.slice(3,6)+'-'+d.slice(6);};
const _linha=m=>`${fmtPM(m.matricula)} - ${m.posto_graduacao||''} - ${m.nome_completo||m.nome_guerra||''}`.replace(/\s+-\s+-\s+/g,' - ').replace(/\s+/g,' ').trim();
(async function(){ try{ const r=await fetch(`${API}/rest/v1/rpc/tta_listar_militares`,{method:'POST',headers:H,body:JSON.stringify({p_token:S.token})}); ROSTER=await r.json()||[]; }catch(e){} })();

const pick={
  _hi:{},
  filtrar(id){
    const inp=document.getElementById(id), drop=document.getElementById('drop-'+id);
    if(inp.value && !/[a-zA-ZÀ-ÿ]/.test(inp.value)){ const mk=_maskLive(inp.value); if(mk!==inp.value) inp.value=mk; }
    const q=_norm(inp.value.trim()); this._hi[id]=-1;
    let lista=ROSTER;
    if(q){ const qd=q.replace(/\D/g,''); lista=lista.filter(m=>_norm(_linha(m)).includes(q)||(qd&&(m.matricula||'').replace(/\D/g,'').includes(qd))); }
    lista=lista.slice(0,30);
    if(!ROSTER.length){ drop.innerHTML='<div class="mil-opt empty">Carregando efetivo…</div>'; drop.classList.add('open'); return; }
    if(!lista.length){ drop.classList.remove('open'); drop.innerHTML=''; return; }
    drop.innerHTML=lista.map(m=>`<div class="mil-opt" data-v="${_esc(_linha(m))}" onclick="pick.sel('${id}',this)">${_esc((m.posto_graduacao||'')+' '+(m.nome_completo||m.nome_guerra||''))}<small>Nº PM ${_esc(fmtPM(m.matricula))} · ${_esc((m.grupamento_id||'').split('/').pop().trim()||'—')}</small></div>`).join('');
    drop.classList.add('open');
  },
  key(e,id){ const drop=document.getElementById('drop-'+id);const opts=[...drop.querySelectorAll('.mil-opt:not(.empty)')];let hi=this._hi[id]??-1;
    if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hi+1,opts.length-1);}else if(e.key==='ArrowUp'){e.preventDefault();hi=Math.max(hi-1,0);}else if(e.key==='Enter'){if(opts[hi]){e.preventDefault();opts[hi].click();}return;}else if(e.key==='Escape'){drop.classList.remove('open');return;}else return;
    this._hi[id]=hi;opts.forEach((o,i)=>o.classList.toggle('hi',i===hi));if(opts[hi])opts[hi].scrollIntoView({block:'nearest'});},
  sel(id,el){ document.getElementById(id).value=el.getAttribute('data-v'); document.getElementById('drop-'+id).classList.remove('open'); }
};
document.addEventListener('click',e=>{ if(!e.target.closest('.milbox')) document.querySelectorAll('.mil-drop.open').forEach(d=>d.classList.remove('open')); });

/* ── Viaturas cadastradas (sugestões; aceita digitar outra, ex.: emprestada) ── */
(async function(){
  try{
    const r=await fetch(`${API}/rest/v1/viaturas?select=prefixo,marca_modelo&order=prefixo`,{headers:H});
    const rows=await r.json()||[];
    const dl=document.getElementById('dl-viaturas'); if(!dl||!Array.isArray(rows)) return;
    dl.innerHTML=rows.filter(v=>v.prefixo)
      .map(v=>`<option value="${_esc((v.prefixo||'')+(v.marca_modelo?(' - '+v.marca_modelo):''))}"></option>`).join('');
  }catch(e){}
})();

/* ── Operações cadastradas no painel (vigentes na data de empenho) ── */
let OPERACOES=[];
const _dia=v=>v?String(v).slice(0,10):'';
const _opReady=(async function(){
  try{ const r=await fetch(`${API}/rest/v1/rpc/operacoes_listar`,{method:'POST',headers:H,body:'{}'});
    const rows=await r.json()||[]; OPERACOES=(Array.isArray(rows)?rows:[]).map(o=>({nome:o.nome,inicio:_dia(o.inicio),final:_dia(o.final)})).filter(o=>o.nome);
  }catch(e){}
  fillOperacao();
})();
function _opVigente(o,data){ if(!data) return true; if(!o.inicio||!o.final) return true; return data>=o.inicio && data<=o.final; }
function fillOperacao(){
  const sel=document.getElementById('operacao_sel'); if(!sel) return;
  const data=(document.getElementById('data_empenho')||{}).value||'';
  const cur=sel.value;
  const vig=OPERACOES.filter(o=>_opVigente(o,data));
  let html='<option value="">Nenhuma / não se aplica</option>';
  if(vig.length) html+='<optgroup label="Operações cadastradas">'+vig.map(o=>`<option value="${_esc(o.nome)}">${_esc(o.nome)}</option>`).join('')+'</optgroup>';
  html+='<option value="__OUTRA__">Outra (digitar)…</option>';
  sel.innerHTML=html;
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
  const hint=document.getElementById('operacao_hint');
  if(hint) hint.textContent = (OPERACOES.length && !vig.length && data) ? 'Nenhuma operação vigente nesta data — use "Outra" se precisar.' : '';
  operacaoChange();
}
function operacaoChange(){
  const sel=document.getElementById('operacao_sel');
  const box=document.getElementById('box-operacao-outra');
  if(box) box.style.display = (sel && sel.value==='__OUTRA__') ? '' : 'none';
}
function prefillOperacao(nome){
  fillOperacao();   // repopula conforme a data já preenchida no prefill
  const sel=document.getElementById('operacao_sel'); if(!sel) return;
  if(!nome){ sel.value=''; operacaoChange(); return; }
  if([...sel.options].some(o=>o.value===nome)){ sel.value=nome; }
  else { sel.value='__OUTRA__'; const o=document.getElementById('operacao_outra'); if(o) o.value=nome; }
  operacaoChange();
}

/* ── Patrulheiros (dinâmicos) ── */
let patrSeq=0;
function addPatrulheiro(val){
  const id='patr-'+(++patrSeq);
  const wrap=document.createElement('div'); wrap.className='f milbox'; wrap.style.marginBottom='8px';
  wrap.innerHTML=`<div style="display:flex;gap:8px"><input id="${id}" placeholder="Busque por nome ou Nº PM" autocomplete="off" oninput="pick.filtrar('${id}')" onkeydown="pick.key(event,'${id}')" style="flex:1"><button type="button" class="btn ghost small" onclick="this.closest('.milbox').remove()">✕</button></div><div class="mil-drop" id="drop-${id}"></div>`;
  document.getElementById('patrulheiros').appendChild(wrap);
  if(val) document.getElementById(id).value=val;
}

/* ── Demandas (modelo de dados em JS) ── */
let DEM=[];
if(!DRIVE_URL){ document.getElementById('anx-hint').textContent='Anexos: o Drive do Cartão Programa ainda não está configurado — você pode colar o link de um arquivo do Drive manualmente em cada demanda.'; }
function addDemanda(obj){
  DEM.push(obj||{texto:'',municipio:'',endereco:'',anexos:[]});
  renderDemandas();
}
function rmDemanda(i){ DEM.splice(i,1); renderDemandas(); }
function renderDemandas(){
  const box=document.getElementById('demandas');
  box.innerHTML=DEM.map((d,i)=>`
    <div class="dem">
      <div class="dhead"><b>DEMANDA ${i+1}</b><button type="button" class="rm" onclick="rmDemanda(${i})">Remover</button></div>
      <div class="f"><label>Descrição da demanda</label><textarea oninput="DEM[${i}].texto=this.value" placeholder="O que a equipe deve fazer…">${_esc(d.texto)}</textarea></div>
      <div class="grid" style="margin-top:10px">
        <div class="f"><label>Município</label><input value="${_esc(d.municipio)}" oninput="DEM[${i}].municipio=this.value"></div>
        <div class="f"><label>Endereço / referência</label><input value="${_esc(d.endereco)}" oninput="DEM[${i}].endereco=this.value"></div>
      </div>
      <div class="anx-zone">
        <div class="anx-row">
          <label class="btn ghost small" style="cursor:pointer;margin:0">📎 Anexar arquivo<input type="file" multiple style="display:none" onchange="subirAnexos(${i},this.files)"></label>
          <input id="lk-${i}" placeholder="…ou cole o link do Drive" style="flex:1;min-width:180px">
          <button type="button" class="btn ghost small" onclick="addLink(${i})">Adicionar link</button>
        </div>
        <div class="anx-list" id="anx-${i}">${renderAnx(d.anexos,i)}</div>
      </div>
    </div>`).join('');
}
function renderAnx(anexos,di){
  return (anexos||[]).map((a,ai)=>{
    const st=a.status==='up'?'<span class="st up">enviando…</span>':a.status==='err'?`<span class="st err">erro</span>`:'<span class="st ok">ok</span>';
    const nome=a.link&&a.status!=='up'?`<a href="${_esc(a.link)}" target="_blank" style="color:var(--gold-light)">${_esc(a.nome||'anexo')}</a>`:_esc(a.nome||'anexo');
    return `<div class="anx-item">📄 ${nome} ${st}<button type="button" class="x" onclick="rmAnx(${di},${ai})">✕</button></div>`;
  }).join('');
}
function refreshAnx(di){ const el=document.getElementById('anx-'+di); if(el) el.innerHTML=renderAnx(DEM[di].anexos,di); }
function rmAnx(di,ai){ DEM[di].anexos.splice(ai,1); refreshAnx(di); }
function addLink(di){ const inp=document.getElementById('lk-'+di); const v=(inp.value||'').trim(); if(!v) return; DEM[di].anexos.push({nome:v.split('/').pop().slice(0,40)||'link',link:v,status:'ok'}); inp.value=''; refreshAnx(di); }

/* upload p/ Drive (conta do Cartão Programa) */
function b64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);}); }
async function comprimir(file){ if(!/^image\//.test(file.type)||/gif|svg/i.test(file.type))return file; try{const bmp=await createImageBitmap(file);const sc=Math.min(1,IMG_MAX_DIM/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',IMG_QUALITY));if(bl&&bl.size<file.size)return new File([bl],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});}catch(e){}return file; }
async function subirDrive(f){
  const payload={nome:f.name,mime:f.type||'application/octet-stream',ano:new Date().getFullYear(),subpasta:'cartao-programa',base64:await b64(f)};
  const r=await fetch(DRIVE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('Drive '+r.status);
  const j=await r.json(); if(!j||!j.link) throw new Error(j&&j.erro?j.erro:'Drive sem link');
  return {id:j.id||null,link:j.link};
}
function subirAnexos(di,files){
  if(!DRIVE_URL){ erro('Para anexar arquivos, configure o Drive do Cartão Programa (CARTAO_DRIVE_URL). Por enquanto use “colar link do Drive”.'); return; }
  [...files].forEach(async file=>{
    const item={nome:file.name,mime:file.type,tamanho:file.size,status:'up',link:null}; DEM[di].anexos.push(item); refreshAnx(di);
    try{ const f=await comprimir(file); if(f.size>MAX_MB*1048576) throw new Error('acima de '+MAX_MB+' MB'); item.nome=f.name; const res=await subirDrive(f); item.id=res.id; item.link=res.link; item.status='ok'; }
    catch(e){ item.status='err'; item.erro=e.message; } refreshAnx(di);
  });
}

/* ── data → mês automático ── */
const MESES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

/* ── coletar + salvar ── */
function patrulheirosValores(){ return [...document.querySelectorAll('#patrulheiros input')].map(i=>i.value.trim()).filter(Boolean); }
function coletar(){
  const data=document.getElementById('data_empenho').value;
  const patr=patrulheirosValores();
  const cmt=document.getElementById('comandante').value.trim();
  const mot=document.getElementById('motorista').value.trim();
  const totalInf=document.getElementById('total_militares').value;
  const totalAuto=(cmt?1:0)+(mot?1:0)+patr.length;
  return {
    grupamento_id:document.getElementById('grupamento').value,
    grupamento_completo:document.getElementById('grupamento').value,
    data_empenho:data,
    mes_servico:data?MESES[new Date(data+'T00:00:00').getMonth()]:'',
    turno:document.getElementById('turno').value.trim(),
    equipe:document.getElementById('equipe').value.trim().toUpperCase(),
    tipo_servico:document.getElementById('tipo_servico').value.trim(),
    operacao:(function(){const s=document.getElementById('operacao_sel').value; return s==='__OUTRA__'?document.getElementById('operacao_outra').value.trim():s;})(),
    comandante:cmt, motorista:mot, patrulheiros:patr,
    total_militares:totalInf||totalAuto||'',
    viatura:document.getElementById('viatura').value.trim(),
    alterou_escala:document.getElementById('alterou_escala').checked,
    motivo_alteracao:document.getElementById('motivo_alteracao').value.trim(),
    observacoes_equipe:document.getElementById('observacoes_equipe').value.trim(),
    demandas:DEM.map((d,i)=>({ordem:String(i+1),texto:d.texto.trim(),municipio:d.municipio.trim(),endereco:d.endereco.trim(),
      anexos:(d.anexos||[]).filter(a=>a.link&&a.status!=='up'&&a.status!=='err').map(a=>({nome:a.nome,mime:a.mime||null,tamanho:a.tamanho||null,link:a.link,id:a.id||null}))}))
  };
}
async function salvar(){
  const dados=coletar();
  if(!dados.grupamento_id){ erro('Selecione o grupamento.'); return; }
  if(!dados.data_empenho){ erro('Informe a data de empenho.'); return; }
  if(!dados.demandas.length || !dados.demandas.some(d=>d.texto)){ erro('Adicione ao menos uma demanda com descrição.'); return; }
  const btn=document.getElementById('btn-salvar'); const lbl=btn.textContent; btn.disabled=true; btn.textContent=EDIT_ID?'Salvando…':'Emitindo…';
  try{
    const url = EDIT_ID ? `${API}/rest/v1/rpc/cartao_editar` : `${API}/rest/v1/rpc/cartao_criar`;
    const body = EDIT_ID ? {p_token:S.token,p_id:EDIT_ID,dados} : {p_token:S.token,dados};
    const r=await fetch(url,{method:'POST',headers:H,body:JSON.stringify(body)});
    if(!r.ok) throw new Error(await r.text());
    const row=await r.json();
    okmsg('Cartão <b>Nº '+_esc(row.numero)+'</b> '+(EDIT_ID?'atualizado':'emitido')+'. Abrindo…');
    setTimeout(()=>{ location.href='cartao-programa.html?abrir='+encodeURIComponent(row.id); }, 700);
  }catch(e){ console.error(e); erro('Não foi possível salvar: '+_esc(e.message||e)); btn.disabled=false; btn.textContent=lbl; }
}

/* ── Prefill (modo edição) ── */
function prefill(r){
  const set=(id,v)=>{ const el=document.getElementById(id); if(el!=null) el.value=(v==null?'':v); };
  // grupamento (select) — tenta casar o value
  const gsel=document.getElementById('grupamento'); const gv=r.grupamento_completo||r.grupamento_id||'';
  [...gsel.options].forEach(o=>{ if(o.value && o.value.toUpperCase()===gv.toUpperCase()) gsel.value=o.value; });
  set('data_empenho',(r.data_empenho||'').slice(0,10)); set('turno',r.turno); set('equipe',r.equipe);
  set('tipo_servico',r.tipo_servico); prefillOperacao(r.operacao);
  set('comandante',r.comandante); set('motorista',r.motorista); set('viatura',r.viatura); set('total_militares',r.total_militares);
  (Array.isArray(r.patrulheiros)?r.patrulheiros:[]).filter(Boolean).forEach(p=>addPatrulheiro(p));
  if(r.alterou_escala){ document.getElementById('alterou_escala').checked=true; document.getElementById('box-motivo').style.display=''; set('motivo_alteracao',r.motivo_alteracao); }
  set('observacoes_equipe',r.observacoes_equipe);
  DEM=(Array.isArray(r.demandas)?r.demandas:[]).map(d=>({texto:d.texto||'',municipio:d.municipio||'',endereco:d.endereco||'',
    anexos:(d.anexos||[]).map(a=>({nome:a.nome,mime:a.mime,tamanho:a.tamanho,link:a.link,id:a.id,status:'ok'}))}));
  if(!DEM.length) DEM=[{texto:'',municipio:'',endereco:'',anexos:[]}];
  renderDemandas();
  document.getElementById('btn-salvar').textContent='Salvar alterações';
}

/* boot */
document.getElementById('data_empenho').value=new Date().toISOString().slice(0,10);
document.getElementById('data_empenho').addEventListener('change', fillOperacao);
fillOperacao();
if(EDIT_ROW){ Promise.all([_grupReady,_opReady]).then(()=>prefill(EDIT_ROW)).catch(()=>prefill(EDIT_ROW)); }
else { addDemanda(); }
</script>
