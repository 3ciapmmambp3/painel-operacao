<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
(function(){
  var saved;
  try{ saved=localStorage.getItem('poe_theme'); }catch(e){}
  if(!saved) saved=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Relatórios — 3ª Cia PM MAmb</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="auth.js"></script>
  <style>
    body{display:flex;flex-direction:column;min-height:100vh;}
    .mr-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin:20px;}
    .mr-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .mr-toolbar h2{font-size:14px;color:var(--text-white);}
    .mr-empty{color:var(--text-muted);font-size:13px;text-align:center;padding:40px 0;}
    table.mr-table{width:100%;border-collapse:collapse;font-size:13px;}
    table.mr-table th{text-align:left;color:var(--text-muted);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;}
    table.mr-table td{padding:10px;border-bottom:1px solid var(--border);color:var(--text-white);}
    .mr-btn-editar{color:var(--gold);font-weight:700;cursor:pointer;}
    .mr-btn-editar.disabled{color:var(--text-muted);cursor:not-allowed;position:relative;}
    .mr-tip{display:none;position:absolute;bottom:26px;right:0;background:var(--bg-dark);color:var(--text-white);font-size:11px;line-height:1.4;padding:8px 10px;border-radius:6px;border:1px solid var(--border);width:220px;z-index:10;}
    .mr-btn-editar.disabled:hover .mr-tip{display:block;}
    .mr-filtros{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .mr-filtro-input{background:var(--bg-dark);color:var(--text-white);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;}
    .mr-paginacao{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;}
    .mr-paginacao button:disabled{opacity:.4;cursor:not-allowed;}
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="header-logo"><img src="assets/header-pmmg.png" alt="PMMG"></div>
    <div class="header-title">
      <h1>PAINEL DE CONTROLE DE OPERAÇÕES</h1>
      <p>3ª Cia PM MAmb — Acompanhamento 2026</p>
    </div>
  </div>
  <div class="header-right">
    <div id="user-info" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:5px;" onclick="window.location.href='perfil.html'" title="Meu Perfil">
      <span id="user-avatar" style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">?</span>
      <span id="user-nome">—</span>
      <span id="user-badge" style="font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;"></span>
    </div>
    <button class="btn-outline" onclick="localStorage.removeItem('poe_sessao_v2');sessionStorage.removeItem('poe_sessao_v2');localStorage.removeItem('poe_sessao');window.location.href='index.html'">Sair</button>
  </div>
</header>

<nav class="tabs-bar">
  <div class="tab" onclick="window.location.href='painel.html'">🛡 OP POE</div>
  <div class="tab" onclick="window.location.href='painel.html'">🌿 OP GDO RURAL</div>
  <div class="tab" onclick="window.location.href='analise-criminal.html'" style="color:#ef5350;">🔴 ANÁLISE CRIMINAL</div>
  <div class="tab" onclick="window.location.href='painel.html'">📋 RELATÓRIOS</div>
  <div class="tab" onclick="window.location.href='painel.html'">📍 CONSULTA</div>
  <div class="tab" id="tab-btn-importacao" style="display:none" onclick="window.location.href='painel.html'">📥 IMPORTAÇÃO</div>
  <div class="tab active" onclick="window.location.href='meus-relatorios.html'">📄 MEUS RELATÓRIOS</div>
  <div class="tab" onclick="window.location.href='materiais-tco-semad.html'">📁 TCO / SEMAD</div>
</nav>

<main class="content">
  <div class="mr-card">
    <div class="mr-toolbar">
      <h2>Meus relatórios</h2>
      <button class="btn-gold" onclick="window.location.href='relatorio-servico.html'">+ Lançar relatório</button>
    </div>
    <div class="mr-filtros" id="mr-filtros">
      <select id="filtroFracao" class="mr-filtro-input"><option value="">Todas as Frações</option></select>
      <input type="date" id="filtroDataInicio" class="mr-filtro-input" title="Data início">
      <span style="color:var(--text-muted);font-size:12px;">até</span>
      <input type="date" id="filtroDataFim" class="mr-filtro-input" title="Data final">
      <button class="btn-outline" id="btnLimparFiltros">Limpar filtros</button>
    </div>
    <div id="mr-lista">
      <div class="mr-empty" id="mr-status">Carregando seus relatórios...</div>
    </div>
    <div class="mr-paginacao" id="mr-paginacao"></div>
  </div>
</main>

<script>
const sessao = (function(){
  const raw = sessionStorage.getItem('poe_sessao_v2');
  if(!raw){ window.location.href='index.html'; return null; }
  try{
    const s = JSON.parse(raw);
    if(!s || !s.id){ window.location.href='index.html'; return null; }
    return s;
  }catch(e){ window.location.href='index.html'; return null; }
})();

if (sessao){
  document.getElementById('user-nome').textContent = sessao.nome || sessao.matricula;
  const initials = (sessao.nome||'U').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  const badge = document.getElementById('user-badge');
  const nivel = sessao.nivel_acesso;
  const mapaBadge = {
    admin_geral: ['ADMIN GERAL', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin: ['ADMIN', 'rgba(155,138,92,.2)', 'var(--gold)', 'var(--gold-border)'],
    admin_pelotao: ['ADMIN PELOTÃO', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
    admin_gp: ['ADMIN GP', 'rgba(255,152,0,.15)', '#ffa726', 'rgba(255,152,0,.4)'],
  };
  const info = mapaBadge[nivel] || ['OPERACIONAL', 'rgba(66,165,245,.15)', 'var(--info)', 'rgba(66,165,245,.3)'];
  badge.textContent = info[0];
  badge.style.cssText = `font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;background:${info[1]};color:${info[2]};border:1px solid ${info[3]};`;
  if (nivel === 'admin_geral'){
    const btnImp = document.getElementById('tab-btn-importacao');
    if (btnImp) btnImp.style.display = '';
  }
}

/* A listagem em si (buscar relatórios onde essa matrícula aparece) depende de
   uma função nova no Apps Script que ainda vamos construir na próxima etapa.
   Por enquanto, o botão "+ Lançar relatório" já funciona normalmente. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw54z4GSAWrU3Np_69plA7SSRp845bt81vlHcH_LVa02B84GyJT7EUnhbwLBT9U0P2w/exec";

function formatarDataBR(iso){
  if (!iso) return '—';
  const [ano, mes, dia] = iso.split('-');
  return `${dia}/${mes}/${ano}`;
}

const ITENS_POR_PAGINA = 15;
let todosOsRelatorios = [];
let paginaAtual = 1;

// Preenche o filtro de Fração de Atuação com as frações que de fato aparecem
// nos relatórios carregados (não precisa de outra chamada ao backend).
function popularFiltroFracao(relatorios){
  const select = document.getElementById('filtroFracao');
  const fracoes = Array.from(new Set(relatorios.map(r => r['Fração de Atuação']).filter(Boolean))).sort();
  select.innerHTML = '<option value="">Todas as Frações</option>'
    + fracoes.map(f => `<option value="${f}">${f}</option>`).join('');
}

function aplicarFiltros(relatorios){
  const fracao = document.getElementById('filtroFracao').value;
  const dataInicio = document.getElementById('filtroDataInicio').value; // yyyy-mm-dd
  const dataFim = document.getElementById('filtroDataFim').value;
  return relatorios.filter(r => {
    if (fracao && r['Fração de Atuação'] !== fracao) return false;
    if (dataInicio && (!r['Data'] || r['Data'] < dataInicio)) return false;
    if (dataFim && (!r['Data'] || r['Data'] > dataFim)) return false;
    return true;
  });
}

function renderizarTabela(){
  const lista = document.getElementById('mr-lista');
  const paginacao = document.getElementById('mr-paginacao');
  const filtrados = aplicarFiltros(todosOsRelatorios);

  if (!filtrados.length){
    const msg = todosOsRelatorios.length
      ? 'Nenhum relatório encontrado com esses filtros.'
      : 'Nenhum relatório encontrado ainda.';
    lista.innerHTML = `<div class="mr-empty" id="mr-status">${msg}</div>`;
    paginacao.innerHTML = '';
    return;
  }

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / ITENS_POR_PAGINA));
  if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
  const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
  const pagina = filtrados.slice(inicio, inicio + ITENS_POR_PAGINA);

  const ehAdminGeral = sessao && sessao.nivel_acesso === 'admin_geral';

  const linhas = pagina.map(r => {
    const podeEditarEfetivo = r.podeEditar || ehAdminGeral;
    const btn = podeEditarEfetivo
      ? `<span class="mr-btn-editar" onclick="window.location.href='relatorio-servico.html?editar=${encodeURIComponent(r['ID Relatório'])}'">Editar</span>`
      : `<span class="mr-btn-editar disabled">Editar<div class="mr-tip">Entrar em contato com a P3 caso seja necessário alterar algo, já expirou o prazo para editar.</div></span>`;
    return `<tr>
      <td>${formatarDataBR(r['Data'])}</td>
      <td>${r['Fração de Atuação'] || '—'}</td>
      <td>${r['Início do Turno'] || '—'}</td>
      <td>${r['Fim do Turno'] || '—'}</td>
      <td>${r['Equipe'] || '—'}</td>
      <td>${r['Tipo de Serviço'] || '—'}</td>
      <td>${btn}</td>
    </tr>`;
  }).join('');

  lista.innerHTML = `<table class="mr-table">
    <thead><tr><th>DATA</th><th>FRAÇÃO DE ATUAÇÃO</th><th>INÍCIO DO TURNO</th><th>FIM DO TURNO</th><th>EQUIPE</th><th>SERVIÇO</th><th>AÇÃO</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;

  paginacao.innerHTML = `
    <button class="btn-outline" id="btnPagAnterior" ${paginaAtual === 1 ? 'disabled' : ''}>‹ Anterior</button>
    <span style="color:var(--text-muted);font-size:12px;">Página ${paginaAtual} de ${totalPaginas} (${filtrados.length} relatório${filtrados.length === 1 ? '' : 's'})</span>
    <button class="btn-outline" id="btnPagProxima" ${paginaAtual === totalPaginas ? 'disabled' : ''}>Próxima ›</button>
  `;
  const btnAnt = document.getElementById('btnPagAnterior');
  const btnProx = document.getElementById('btnPagProxima');
  if (btnAnt) btnAnt.addEventListener('click', () => { paginaAtual--; renderizarTabela(); });
  if (btnProx) btnProx.addEventListener('click', () => { paginaAtual++; renderizarTabela(); });
}

['filtroFracao', 'filtroDataInicio', 'filtroDataFim'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { paginaAtual = 1; renderizarTabela(); });
});
document.getElementById('btnLimparFiltros').addEventListener('click', () => {
  document.getElementById('filtroFracao').value = '';
  document.getElementById('filtroDataInicio').value = '';
  document.getElementById('filtroDataFim').value = '';
  paginaAtual = 1;
  renderizarTabela();
});

async function carregarMeusRelatorios(){
  const status = document.getElementById('mr-status');
  if (!sessao || !sessao.matricula){
    status.textContent = 'Não foi possível identificar sua matrícula na sessão.';
    return;
  }
  const ehAdminGeral = sessao.nivel_acesso === 'admin_geral';
  try {
    // Admin Geral vê TODOS os relatórios lançados, sem restrição de matrícula.
    const url = ehAdminGeral
      ? `${SCRIPT_URL}?action=meusRelatorios&matricula=${encodeURIComponent(sessao.matricula)}&todos=true`
      : `${SCRIPT_URL}?action=meusRelatorios&matricula=${encodeURIComponent(sessao.matricula)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.result !== 'success' || !data.relatorios || !data.relatorios.length){
      status.textContent = 'Nenhum relatório encontrado ainda.';
      return;
    }

    todosOsRelatorios = data.relatorios;
    paginaAtual = 1;
    popularFiltroFracao(todosOsRelatorios);
    renderizarTabela();
  } catch(err){
    console.error('Erro ao buscar Meus Relatórios:', err);
    status.textContent = 'Erro ao carregar seus relatórios. Recarregue a página.';
  }
}

if (sessao) carregarMeusRelatorios();
</script>

</body>
</html>
