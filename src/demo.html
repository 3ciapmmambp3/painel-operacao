<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo demonstração — Painel de Gestão Operacional</title>
<style>
  html,body{height:100%;margin:0;background:#0e1013;color:#d8c187;
    font-family:system-ui,Segoe UI,Arial,sans-serif;display:grid;place-items:center;text-align:center}
  .box{max-width:340px;padding:0 20px}
  .sp{width:26px;height:26px;border:3px solid #2b3138;border-top-color:#b59a5f;border-radius:50%;
    margin:0 auto 16px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  small{color:#736f66;display:block;margin-top:10px;font-size:12px}
</style>
</head>
<body>
  <div class="box">
    <div class="sp"></div>
    <div>Entrando em <b>modo demonstração</b>…</div>
    <small>Prévia navegável do painel reorganizado. Dados ilustrativos, somente para visualização.</small>
  </div>
<script>
/* ────────────────────────────────────────────────────────────────────
   MODO DEMONSTRAÇÃO — SOMENTE no branch de prévia (feat/hubs-por-secao).
   Cria uma sessão fictícia para navegar os hubs SEM login e manda para o
   "Meu Dia". NÃO deve ir para a produção — remover este arquivo antes de
   mesclar o branch no main.
   ──────────────────────────────────────────────────────────────────── */
try{
  sessionStorage.setItem('poe_sessao_v2', JSON.stringify({
    id: 'demo',
    matricula: '0000000',
    nome: 'Visitante (demonstração)',
    nome_guerra: 'VISITANTE',
    posto_graduacao: '',
    nivel_acesso: 'admin_geral',   // revela todos os hubs + ADM para a visão geral
    funcao: '',
    grupamento_id: 'DEMONSTRAÇÃO',
    token: 'demo-sem-token'
  }));
}catch(e){}
location.replace('inicio.html');
</script>
</body>
</html>
